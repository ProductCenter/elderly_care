<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#dcefe8" />
    <title>活力日历</title>
    <link rel="stylesheet" href="./css/app.css?v=20260801pay" />    <link rel="stylesheet" href="../css/app-shell.css?v=20260912-covers5" />

  </head>
  <body>
    <div class="phone" id="app">
      <div class="status-bar" aria-hidden="true">
        <span class="status-time">20:35</span>
        <div class="status-right">
          <svg class="status-signal" viewBox="0 0 18 12">
            <rect x="0" y="8" width="3" height="4" rx="0.5" fill="currentColor" />
            <rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="currentColor" />
            <rect x="9" y="2.5" width="3" height="9.5" rx="0.5" fill="currentColor" />
            <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor" opacity=".35" />
          </svg>
          <span class="status-net">5G</span>
          <div class="status-battery"><span class="battery-level"></span></div>
        </div>
      </div>

      <header class="nav-bar">
        <div class="nav-side">
          <a class="nav-back" href="./pay.html" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
        </div>
        <h1 class="nav-title">活力日历</h1>
        <div class="nav-side">
          <div class="mp-capsule" aria-label="小程序菜单">
            <button class="capsule-more" type="button" aria-label="更多">
              <span></span><span></span><span></span>
            </button>
            <i class="capsule-divider" aria-hidden="true"></i>
            <button class="capsule-home" type="button" aria-label="关闭">
              <span class="ring"></span>
            </button>
          </div>
        </div>
      </header>

      <main class="page-body has-cta">
        <section class="hero rise" style="padding-top: 4px">
          <div class="hero-kicker">Vitality Calendar</div>
          <h1 class="hero-title" style="font-size: 20px">把服务方案落成每日可执行任务</h1>
          <p class="hero-lead">打卡 · 状态追踪 · 亲友鼓励，形成活力长者落地闭环。</p>
        </section>

        <div class="stats-row rise rise-2" id="stats"></div>

        <section class="panel rise rise-3">
          <div class="cal-toolbar">
            <div class="cal-month" id="calMonth"></div>
            <div class="cal-nav">
              <button class="icon-btn" type="button" id="prevMonth" aria-label="上一月">‹</button>
              <button class="icon-btn" type="button" id="nextMonth" aria-label="下一月">›</button>
            </div>
          </div>
          <div class="weekdays">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </section>

        <section class="day-panel rise rise-4" id="dayPanel">
          <h3 id="dayTitle">今日任务</h3>
          <div class="task-list" id="taskList"></div>
        </section>

        <section class="section">
          <div class="section-head" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <div>
              <h2 class="section-title">亲友互动</h2>
              <p class="section-desc">查看进度、点赞鼓励活力坚持</p>
            </div>
            <button class="btn btn-ghost btn-sm" type="button" id="btnReset">重置</button>
          </div>
          <div class="feed" id="feed"></div>
        </section>

        <p class="footer-note">闭环：洞察 → 方案 → 支付 → 日历执行 → 打卡 → 互动</p>
      </main>

      <div class="cta-bar">
        <div class="btn-row">
          <a class="btn btn-ghost" href="./insight.html">健康洞察</a>
          <a class="btn btn-primary" href="./plan.html">服务方案</a>
        </div>
      </div>
    </div>

    <script src="./js/data.js?v=20260801pay"></script>
    <script>
      (function () {
        const { ensureState, isPlanPaid, toggleTask, toggleLike, countByStatus, toast, resetDemo } = HealthService;

        let state = ensureState();
        if (!isPlanPaid()) {
          toast("请先完成方案支付");
          setTimeout(() => {
            location.href = "./pay.html";
          }, 500);
          return;
        }
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        let viewYear = today.getFullYear();
        let viewMonth = today.getMonth();
        let selected = formatDate(today);

        function formatDate(d) {
          return [
            d.getFullYear(),
            String(d.getMonth() + 1).padStart(2, "0"),
            String(d.getDate()).padStart(2, "0"),
          ].join("-");
        }

        function parseDate(str) {
          const [y, m, d] = str.split("-").map(Number);
          return new Date(y, m - 1, d);
        }

        function dayStatus(dateStr) {
          const tasks = state.tasks.filter((t) => t.date === dateStr);
          if (!tasks.length) return null;
          if (tasks.some((t) => t.status === "overdue")) return "overdue";
          if (tasks.every((t) => t.status === "done")) return "done";
          return "pending";
        }

        function renderStats() {
          const c = countByStatus(state.tasks);
          document.getElementById("stats").innerHTML = `
            <div class="stat" data-tone="pending"><strong>${c.pending}</strong><span>待完成</span></div>
            <div class="stat" data-tone="done"><strong>${c.done}</strong><span>已完成</span></div>
            <div class="stat" data-tone="overdue"><strong>${c.overdue}</strong><span>逾期</span></div>
          `;
        }

        function renderCalendar() {
          document.getElementById("calMonth").textContent = `${viewYear}年${viewMonth + 1}月`;

          const first = new Date(viewYear, viewMonth, 1);
          const startPad = (first.getDay() + 6) % 7;
          const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
          const prevDays = new Date(viewYear, viewMonth, 0).getDate();

          const cells = [];
          for (let i = 0; i < startPad; i++) {
            const dayNum = prevDays - startPad + 1 + i;
            const dt = new Date(viewYear, viewMonth - 1, dayNum);
            cells.push({ date: formatDate(dt), day: dayNum, muted: true });
          }
          for (let d = 1; d <= daysInMonth; d++) {
            const dt = new Date(viewYear, viewMonth, d);
            cells.push({ date: formatDate(dt), day: d, muted: false });
          }
          while (cells.length % 7 !== 0) {
            const overflow = cells.length - (startPad + daysInMonth) + 1;
            const dt = new Date(viewYear, viewMonth + 1, overflow);
            cells.push({ date: formatDate(dt), day: overflow, muted: true });
          }

          const todayStr = formatDate(today);
          document.getElementById("calGrid").innerHTML = cells
            .map((c) => {
              const st = dayStatus(c.date);
              const classes = [
                "day",
                c.muted ? "is-muted" : "",
                c.date === todayStr ? "is-today" : "",
                c.date === selected ? "is-selected" : "",
                st === "pending" ? "has-task" : "",
                st === "done" ? "has-done" : "",
                st === "overdue" ? "has-overdue" : "",
              ]
                .filter(Boolean)
                .join(" ");
              return `<button class="${classes}" type="button" data-date="${c.date}">${c.day}</button>`;
            })
            .join("");
        }

        function renderTasks() {
          const d = parseDate(selected);
          const label =
            selected === formatDate(today)
              ? "今日任务"
              : `${d.getMonth() + 1}月${d.getDate()}日任务`;
          document.getElementById("dayTitle").textContent = label;

          const tasks = state.tasks.filter((t) => t.date === selected);
          const list = document.getElementById("taskList");
          if (!tasks.length) {
            list.innerHTML = `<div class="empty">这一天暂无服务任务</div>`;
            return;
          }

          list.innerHTML = tasks
            .map((t) => {
              const statusLabel =
                t.status === "done" ? "已完成" : t.status === "overdue" ? "逾期" : "待完成";
              const btnLabel = t.status === "done" ? "取消" : "打卡";
              return `
              <article class="task is-${t.status}" data-id="${t.id}">
                <div>
                  <div class="task-title">${t.title}</div>
                  <div class="task-meta">
                    <span>${t.time}</span>
                    <span>${t.member}</span>
                    <span class="status-pill ${t.status}">${statusLabel}</span>
                  </div>
                </div>
                <button class="btn btn-sm ${t.status === "done" ? "btn-ghost" : "btn-primary"}" type="button" data-check="${t.id}">
                  ${btnLabel}
                </button>
              </article>`;
            })
            .join("");
        }

        function renderFeed() {
          document.getElementById("feed").innerHTML = state.feed
            .map(
              (f) => `
            <article class="feed-item" data-id="${f.id}">
              <div class="feed-avatar" style="background:${f.color}">${f.initial}</div>
              <div class="feed-body">
                <strong>${f.name}</strong>
                <span>${f.text}</span>
                <span style="margin-top:4px;display:block">${f.time}</span>
              </div>
              <button class="like-btn ${f.liked ? "is-liked" : ""}" type="button" data-like="${f.id}">
                ${f.liked ? "已赞" : "点赞"} · ${f.likes}
              </button>
            </article>`
            )
            .join("");
        }

        function refresh() {
          state = ensureState();
          renderStats();
          renderCalendar();
          renderTasks();
          renderFeed();
        }

        document.getElementById("calGrid").addEventListener("click", (e) => {
          const btn = e.target.closest(".day");
          if (!btn || btn.classList.contains("is-muted")) return;
          selected = btn.dataset.date;
          renderCalendar();
          renderTasks();
        });

        document.getElementById("taskList").addEventListener("click", (e) => {
          const btn = e.target.closest("[data-check]");
          if (!btn) return;
          state = toggleTask(btn.dataset.check);
          const after = state.tasks.find((t) => t.id === btn.dataset.check);
          toast(after.status === "done" ? "打卡成功" : "已取消打卡");
          refresh();
        });

        document.getElementById("feed").addEventListener("click", (e) => {
          const btn = e.target.closest("[data-like]");
          if (!btn) return;
          state = toggleLike(btn.dataset.like);
          toast("互动已更新");
          renderFeed();
        });

        document.getElementById("prevMonth").addEventListener("click", () => {
          viewMonth -= 1;
          if (viewMonth < 0) {
            viewMonth = 11;
            viewYear -= 1;
          }
          renderCalendar();
        });

        document.getElementById("nextMonth").addEventListener("click", () => {
          viewMonth += 1;
          if (viewMonth > 11) {
            viewMonth = 0;
            viewYear += 1;
          }
          renderCalendar();
        });

        document.getElementById("btnReset").addEventListener("click", () => {
          state = resetDemo();
          selected = formatDate(today);
          viewYear = today.getFullYear();
          viewMonth = today.getMonth();
          toast("演示已重置");
          refresh();
        });

        refresh();
      })();
    </script>    <script src="../js/app-shell.js?v=20260912-covers5"></script>

  </body>
</html>
