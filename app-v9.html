<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6eee2" />
    <title>春风康养</title>
    <link rel="stylesheet" href="./css/app-v9.css?v=20260918-v9b" />
  </head>
  <body>
    <div class="phone" id="app" data-no-tabbar>
      <!-- 阳台头图（全屏沉浸） -->
      <div class="home-hero-art-wrap" aria-hidden="true">
        <img class="home-hero-art" src="./assets/home/home-hero-full-bg-v3.png" alt="" />
      </div>

      <div class="status-bar" aria-hidden="true">
        <span class="status-time" id="statusTime">9:41</span>
        <div class="status-right">
          <svg class="status-signal" viewBox="0 0 18 12">
            <rect x="0" y="8" width="3" height="4" rx="0.5" fill="currentColor" />
            <rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="currentColor" />
            <rect x="9" y="2.5" width="3" height="9.5" rx="0.5" fill="currentColor" />
            <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor" />
          </svg>
          <svg class="status-wifi" viewBox="0 0 16 12">
            <path
              fill="currentColor"
              d="M8 9.6a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zm0-3.7c1.5 0 2.9.6 3.9 1.6l-1.3 1.3A3.3 3.3 0 0 0 8 8.1c-.9 0-1.7.3-2.4.8L4.3 7.6A5.3 5.3 0 0 1 8 5.9zm0-3.8c2.5 0 4.8 1 6.5 2.7L13.2 6A7.4 7.4 0 0 0 8 3.9 7.4 7.4 0 0 0 2.8 6L1.5 4.8A10.5 10.5 0 0 1 8 2.1z"
            />
          </svg>
          <div class="status-battery"><span class="battery-level"></span></div>
        </div>
      </div>

      <header class="home-top">
        <button type="button" class="home-loc" id="btnSite" aria-label="切换站点">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"
            />
          </svg>
          <span id="siteName">柳州市春风社区中心站</span>
          <svg class="home-loc-caret" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M8 10l4 4 4-4"
            />
          </svg>
        </button>
        <div class="mp-capsule" aria-hidden="true">
          <button type="button" class="capsule-more" aria-label="更多"><i></i><i></i><i></i></button>
          <i class="capsule-divider"></i>
          <button type="button" class="capsule-home" aria-label="关闭"><i class="ring"></i></button>
        </div>
      </header>

      <main class="home-body">
        <section class="home-hero" aria-label="问候与今日健康">
          <div class="home-hero-copy">
            <h1 class="home-greet">早上好，<em>林阿姨</em></h1>
            <p class="home-date">8月13日&nbsp;&nbsp;农历七月初十</p>
            <article class="health-card" aria-label="今日健康">
              <h2>今日健康</h2>
              <ul>
                <li>
                  <div class="hc-top">
                    <span class="hc-label">血压</span>
                    <i class="hc-ring" style="--p:78" aria-hidden="true"></i>
                  </div>
                  <p class="hc-val"><strong>128/76</strong><em>mmHg</em></p>
                </li>
                <li>
                  <div class="hc-top">
                    <span class="hc-label">心率</span>
                    <i class="hc-ring" style="--p:72" aria-hidden="true"></i>
                  </div>
                  <p class="hc-val"><strong>72</strong><em>次/分</em></p>
                </li>
                <li class="is-steps">
                  <div class="hc-top">
                    <span class="hc-label">步数</span>
                    <i class="hc-ring is-warn" style="--p:46" aria-hidden="true"></i>
                  </div>
                  <p class="hc-val"><strong>3,684</strong><em>步</em></p>
                </li>
              </ul>
            </article>
          </div>
        </section>

        <div class="ai-remind-stack">
          <a class="ai-cta" href="./health-service/insight.html">
            <span class="ai-cta-label"><b>AI</b>研判</span>
            <i class="ai-cta-go" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9.2 6.8 15.4 12 9.2 17.2"
                />
              </svg>
            </i>
          </a>

          <a class="remind-card" href="./health-service/calendar.html">
            <span class="remind-tabs" aria-hidden="true"></span>
            <span class="remind-bell">
              <img src="./assets/home/home-remind-bell-v2.png" alt="" />
            </span>
            <span class="remind-copy">
              <strong>提醒：小儿子李伟的生日</strong>
              <em>还有<span>5天</span> · 5月18日</em>
            </span>
          </a>
        </div>

        <section class="entry-grid" aria-label="快捷入口">
          <a class="entry-card is-plan" href="./health-service/plan.html">
            <h3>健康计划</h3>
            <img src="./assets/home/home-entry-plan-v2.png" alt="" />
            <span class="entry-go" aria-hidden="true">›</span>
          </a>
          <a class="entry-card is-med" href="./health-service/index.html">
            <h3>用药管理</h3>
            <img src="./assets/home/home-entry-med-v2.png" alt="" />
            <span class="entry-go" aria-hidden="true">›</span>
          </a>
          <a class="entry-card is-cal" href="./health-service/calendar.html">
            <h3>家庭日历</h3>
            <img src="./assets/home/home-entry-calendar-v2.png" alt="" />
            <span class="entry-go" aria-hidden="true">›</span>
          </a>
          <a class="entry-card is-fam" href="./mine.html">
            <h3>家人时光</h3>
            <img src="./assets/home/home-entry-family-v2.png" alt="" />
            <span class="entry-go" aria-hidden="true">›</span>
          </a>
        </section>

        <section class="feed-row" aria-labelledby="feedTitle">
          <h2 class="feed-title" id="feedTitle"><i></i>今日动态</h2>
          <a class="feed-more" href="./broadcast.html">全部 <span>›</span></a>
        </section>
      </main>

      <nav class="home-tabbar" aria-label="主导航">
        <a class="tab active" href="./app-v9.html" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 3.2 3.4 10.5V21h5.6v-6h6v6h5.6V10.5L12 3.2z" />
            <path
              fill="none"
              stroke="#fff"
              stroke-width="1.6"
              stroke-linecap="round"
              d="M9.2 14.6c.8 1.1 1.8 1.7 2.8 1.7s2-.6 2.8-1.7"
            />
          </svg>
          <span>首页</span>
        </a>
        <a class="tab" href="./health-building.html">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 20.4S4.4 15.2 4.4 9.6A4.4 4.4 0 0 1 12 7.2a4.4 4.4 0 0 1 7.6 2.4c0 5.6-7.6 10.8-7.6 10.8z"
            />
            <path
              stroke="currentColor"
              stroke-width="1.55"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M7.8 12.1h2.1l1.1-2.2 1.5 4.2 1.1-2h2.6"
            />
          </svg>
          <span>健康</span>
        </a>
        <a class="tab-mid" href="./agent.html" aria-label="打开智伴">
          <span class="agent-bubble">今天的风很舒服⛅</span>
          <span class="tab-avatar">
            <img src="./assets/home/home-tab-avatar-v2.png" alt="小暖" />
          </span>
        </a>
        <a class="tab" href="./index.html">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
              d="M4.8 8.4h14.4l-1.1 11.4H5.9z"
            />
            <path
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              d="M9 8.4V6.8a3 3 0 0 1 6 0v1.6"
            />
          </svg>
          <span>商城</span>
        </a>
        <a class="tab" href="./mine.html">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8.2" r="3.1" stroke="currentColor" stroke-width="1.7" />
            <path
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              d="M5.6 19.2c1.1-3 3.3-4.5 6.4-4.5s5.3 1.5 6.4 4.5"
            />
          </svg>
          <span>我的</span>
        </a>
      </nav>

      <div class="wx-toast" id="toast" hidden></div>
      <div class="site-mask" id="siteMask" hidden></div>
      <div class="site-sheet" id="siteSheet" hidden role="dialog" aria-labelledby="siteSheetTitle">
        <div class="site-sheet-hd">
          <strong id="siteSheetTitle">选择服务站点</strong>
          <button type="button" class="site-sheet-close" id="siteSheetClose">关闭</button>
        </div>
        <div class="site-sheet-bd" id="siteList"></div>
      </div>
    </div>

    <script src="./js/app-v9.js?v=20260918-v9"></script>
  </body>
</html>
