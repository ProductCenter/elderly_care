<!DOCTYPE html>

    <style>
      .page-wrap { padding: 12px 12px 88px; }

      .tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }

      .tabs button.on { background: #f08a2a; color: #fff; border-color: #f08a2a; }

      .biz-card h3 { margin: 0 0 4px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .biz-card p { margin: 0; font-size: 12px; color: #8a7a68; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .biz-meta { display: flex; gap: 8px; margin-top: 8px; font-size: 11px; color: #e36a12; flex-wrap: nowrap; overflow: hidden; }
      .biz-card a { display: inline-block; margin-top: 8px; font-size: 12px; color: #e36a12; font-weight: 650; text-decoration: none; white-space: nowrap; }
      .nav-back { border:0; background:transparent; font-size:28px; line-height:1; padding:0 8px; color:#2b241c; }
