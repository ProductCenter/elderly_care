<style>
  .hub-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 1100px) { .hub-grid { grid-template-columns: 1fr; } }
  .hub-card {
    background: #fff; border: 1px solid var(--line, #e5e6eb); border-radius: 12px;
    padding: 16px 18px 14px; box-shadow: 0 6px 18px rgba(31,35,41,.04);
  }
  .hub-card h2 { margin: 0 0 6px; font-size: 16px; }
  .hub-card p { margin: 0 0 12px; color: #646a73; font-size: 13px; line-height: 1.55; }
  .hub-links { display: grid; gap: 8px; }
  .hub-links a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border: 1px solid #eef0f3; border-radius: 8px;
    text-decoration: none; color: #1f2329; font-size: 13px; background: #fafbfc;

  .hub-links a:hover { border-color: #c9d7ff; background: #f5f8ff; color: #2f6bff; }
  .hub-links em { font-style: normal; color: #8f959e; font-size: 12px; }
  .hub-priority {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, #fff5f5 0%, #fff 60%);
    border: 1px solid #ffc9c9;
    box-shadow: 0 8px 24px rgba(220,38,38,.08);
  }
  .hub-priority h2 { color: #b91c1c; }
  .hub-priority .hub-links a {
    border-color: #fecaca; background: #fff;
  }
  .hub-priority .hub-links a.priority-main {
    border-color: #f87171; background: linear-gradient(90deg, #fef2f2, #fff);
    font-weight: 600; color: #b91c1c;
  }
  .hub-priority .hub-links a.priority-main:hover {
    border-color: #ef4444; background: #fef2f2; color: #dc2626;
  }
  .hub-priority .hub-links a.priority-main em { color: #ef4444; font-weight: 600; }
  .tag-priority {
    display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 4px;
    background: #dc2626; color: #fff; font-size: 11px; font-weight: 600;
  }
  .flow {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin: 0 0 16px; padding: 12px 14px; background: #f7f9fc; border-radius: 10px;
    border: 1px solid #eef0f3; font-size: 13px; color: #646a73;
  }
  .flow b { color: #1f2329; font-weight: 600; }
  .flow i { font-style: normal; color: #c0c4cc; }
</style>
