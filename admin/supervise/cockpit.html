<style>
  .filter-bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 12px; padding: 10px 14px;
    background: rgba(15, 40, 70, 0.55); border: 1px solid rgba(110, 160, 220, 0.28);
    border-radius: 10px;
  }
  .filter-bar label { font-size: 12px; color: #8fb0d9; margin-right: 4px; }
  .filter-bar select {
    height: 30px; padding: 0 10px; border-radius: 6px;
    border: 1px solid rgba(110, 160, 220, 0.35); background: rgba(10, 30, 55, 0.8);
    color: #e8f1ff; font-size: 12px;
  }
  .alert-strip {
    display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px;
  }
  .alert-chip {
    padding: 8px 12px; border-radius: 8px; font-size: 12px;
    border: 1px solid rgba(248, 113, 113, 0.4); background: rgba(127, 29, 29, 0.35); color: #fecaca;
  }
  .alert-chip strong { color: #fff; margin-right: 4px; }
  .rank-list { list-style: none; margin: 0; padding: 0; }
  .rank-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid rgba(110, 160, 220, 0.15); font-size: 13px;
  }
  .rank-list li:last-child { border-bottom: none; }
  .rank-list .idx { color: #6ea0dc; width: 24px; }
  .rank-list .val { color: #9ec5ff; font-weight: 600; }
  .table-mini { width: 100%; border-collapse: collapse; font-size: 12px; }
  .table-mini th, .table-mini td {
    padding: 8px 10px; text-align: left; border-bottom: 1px solid rgba(110, 160, 220, 0.15);
  }
  .table-mini th { color: #8fb0d9; font-weight: 500; }
  .table-mini td { color: #c7dbf5; }
  .badge-warn { color: #fbbf24; }
  .badge-ok { color: #34d399; }
  .badge-err { color: #f87171; }
</style>

    <section class="panel">

<script src="../js/admin-nav.js?v=20260821c"></script>
<script src="../js/admin-shell.js"></script>
<script>
(function () {
  function tick() {
    var el = document.getElementById("clockNow");
    if (el) el.textContent = new Date().toLocaleString("zh-CN", { hour12: false });
  }
  tick();
  setInterval(tick, 1000);
  var btn = document.getElementById("btnFullscreen");
  if (btn) {
    btn.addEventListener("click", function () {
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
    });
  }
  /* lightweight placeholder charts */
  var charts = [
    { id: "chartRegion", bars: [82, 68, 54, 48, 36], labels: ["河西", "南开", "和平", "河东", "河北"] },
    { id: "chartCategory", bars: [35, 28, 22, 15], labels: ["护理", "租赁", "助餐", "团购"] },
    { id: "chartFulfill", bars: [91, 92, 93, 94, 93, 94, 94], labels: ["W1","W2","W3","W4","W5","W6","W7"] },
    { id: "chartSubsidy", bars: [120, 135, 128, 142, 138, 156, 148], labels: ["7/1","7/8","7/15","7/22","7/29","8/5","8/12"] },
    { id: "chartComplaint", bars: [42, 28, 18, 12], labels: ["服务", "押金", "质量", "其他"] },
    { id: "chartMerchant", bars: [120, 98, 48, 20], labels: ["A", "B", "C", "D"] },
  ];
  charts.forEach(function (c) {
    var box = document.getElementById(c.id);
    if (!box) return;
    var max = Math.max.apply(null, c.bars);
    box.innerHTML = '<div style="display:flex;align-items:flex-end;gap:6px;height:160px;padding:8px 0">' +
      c.bars.map(function (v, i) {
        var h = Math.round((v / max) * 130);
        return '<div style="flex:1;text-align:center"><div style="height:' + h + 'px;background:linear-gradient(180deg,#3b82f6,#1d4ed8);border-radius:4px 4px 0 0;margin:0 auto;width:70%"></div><div style="font-size:10px;color:#8fb0d9;margin-top:4px">' + c.labels[i] + '</div></div>';
      }).join("") + '</div>';
  });
})();
</script>
