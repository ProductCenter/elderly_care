<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>供给监管 · 天津康养运营平台</title>
<link rel="stylesheet" href="../css/admin-shell.css"/>
<link rel="stylesheet" href="../css/admin-list.css"/>
</head>
<body data-primary="supervise" data-sub="supply" data-tab="供给监管" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div>
<template id="page-content">
<div class="page-head">
  <div>
    <h1 class="page-title">供给监管</h1>
    <p class="page-desc">服务与商品供给上架审核、库存合规、价格异常监测</p>
  </div>
  <div style="display:flex;gap:8px">
    <a class="btn btn-default" href="./index.html">监管总览</a>
    <button type="button" class="btn btn-primary" id="btnAdd">+ 登记供给项</button>
  </div>
</div>
<div class="stat-row"><div class="stat-card"><div class="k">启用</div><div class="v" id="stOn">0</div></div><div class="stat-card"><div class="k">停用</div><div class="v" id="stOff">0</div></div><div class="stat-card"><div class="k">草稿</div><div class="v" id="stDraft">0</div></div><div class="stat-card"><div class="k">全部</div><div class="v" id="stAll">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>关键词</label><input class="ctrl" id="qKeyword" placeholder="名称/编号"/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="在售">在售</option><option value="下架">下架</option><option value="待审核">待审核</option><option value="违规">违规</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>供给编号</th><th>供给名称</th><th>商户</th><th>品类</th><th>标价</th><th>库存/产能</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer">
  <div class="drawer-head"><h3 id="drawerTitle">登记供给项</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
  <div class="drawer-body"><div class="form-grid"><div class="form-field"><label>名称<span class="req">*</span></label><input class="ctrl" id="fName" type="text"  placeholder=""/></div><div class="form-field"><label>编号<span class="req">*</span></label><input class="ctrl" id="fCode" type="text"  placeholder=""/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="在售">在售</option><option value="下架">下架</option><option value="待审核">待审核</option><option value="违规">违规</option></select></div><div class="form-field"><label>备注</label><textarea class="ctrl" id="fNote" rows="3" placeholder=""></textarea></div></div></div>
  <div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div>
</aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script>
<script src="../js/admin-shell.js"></script>
<script src="../js/admin-ui.js"></script>
<script src="../js/admin-page-list.js"></script>
<script>
AdminPageList.mount({
  addTitle: "登记供给项",
  editTitle: "编辑",
  viewTitle: "查看详情",
  storageKey: "supervise:supply",
  rows: [{"supplyId":"SP202608001","name":"上门护理2小时","merchant":"康护到家","category":"护理","price":"¥168","stock":"充足","status":"在售","note":""},{"supplyId":"SP202607088","name":"轮椅月租","merchant":"夕阳红辅具","category":"租赁","price":"¥120/月","stock":"12台","status":"在售","note":""},{"supplyId":"SP202608002","name":"异常低价套餐","merchant":"某商户C","category":"团购","price":"¥0.01","stock":"—","status":"违规","note":"价格异常"}],
  columns: [{key:"supplyId"},{key:"name"},{key:"merchant"},{key:"category"},{key:"price"},{key:"stock"},{key:"status",status:true}],
  filters: [{id:"qKeyword",match:(r,v)=>!v||String(r.supplyId||"").includes(v)||String(r.name||"").includes(v)||String(r.merchant||"").includes(v)},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v}],
  formFields: [{id:"fName",key:"name",type:"text",label:"名称",required:true},{id:"fCode",key:"code",type:"text",label:"编号",required:true},{id:"fStatus",key:"status",type:"select",label:"状态",required:false},{id:"fNote",key:"note",type:"text",label:"备注",required:false}],
  stats: [{id:"stOn",html:false,value:(l)=>l.filter(r=>r.status==="启用").length},{id:"stOff",html:false,value:(l)=>l.filter(r=>r.status==="停用").length},{id:"stDraft",html:false,value:(l)=>l.filter(r=>r.status==="草稿").length},{id:"stAll",html:false,value:(l)=>l.length}],
  getStatus:(r)=>(r.status==="在售"?{text:r.status,cls:"status-on"}:r.status==="待审核"?{text:r.status,cls:"status-warn"}:{text:r.status,cls:"status-off"})
});
</script>
</body>
</html>
