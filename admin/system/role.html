<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>权限管理 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="system" data-sub="role" data-tab="权限管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">权限管理</h1><p class="page-desc">管理角色信息，并为角色分配权限</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新增角色</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">角色数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">启用</div><div class="v" id="stOn">0</div></div><div class="stat-card"><div class="k">关联用户</div><div class="v" id="stUsers">0</div></div><div class="stat-card"><div class="k">系统内置</div><div class="v" id="stSys">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>角色名称</label><input class="ctrl" id="qKeyword" /></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="启用">启用</option><option value="停用">停用</option></select></div><div class="filter-item"><label>内置</label><select class="ctrl" id="qBuiltin"><option value="">全部</option><option value="是">是</option><option value="否">否</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>角色名称</th><th>编码</th><th>关联用户</th><th>权限摘要</th><th>内置</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新增角色</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>角色名称<span class="req">*</span></label><input class="ctrl" id="fName" /></div><div class="form-field"><label>编码<span class="req">*</span></label><input class="ctrl" id="fCode" /></div><div class="form-field"><label>关联用户数</label><input class="ctrl" id="fUsers" type="number" value="0" /></div><div class="form-field"><label>权限摘要</label><input class="ctrl" id="fPerms" /></div><div class="form-field"><label>系统内置</label><select class="ctrl" id="fBuiltin"><option value="否">否</option><option value="是">是</option></select></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="启用">启用</option><option value="停用">停用</option></select></div><div class="form-field full"><label>说明</label><textarea class="ctrl" id="fNote"></textarea></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u589e\u89d2\u8272",editTitle:"编辑",rows:[{name:"系统管理员",code:"admin",users:2,perms:"全部权限",builtin:"是",status:"启用",note:""},{name:"楼长",code:"floor_leader",users:5,perms:"楼层/巡查/审批",builtin:"是",status:"启用",note:""},{name:"护士",code:"nurse",users:14,perms:"健康/用药/评估",builtin:"是",status:"启用",note:""},{name:"护理员",code:"caregiver",users:46,perms:"护理任务/健康录入",builtin:"是",status:"启用",note:""},{name:"访客只读",code:"guest",users:0,perms:"工作台只读",builtin:"否",status:"停用",note:""}],columns:[{key:"name"},{key:"code"},{key:"users"},{key:"perms"},{key:"builtin"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"qBuiltin",match:(r,v)=>!v||String(r.builtin)===v}],formFields:[{id:"fName",key:"name",type:"text",label:"角色名称",required:true},{id:"fCode",key:"code",type:"text",label:"编码",required:true},{id:"fUsers",key:"users",type:"number",label:"关联用户数",default:0},{id:"fPerms",key:"perms",type:"text",label:"权限摘要"},{id:"fBuiltin",key:"builtin",type:"select",label:"系统内置"},{id:"fStatus",key:"status",type:"select",label:"状态"},{id:"fNote",key:"note",type:"textarea",label:"说明"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stOn",html:false,value:(l)=>l.filter(r=>r.status==="启用").length},{id:"stUsers",html:false,value:(l)=>l.reduce((s,r)=>s+r.users,0)},{id:"stSys",html:false,value:(l)=>l.filter(r=>r.builtin==="是").length}],getStatus:(r)=>({text:r.status,cls:r.status==="启用"?"status-on":"status-off"}),rowActions:null,onAction:null});</script>
</body></html>
