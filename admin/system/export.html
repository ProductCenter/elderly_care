<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>数据导出 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="system" data-sub="export" data-tab="数据导出" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">数据导出</h1><p class="page-desc">支持各模块数据导出为 Excel，可选择时间段与数据类型</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新建导出任务</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">导出任务</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">已完成</div><div class="v" id="stOk">0</div></div><div class="stat-card"><div class="k">进行中</div><div class="v" id="stRun">0</div></div><div class="stat-card"><div class="k">失败</div><div class="v" id="stFail">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>模块</label><input class="ctrl" id="qKeyword" /></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="排队中">排队中</option><option value="进行中">进行中</option><option value="已完成">已完成</option><option value="失败">失败</option></select></div><div class="filter-item"><label>格式</label><select class="ctrl" id="qFmt"><option value="">全部</option><option value="Excel">Excel</option><option value="CSV">CSV</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>任务编号</th><th>模块</th><th>时间范围</th><th>格式</th><th>创建人</th><th>创建时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新建导出任务</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>导出模块</label><select class="ctrl" id="fModule"><option value="长者信息">长者信息</option><option value="费用统计">费用统计</option><option value="健康检测">健康检测</option><option value="护理任务">护理任务</option><option value="咨询统计">咨询统计</option></select></div><div class="form-field"><label>时间范围<span class="req">*</span></label><input class="ctrl" id="fRange" /></div><div class="form-field"><label>格式</label><select class="ctrl" id="fFmt"><option value="Excel">Excel</option><option value="CSV">CSV</option></select></div><div class="form-field"><label>创建人</label><input class="ctrl" id="fBy" /></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="排队中">排队中</option><option value="进行中">进行中</option><option value="已完成">已完成</option><option value="失败">失败</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u5efa\u5bfc\u51fa\u4efb\u52a1",editTitle:"编辑",rows:[{no:"EX20260730001",module:"费用统计",range:"2026-07-01 ~ 2026-07-31",fmt:"Excel",by:"财务小王",time:"2026-07-30 09:20",status:"已完成"},{no:"EX20260729002",module:"健康检测",range:"2026-07-01 ~ 2026-07-29",fmt:"Excel",by:"李护士",time:"2026-07-29 16:02",status:"进行中"},{no:"EX20260728003",module:"长者信息",range:"全部",fmt:"CSV",by:"管理员",time:"2026-07-28 11:10",status:"失败"}],columns:[{key:"no"},{key:"module"},{key:"range"},{key:"fmt"},{key:"by"},{key:"time"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.module||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"qFmt",match:(r,v)=>!v||String(r.fmt)===v}],formFields:[{id:"fModule",key:"module",type:"select",label:"导出模块"},{id:"fRange",key:"range",type:"text",label:"时间范围",required:true},{id:"fFmt",key:"fmt",type:"select",label:"格式"},{id:"fBy",key:"by",type:"text",label:"创建人"},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stOk",html:false,value:(l)=>l.filter(r=>r.status==="已完成").length},{id:"stRun",html:false,value:(l)=>l.filter(r=>r.status==="进行中").length},{id:"stFail",html:false,value:(l)=>l.filter(r=>r.status==="失败").length}],getStatus:(r)=>({text:r.status,cls:r.status==="已完成"?"status-on":r.status==="失败"?"status-repair":"status-busy"}),rowActions:(r,i)=> r.status==="已完成"?`<button type="button" class="link" data-act="dl" data-i="${i}">下载</button>`:`<button type="button" class="link" data-edit="${i}">查看</button>`,onAction:(act,i,data)=>{ if(act==="dl") alert("开始下载 "+data[i].no+"（演示）"); }});</script>
</body></html>
