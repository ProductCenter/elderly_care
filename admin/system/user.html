<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>用户管理 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="system" data-sub="user" data-tab="用户管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">用户管理</h1><p class="page-desc">管理本养老院内使用本系统的所有用户信息</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新增用户</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">用户数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">启用</div><div class="v" id="stOn">0</div></div><div class="stat-card"><div class="k">停用</div><div class="v" id="stOff">0</div></div><div class="stat-card"><div class="k">管理员</div><div class="v" id="stAdmin">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>姓名 / 账号</label><input class="ctrl" id="qKeyword" /></div><div class="filter-item"><label>角色</label><select class="ctrl" id="qRole"><option value="">全部</option><option value="管理员">管理员</option><option value="楼长">楼长</option><option value="护士">护士</option><option value="护理员">护理员</option><option value="财务">财务</option></select></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="启用">启用</option><option value="停用">停用</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>手机</th><th>所属分组</th><th>最近登录</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新增用户</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>账号<span class="req">*</span></label><input class="ctrl" id="fAccount" /></div><div class="form-field"><label>姓名<span class="req">*</span></label><input class="ctrl" id="fName" /></div><div class="form-field"><label>角色</label><select class="ctrl" id="fRole"><option value="管理员">管理员</option><option value="楼长">楼长</option><option value="护士">护士</option><option value="护理员">护理员</option><option value="财务">财务</option></select></div><div class="form-field"><label>手机</label><input class="ctrl" id="fPhone" /></div><div class="form-field"><label>所属分组</label><input class="ctrl" id="fGroup" /></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="启用">启用</option><option value="停用">停用</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u589e\u7528\u6237",editTitle:"编辑",rows:[{account:"admin",name:"管理员",role:"管理员",phone:"138****0000",group:"行政组",last:"2026-07-30 09:10",status:"启用"},{account:"zhaomin",name:"赵敏",role:"护理员",phone:"137****6652",group:"护理一组",last:"2026-07-30 08:02",status:"启用"},{account:"lihuishi",name:"李护士",role:"护士",phone:"136****9088",group:"医疗组",last:"2026-07-29 18:40",status:"启用"},{account:"caiwu01",name:"财务小王",role:"财务",phone:"135****1122",group:"行政组",last:"2026-07-28 11:20",status:"停用"}],columns:[{key:"account"},{key:"name"},{key:"role"},{key:"phone"},{key:"group"},{key:"last"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v)||String(r.account||"").includes(v))},{id:"qRole",match:(r,v)=>!v||String(r.role)===v},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v}],formFields:[{id:"fAccount",key:"account",type:"text",label:"账号",required:true},{id:"fName",key:"name",type:"text",label:"姓名",required:true},{id:"fRole",key:"role",type:"select",label:"角色"},{id:"fPhone",key:"phone",type:"text",label:"手机"},{id:"fGroup",key:"group",type:"text",label:"所属分组"},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stOn",html:false,value:(l)=>l.filter(r=>r.status==="启用").length},{id:"stOff",html:false,value:(l)=>l.filter(r=>r.status==="停用").length},{id:"stAdmin",html:false,value:(l)=>l.filter(r=>r.role==="管理员").length}],getStatus:(r)=>({text:r.status,cls:r.status==="启用"?"status-on":"status-off"}),rowActions:null,onAction:null});</script>
</body></html>
