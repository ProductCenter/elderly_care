<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>会员权益核销分账计算 · 天津康养运营平台</title>
<link rel="stylesheet" href="../css/admin-shell.css"/>
<link rel="stylesheet" href="../css/admin-list.css"/>
</head>
<body data-primary="finance" data-sub="share-member" data-tab="会员权益核销分账计算" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div>
<template id="page-content">
<div class="page-head">
  <div>
    <h1 class="page-title">会员权益核销分账计算</h1>
    <p class="page-desc">会员权益核销后自动计算各方应得分账金额，关联订单与权益批次</p>
  </div>
  <div style="display:flex;gap:8px">
    <a class="btn btn-default" href="./index.html">收益分享总览</a>
    <button type="button" class="btn btn-primary" id="btnAdd">+ 登记核销分账</button>
  </div>
</div>
<div class="stat-row"><div class="stat-card"><div class="k">待计算</div><div class="v" id="stPend">0</div></div><div class="stat-card"><div class="k">已分账</div><div class="v" id="stDone">0</div></div><div class="stat-card"><div class="k">异常</div><div class="v" id="stErr">0</div></div><div class="stat-card"><div class="k">全部</div><div class="v" id="stAll">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>关键词</label><input class="ctrl" id="qKeyword" placeholder="名称/编号"/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待计算">待计算</option><option value="已分账">已分账</option><option value="异常">异常</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>订单号</th><th>会员</th><th>权益项</th><th>核销金额</th><th>平台分账</th><th>商户分账</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer">
  <div class="drawer-head"><h3 id="drawerTitle">登记核销分账</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
  <div class="drawer-body"><div class="form-grid"><div class="form-field"><label>订单号<span class="req">*</span></label><input class="ctrl" id="fOrder" type="text"  placeholder=""/></div><div class="form-field"><label>会员<span class="req">*</span></label><input class="ctrl" id="fMember" type="text"  placeholder=""/></div><div class="form-field"><label>权益项<span class="req">*</span></label><input class="ctrl" id="fBenefit" type="text"  placeholder=""/></div><div class="form-field"><label>核销金额</label><input class="ctrl" id="fAmount" type="number" value="0" placeholder=""/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="待计算">待计算</option><option value="已分账">已分账</option><option value="异常">异常</option></select></div></div></div>
  <div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div>
</aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script>
<script src="../js/admin-shell.js"></script>
<script src="../js/admin-ui.js"></script>
<script src="../js/admin-page-list.js"></script>
<script>
AdminPageList.mount({
  addTitle: "登记核销分账",
  editTitle: "编辑",
  viewTitle: "查看详情",
  storageKey: "finance:share-member",
  rows: [{"orderId":"O20260728031","member":"安辉","benefit":"上门护理2次","amount":"¥168","platformAmt":"¥8.4","merchantAmt":"¥159.6","status":"已分账","note":""},{"orderId":"O20260730012","member":"张伟","benefit":"理发权益","amount":"¥38","platformAmt":"—","merchantAmt":"—","status":"待计算","note":""},{"orderId":"O20260801005","member":"李娜","benefit":"辅具租赁券","amount":"¥120","platformAmt":"—","merchantAmt":"—","status":"异常","note":"权益批次不匹配"}],
  columns: [{key:"orderId"},{key:"member"},{key:"benefit"},{key:"amount"},{key:"platformAmt"},{key:"merchantAmt"},{key:"status",status:true}],
  filters: [{id:"qKeyword",match:(r,v)=>!v||String(r.orderId||"").includes(v)||String(r.member||"").includes(v)||String(r.benefit||"").includes(v)},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v}],
  formFields: [{id:"fOrder",key:"orderId",type:"text",label:"订单号",required:true},{id:"fMember",key:"member",type:"text",label:"会员",required:true},{id:"fBenefit",key:"benefit",type:"text",label:"权益项",required:true},{id:"fAmount",key:"amount",type:"number",label:"核销金额",required:false},{id:"fStatus",key:"status",type:"select",label:"状态",required:false}],
  stats: [{id:"stPend",html:false,value:(l)=>l.filter(r=>r.status==="待计算").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已分账").length},{id:"stErr",html:false,value:(l)=>l.filter(r=>r.status==="异常").length},{id:"stAll",html:false,value:(l)=>l.length}],
  getStatus:(r)=>(r.status==="已分账"?{text:r.status,cls:"status-on"}:r.status==="待计算"?{text:r.status,cls:"status-warn"}:{text:r.status,cls:"status-off"})
});
</script>
</body>
</html>
