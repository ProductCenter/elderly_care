<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>药品配置 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="config" data-sub="drug" data-tab="药品配置" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">药品配置</h1><p class="page-desc">管理养老院所有在库药品基础信息</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新增药品</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">药品数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">在用</div><div class="v" id="stOn">0</div></div><div class="stat-card"><div class="k">处方药</div><div class="v" id="stRx">0</div></div><div class="stat-card"><div class="k">品类</div><div class="v" id="stCats">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>药品 / 编码</label><input class="ctrl" id="qKeyword" /></div><div class="filter-item"><label>品类</label><select class="ctrl" id="qCat"><option value="">全部</option><option value="心血管">心血管</option><option value="降糖">降糖</option><option value="抗感染">抗感染</option><option value="其他">其他</option></select></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="在用">在用</option><option value="停用">停用</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>编码</th><th>药品名称</th><th>规格</th><th>品类</th><th>处方药</th><th>单位</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新增药品</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>编码<span class="req">*</span></label><input class="ctrl" id="fCode" /></div><div class="form-field"><label>药品名称<span class="req">*</span></label><input class="ctrl" id="fName" /></div><div class="form-field"><label>规格</label><input class="ctrl" id="fSpec" /></div><div class="form-field"><label>品类</label><select class="ctrl" id="fCat"><option value="心血管">心血管</option><option value="降糖">降糖</option><option value="抗感染">抗感染</option><option value="其他">其他</option></select></div><div class="form-field"><label>处方药</label><select class="ctrl" id="fRx"><option value="是">是</option><option value="否">否</option></select></div><div class="form-field"><label>单位</label><input class="ctrl" id="fUnit" /></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="在用">在用</option><option value="停用">停用</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u589e\u836f\u54c1",editTitle:"编辑",rows:[{code:"YP001",name:"氨氯地平",spec:"5mg*28片",cat:"心血管",rx:"是",unit:"盒",status:"在用"},{code:"YP002",name:"二甲双胍",spec:"0.5g*48片",cat:"降糖",rx:"是",unit:"盒",status:"在用"},{code:"YP003",name:"阿司匹林肠溶片",spec:"100mg*30片",cat:"心血管",rx:"是",unit:"盒",status:"在用"},{code:"YP004",name:"碘伏消毒液",spec:"100ml",cat:"其他",rx:"否",unit:"瓶",status:"在用"},{code:"YP005",name:"旧版感冒颗粒",spec:"10g*9袋",cat:"其他",rx:"否",unit:"盒",status:"停用"}],columns:[{key:"code"},{key:"name"},{key:"spec"},{key:"cat"},{key:"rx"},{key:"unit"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v)||String(r.code||"").includes(v))},{id:"qCat",match:(r,v)=>!v||String(r.cat)===v},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v}],formFields:[{id:"fCode",key:"code",type:"text",label:"编码",required:true},{id:"fName",key:"name",type:"text",label:"药品名称",required:true},{id:"fSpec",key:"spec",type:"text",label:"规格"},{id:"fCat",key:"cat",type:"select",label:"品类"},{id:"fRx",key:"rx",type:"select",label:"处方药"},{id:"fUnit",key:"unit",type:"text",label:"单位"},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stOn",html:false,value:(l)=>l.filter(r=>r.status==="在用").length},{id:"stRx",html:false,value:(l)=>l.filter(r=>r.rx==="是").length},{id:"stCats",html:false,value:(l)=>new Set(l.map(r=>r.cat)).size}],getStatus:(r)=>({text:r.status,cls:r.status==="在用"?"status-on":"status-off"}),rowActions:null,onAction:null});</script>
</body></html>
