<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>服务要素配置 · 天津康养运营平台</title>
    <link rel="stylesheet" href="../css/admin-shell.css" />
    <link rel="stylesheet" href="../css/admin-list.css" />
    <style>
      .intro-card {
        background: linear-gradient(135deg, #f0f7ff 0%, #fff 55%);
        border: 1px solid #e6f0ff;
        border-radius: 8px;
        padding: 14px 18px;
        margin-bottom: 12px;
      }
      .intro-card h2 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
        color: #1677ff;
      }
      .intro-card p {
        margin: 0;
        font-size: 13px;
        color: #595959;
        line-height: 1.6;
      }
      .cat-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .cat-chip {
        font-size: 12px;
        color: #1677ff;
        background: #e6f4ff;
        border-radius: 4px;
        padding: 3px 8px;
      }
      .tag {
        display: inline-block;
        margin: 0 4px 2px 0;
        padding: 1px 6px;
        border-radius: 4px;
        background: #f5f5f5;
        color: #595959;
        font-size: 12px;
      }
      .tag.goal {
        background: #f6ffed;
        color: #389e0d;
      }
    </style>
  </head>
  <body
    data-primary="mall"
    data-sub="service-element"
    data-tab="服务要素"
    data-asset-prefix="../../assets"
    data-index-href="../index.html"
  >
    <div id="admin-root"></div>
    <template id="page-content">
      <div class="page-head">
        <div>
          <h1 class="page-title">服务要素配置</h1>
          <p class="page-desc">能力模板层：按最小 8 项定义可复用规则；由服务项目实例化到具体供给方</p>
        </div>
        <div style="display: flex; gap: 8px">
          <a class="btn btn-default" href="../mall/service-items.html" style="text-decoration: none">服务项目</a>
          <a class="btn btn-default" href="../mall/service-packages.html" style="text-decoration: none">服务套餐</a>
          <a class="btn btn-primary" href="./service-element-form.html?mode=add" style="text-decoration: none">+ 新建服务要素</a>
        </div>
      </div>

      <div class="intro-card">
        <h2>三层关系 · 本页为要素模板</h2>
        <p>
          <strong>服务要素</strong>（能力模板）→ <strong>服务项目</strong>（食堂/站点实例，锁结算主体）→ <strong>服务套餐</strong>（天数/价格/供餐方式/销售渠道）。
          要素不含堂食/送餐；餐饮可配置分餐次自动核销（午餐 13:00、晚餐 19:00）。商城货架只是渠道之一。
        </p>
        <div class="cat-chips" id="catLegend"></div>
      </div>

      <div class="stat-row">
        <div class="stat-card"><div class="k">要素总数</div><div class="v" id="stTotal">0</div></div>
        <div class="stat-card"><div class="k">启用中</div><div class="v" id="stOn">0</div></div>
        <div class="stat-card"><div class="k">需人工审核</div><div class="v" id="stReview">0</div></div>
        <div class="stat-card"><div class="k">到家交付</div><div class="v" id="stHome">0</div></div>
      </div>

      <div class="filter-card">
        <div class="filter-grid">
          <div class="filter-item">
            <label>名称 / 编码</label>
            <input class="ctrl" id="qKeyword" type="text" placeholder="请输入名称或编码" />
          </div>
          <div class="filter-item">
            <label>服务类别</label>
            <select class="ctrl" id="qCategory">
              <option value="">全部</option>
            </select>
          </div>
          <div class="filter-item">
            <label>交付方式</label>
            <select class="ctrl" id="qDelivery">
              <option value="">全部</option>
            </select>
          </div>
          <div class="filter-item">
            <label>状态</label>
            <select class="ctrl" id="qStatus">
              <option value="">全部</option>
            </select>
          </div>
          <div class="filter-item">
            <label>是否需审核</label>
            <select class="ctrl" id="qReview">
              <option value="">全部</option>
            </select>
          </div>
          <div class="filter-actions">
            <button type="button" class="btn btn-primary" id="btnSearch">查询</button>
            <button type="button" class="btn btn-default" id="btnReset">重置</button>
          </div>
        </div>
      </div>

      <div class="list-card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>编码</th>
                <th>要素名称</th>
                <th>类别</th>
                <th>服务目标</th>
                <th>交付方式</th>
                <th>履约规则</th>
                <th>单价</th>
                <th>需审核</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="body"></tbody>
          </table>
        </div>
        <div class="pager">
          <span id="pagerInfo">共 0 条</span>
          <div class="pager-btns"></div>
        </div>
      </div>
    </template>

    <script src="../js/admin-nav.js?v=20260821c"></script>
    <script src="../js/admin-shell.js"></script>
    <script src="../js/admin-ui.js"></script>
    <script src="../js/service-element-data.js?v=20260824"></script>
    <script>
      (function () {
        const D = window.ServiceElementData;
        let data = AdminStore.load(D.STORE_KEY, D.SEED);
        let page = 1;
        const pageSize = 10;
        const $ = (id) => document.getElementById(id);

        function formUrl(mode, code) {
          const q = new URLSearchParams({ mode });
          if (code) q.set("code", code);
          return `./service-element-form.html?${q.toString()}`;
        }

        function fillFilterSelect(id, options, allLabel) {
          const el = $(id);
          if (!el) return;
          el.innerHTML =
            `<option value="">${allLabel || "全部"}</option>` +
            options.map((o) => `<option value="${o}">${o}</option>`).join("");
        }

        function ruleText(r) {
          const days = (r.serviceDays || []).join("");
          const time =
            r.timeStart && r.timeEnd ? `${r.timeStart}–${r.timeEnd}` : r.timeStart || r.timeEnd || "";
          const radius = r.serviceRadius > 0 ? `；${r.serviceRadius}公里内` : "";
          const freq = r.frequency ? `${r.frequency}·` : "";
          const main = [days, time].filter(Boolean).join(" ");
          return `${freq}${main || "—"}${radius}`;
        }

        function filtered() {
          const kw = ($("qKeyword")?.value || "").trim();
          const cat = $("qCategory")?.value || "";
          const delivery = $("qDelivery")?.value || "";
          const st = $("qStatus")?.value || "";
          const review = $("qReview")?.value || "";
          return data.filter((r) => {
            if (kw && !(String(r.name || "").includes(kw) || String(r.code || "").includes(kw))) return false;
            if (cat && r.category !== cat) return false;
            if (delivery && r.delivery !== delivery) return false;
            if (st && r.status !== st) return false;
            if (review && r.needReview !== review) return false;
            return true;
          });
        }

        function renderStats(list) {
          $("stTotal").textContent = list.length;
          $("stOn").textContent = list.filter((r) => r.status === "启用").length;
          $("stReview").textContent = list.filter((r) => r.needReview === "是").length;
          $("stHome").textContent = list.filter((r) => r.delivery === "到家").length;
        }

        function renderPager(total) {
          const box = document.querySelector(".pager-btns");
          const info = $("pagerInfo");
          const pages = Math.max(1, Math.ceil(total / pageSize));
          if (page > pages) page = pages;
          if (info) info.textContent = `共 ${total} 条 · 第 ${page}/${pages} 页`;
          if (!box) return;
          const btns = [];
          btns.push(`<button type="button" data-page="prev" ${page <= 1 ? "disabled" : ""}>上一页</button>`);
          const start = Math.max(1, page - 2);
          const end = Math.min(pages, start + 4);
          for (let p = start; p <= end; p++) {
            btns.push(`<button type="button" data-page="${p}" class="${p === page ? "active" : ""}">${p}</button>`);
          }
          btns.push(`<button type="button" data-page="next" ${page >= pages ? "disabled" : ""}>下一页</button>`);
          box.innerHTML = btns.join("");
        }

        function render() {
          data = AdminStore.load(D.STORE_KEY, D.SEED);
          const list = filtered();
          renderStats(list);
          renderPager(list.length);
          const body = $("body");
          if (!list.length) {
            body.innerHTML =
              '<tr class="empty-row"><td colspan="10"><div class="empty-state">暂无数据，请调整筛选或新建服务要素</div></td></tr>';
            return;
          }
          const start = (page - 1) * pageSize;
          body.innerHTML = list
            .slice(start, start + pageSize)
            .map((r) => {
              const i = data.indexOf(r);
              const goals = (r.goals || [])
                .slice(0, 2)
                .map((g) => `<span class="tag goal">${g}</span>`)
                .join("");
              const more = (r.goals || []).length > 2 ? `<span class="tag">+${r.goals.length - 2}</span>` : "";
              const stCls = r.status === "启用" ? "status-on" : "status-off";
              const price = `${r.unitPrice ?? 0} 元/${r.durationUnit || "次"}`;
              return `<tr>
                <td>${r.code || "—"}</td>
                <td>${r.name || "—"}</td>
                <td>${r.category || "—"}</td>
                <td>${goals || "—"}${more}</td>
                <td><span class="tag">${r.delivery || "—"}</span></td>
                <td title="${ruleText(r)}">${ruleText(r)}</td>
                <td>${price}</td>
                <td>${r.needReview || "—"}</td>
                <td><span class="status ${stCls}">${r.status || "—"}</span></td>
                <td class="col-actions">
                  <a class="link" href="${formUrl("view", r.code)}">查看</a>
                  <a class="link" href="${formUrl("edit", r.code)}">编辑</a>
                  <button type="button" class="link danger" data-del="${i}">删除</button>
                </td>
              </tr>`;
            })
            .join("");
        }

        async function removeAt(i) {
          const ok = await AdminUI.confirm("确定删除该服务要素？", {
            title: "删除确认",
            okText: "删除",
            danger: true,
          });
          if (!ok) return;
          data.splice(i, 1);
          AdminStore.save(D.STORE_KEY, data);
          AdminUI.toast("已删除");
          render();
        }

        function boot() {
          if (boot.done) return;
          boot.done = true;

          fillFilterSelect("qCategory", D.CATEGORIES);
          fillFilterSelect("qDelivery", D.DELIVERIES);
          fillFilterSelect("qStatus", D.STATUS);
          fillFilterSelect("qReview", D.YES_NO);

          $("catLegend").innerHTML = D.CATEGORIES.map(
            (c) => `<span class="cat-chip" title="${D.CATEGORY_SAMPLES[c] || ""}">${c}</span>`
          ).join("");

          $("btnSearch")?.addEventListener("click", () => {
            page = 1;
            render();
          });
          $("btnReset")?.addEventListener("click", () => {
            ["qKeyword", "qCategory", "qDelivery", "qStatus", "qReview"].forEach((id) => {
              const el = $(id);
              if (el) el.value = "";
            });
            page = 1;
            render();
          });
          document.querySelector(".pager-btns")?.addEventListener("click", (e) => {
            const btn = e.target.closest("[data-page]");
            if (!btn || btn.disabled) return;
            const list = filtered();
            const pages = Math.max(1, Math.ceil(list.length / pageSize));
            const p = btn.dataset.page;
            if (p === "prev") page = Math.max(1, page - 1);
            else if (p === "next") page = Math.min(pages, page + 1);
            else page = Number(p) || 1;
            render();
          });
          $("body")?.addEventListener("click", (e) => {
            const del = e.target.closest("[data-del]");
            if (del) removeAt(Number(del.dataset.del));
          });
          render();
        }

        AdminUI.onReady(boot);
      })();
    </script>
  </body>
</html>
