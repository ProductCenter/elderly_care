<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>服务大类配置 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="config" data-sub="service-cat" data-tab="服务大类配置" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">服务大类配置</h1><p class="page-desc">管理增值服务大类信息</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新增大类</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">大类数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">启用</div><div class="v" id="stOn">0</div></div><div class="stat-card"><div class="k">关联服务</div><div class="v" id="stSvc">0</div></div><div class="stat-card"><div class="k">最大排序</div><div class="v" id="stSort">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>名称 / 编码</label><input class="ctrl" id="qKeyword" /></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="启用">启用</option><option value="停用">停用</option></select></div><div class="filter-item"><label></label><div></div></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>编码</th><th>大类名称</th><th>关联服务数</th><th>排序</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新增大类</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>编码<span class="req">*</span></label><input class="ctrl" id="fCode" /></div><div class="form-field"><label>大类名称<span class="req">*</span></label><input class="ctrl" id="fName" /></div><div class="form-field"><label>关联服务数</label><input class="ctrl" id="fServices" type="number" value="0" /></div><div class="form-field"><label>排序</label><input class="ctrl" id="fSort" type="number" value="1" /></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="启用">启用</option><option value="停用">停用</option></select></div><div class="form-field full"><label>说明</label><textarea class="ctrl" id="fNote"></textarea></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u589e\u5927\u7c7b",editTitle:"编辑",rows:[{code:"SC01",name:"康复理疗",services:6,sort:1,status:"启用",updated:"2026-07-10",note:""},{code:"SC02",name:"生活照料",services:8,sort:2,status:"启用",updated:"2026-07-08",note:""},{code:"SC03",name:"陪诊陪护",services:3,sort:3,status:"启用",updated:"2026-06-20",note:""},{code:"SC04",name:"其他",services:2,sort:9,status:"停用",updated:"2026-05-01",note:""}],columns:[{key:"code"},{key:"name"},{key:"services"},{key:"sort"},{key:"status",status:true},{key:"updated"}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v)||String(r.code||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v}],formFields:[{id:"fCode",key:"code",type:"text",label:"编码",required:true},{id:"fName",key:"name",type:"text",label:"大类名称",required:true},{id:"fServices",key:"services",type:"number",label:"关联服务数",default:0},{id:"fSort",key:"sort",type:"number",label:"排序",default:1},{id:"fStatus",key:"status",type:"select",label:"状态"},{id:"fNote",key:"note",type:"textarea",label:"说明"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stOn",html:false,value:(l)=>l.filter(r=>r.status==="启用").length},{id:"stSvc",html:false,value:(l)=>l.reduce((s,r)=>s+r.services,0)},{id:"stSort",html:false,value:(l)=>Math.max(0,...l.map(r=>r.sort))}],getStatus:(r)=>({text:r.status,cls:r.status==="启用"?"status-on":"status-off"}),rowActions:null,onAction:null});</script>
</body></html>
