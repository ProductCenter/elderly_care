<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>合作商信息 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="partner" data-sub="list" data-tab="合作商信息" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">合作商信息</h1><p class="page-desc">维护合作商家信息、合作范围、联系人与合同状态</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新增合作商</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">合作商</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">合作中</div><div class="v" id="stOn">0</div></div><div class="stat-card"><div class="k">暂停</div><div class="v" id="stPause">0</div></div><div class="stat-card"><div class="k">即将到期</div><div class="v" id="stExp">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>名称 / 联系人</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="合作中">合作中</option><option value="暂停">暂停</option><option value="已终止">已终止</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>合作商</th><th>范围</th><th>联系人</th><th>合同到期</th><th>标记</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新增合作商</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>合作商<span class="req">*</span></label><input class="ctrl" id="fName" placeholder=""/></div><div class="form-field"><label>合作范围<span class="req">*</span></label><input class="ctrl" id="fScope" placeholder=""/></div><div class="form-field"><label>联系人<span class="req">*</span></label><input class="ctrl" id="fContact" placeholder=""/></div><div class="form-field"><label>电话</label><input class="ctrl" id="fPhone" placeholder=""/></div><div class="form-field"><label>合同到期<span class="req">*</span></label><input class="ctrl" id="fExpire" type="date"/></div><div class="form-field"><label>标记</label><select class="ctrl" id="fFlag"><option value="-">-</option><option value="即将到期">即将到期</option><option value="重点">重点</option></select></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="合作中">合作中</option><option value="暂停">暂停</option><option value="已终止">已终止</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u589e\u5408\u4f5c\u5546",editTitle:"编辑",rows:[{name:"金盛粮油",scope:"团购供货",contact:"刘总",phone:"13800001111",expire:"2026-12-31",flag:"-",status:"合作中"},{name:"安居智造",scope:"智慧养老设备",contact:"陈工",phone:"13900002222",expire:"2026-08-15",flag:"即将到期",status:"合作中"},{name:"鲜达农产",scope:"食堂食材",contact:"周经理",phone:"13700003333",expire:"2025-12-01",flag:"-",status:"暂停"}],columns:[{key:"name"},{key:"scope"},{key:"contact"},{key:"expire"},{key:"flag"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v)||String(r.contact||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.name||"").includes(v))}],formFields:[{id:"fName",key:"name",type:"text",label:"合作商",required:true},{id:"fScope",key:"scope",type:"text",label:"合作范围",required:true},{id:"fContact",key:"contact",type:"text",label:"联系人",required:true},{id:"fPhone",key:"phone",type:"text",label:"电话"},{id:"fExpire",key:"expire",type:"date",label:"合同到期",required:true},{id:"fFlag",key:"flag",type:"select",label:"标记"},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stOn",html:false,value:(l)=>l.filter(r=>r.status==="合作中").length},{id:"stPause",html:false,value:(l)=>l.filter(r=>r.status==="暂停").length},{id:"stExp",html:false,value:(l)=>l.filter(r=>r.flag==="即将到期").length}],getStatus:(r)=>({text:r.status,cls:r.status==="合作中"?"status-on":r.status==="暂停"?"status-busy":"status-off"}),rowActions:null,onAction:null});</script>
</body></html>
