<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>月度对账 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="partner" data-sub="monthly" data-tab="月度对账" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">月度对账</h1><p class="page-desc">汇总合作商月度供货量、订单额、履约率与评价</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-default" id="btnExport">导出</button><button type="button" class="btn btn-primary" id="btnAdd">+ 录入月报</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">月报数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">本月总额</div><div class="v" id="stAmt">0</div></div><div class="stat-card"><div class="k">平均履约率</div><div class="v" id="stRate">0</div></div><div class="stat-card"><div class="k">优秀合作商</div><div class="v" id="stTop">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>月份</label><input class="ctrl" id="qMonth" placeholder=""/></div><div class="filter-item"><label>合作商</label><input class="ctrl" id="qName" placeholder=""/></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>月份</th><th>合作商</th><th>供货量</th><th>订单额</th><th>履约率</th><th>评价</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">录入月报</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>月份<span class="req">*</span></label><input class="ctrl" id="fMonth" placeholder=""/></div><div class="form-field"><label>合作商<span class="req">*</span></label><input class="ctrl" id="fName" placeholder=""/></div><div class="form-field"><label>供货量</label><input class="ctrl" id="fQty" placeholder=""/></div><div class="form-field"><label>订单额</label><input class="ctrl" id="fAmount" type="number" value="0"/></div><div class="form-field"><label>履约率</label><input class="ctrl" id="fRate" placeholder="98%"/></div><div class="form-field"><label>评价</label><input class="ctrl" id="fScore" placeholder="优/良/中"/></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u5f55\u5165\u6708\u62a5",editTitle:"编辑",rows:[{month:"2026-07",name:"金盛粮油",qty:"128件",amount:18600,rate:"99%",score:"优"},{month:"2026-07",name:"安居智造",qty:"14台",amount:98000,rate:"96%",score:"优"},{month:"2026-07",name:"鲜达农产",qty:"86单",amount:22400,rate:"92%",score:"良"}],columns:[{key:"month"},{key:"name"},{key:"qty"},{key:"amount"},{key:"rate"},{key:"score"}],filters:[{id:"qMonth",match:(r,v)=>!v||(String(r.month||"").includes(v))},{id:"qName",match:(r,v)=>!v||(String(r.name||"").includes(v))},{id:"q",match:(r,v)=>!v||(String(r.name||"").includes(v))}],formFields:[{id:"fMonth",key:"month",type:"text",label:"月份",required:true},{id:"fName",key:"name",type:"text",label:"合作商",required:true},{id:"fQty",key:"qty",type:"text",label:"供货量"},{id:"fAmount",key:"amount",type:"number",label:"订单额",default:0},{id:"fRate",key:"rate",type:"text",label:"履约率"},{id:"fScore",key:"score",type:"text",label:"评价"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stAmt",html:true,value:(l)=>l.reduce((s,r)=>s+r.amount,0)+"<em>元</em>"},{id:"stRate",html:false,value:(l)=>l.length?Math.round(l.reduce((s,r)=>s+parseFloat(r.rate),0)/l.length)+"%":"-"},{id:"stTop",html:false,value:()=>"金盛粮油"}],getStatus:null,rowActions:null,onAction:null});AdminUI.onReady(()=>{document.getElementById("btnExport")?.addEventListener("click",()=>alert("已导出月度对账（演示）"));});</script>
</body></html>
