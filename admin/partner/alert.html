<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>合同到期预警 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="partner" data-sub="alert" data-tab="合同到期预警" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">合同到期预警</h1><p class="page-desc">合同到期、履约异常、投诉超限等预警处理</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 登记预警</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">预警数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">待处理</div><div class="v" id="stOpen">0</div></div><div class="stat-card"><div class="k">处理中</div><div class="v" id="stDoing">0</div></div><div class="stat-card"><div class="k">已关闭</div><div class="v" id="stDone">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>合作商 / 类型</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待处理">待处理</option><option value="处理中">处理中</option><option value="已关闭">已关闭</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>日期</th><th>合作商</th><th>类型</th><th>级别</th><th>说明</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">登记预警</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>日期<span class="req">*</span></label><input class="ctrl" id="fDate" type="date"/></div><div class="form-field"><label>合作商<span class="req">*</span></label><input class="ctrl" id="fName" placeholder=""/></div><div class="form-field"><label>类型</label><select class="ctrl" id="fType"><option value="合同到期">合同到期</option><option value="履约异常">履约异常</option><option value="投诉超限">投诉超限</option><option value="资质过期">资质过期</option></select></div><div class="form-field"><label>级别</label><select class="ctrl" id="fLevel"><option value="高">高</option><option value="中">中</option><option value="低">低</option></select></div><div class="form-field full"><label>说明<span class="req">*</span></label><textarea class="ctrl" id="fNote" placeholder=""></textarea></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="待处理">待处理</option><option value="处理中">处理中</option><option value="已关闭">已关闭</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u767b\u8bb0\u9884\u8b66",editTitle:"编辑",rows:[{date:"2026-07-28",name:"安居智造",type:"合同到期",level:"高",note:"合同将于8月15日到期，需续签",status:"待处理"},{date:"2026-07-20",name:"鲜达农产",type:"履约异常",level:"中",note:"本月准时到货率低于95%",status:"处理中"},{date:"2026-07-10",name:"日化批发",type:"投诉超限",level:"低",note:"纸巾质量投诉2起已沟通",status:"已关闭"}],columns:[{key:"date"},{key:"name"},{key:"type"},{key:"level"},{key:"note"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v)||String(r.type||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.name||"").includes(v))}],formFields:[{id:"fDate",key:"date",type:"date",label:"日期",required:true},{id:"fName",key:"name",type:"text",label:"合作商",required:true},{id:"fType",key:"type",type:"select",label:"类型"},{id:"fLevel",key:"level",type:"select",label:"级别"},{id:"fNote",key:"note",type:"textarea",label:"说明",required:true},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stOpen",html:false,value:(l)=>l.filter(r=>r.status==="待处理").length},{id:"stDoing",html:false,value:(l)=>l.filter(r=>r.status==="处理中").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已关闭").length}],getStatus:(r)=>({text:r.status,cls:r.status==="已关闭"?"status-on":r.status==="处理中"?"status-busy":"status-repair"}),rowActions:(r,i)=> r.status!=="已关闭"?`<button type="button" class="link" data-act="close" data-i="${i}">关闭</button> <button type="button" class="link" data-edit="${i}">编辑</button>`:`<button type="button" class="link" data-edit="${i}">编辑</button>`,onAction:(act,i,data,render)=>{ if(act==="close"){ data[i].status="已关闭"; render(); }}});</script>
</body></html>
