<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>家属信息 · 天津康养运营平台</title>
    <link rel="stylesheet" href="../css/admin-shell.css" />
    <link rel="stylesheet" href="../css/admin-list.css" />
  </head>
  <body data-primary="org" data-sub="family" data-tab="家属信息" data-asset-prefix="../../assets" data-index-href="../index.html">
    <div id="admin-root"></div>
    <template id="page-content">
      <div class="page-head">
        <div>
          <h1 class="page-title">家属信息</h1>
          <p class="page-desc">集中管理院内长者家属联系人，支持紧急联系人标识与到访权限</p>
        </div>
        <button type="button" class="btn btn-primary" id="btnAdd">+ 新增家属</button>
      </div>
      <div class="stat-row">
        <div class="stat-card"><div class="k">家属总数</div><div class="v" id="stTotal">0</div></div>
        <div class="stat-card"><div class="k">紧急联系人</div><div class="v" id="stPrimary">0</div></div>
        <div class="stat-card"><div class="k">可探访授权</div><div class="v" id="stVisit">0</div></div>
        <div class="stat-card"><div class="k">本月新增</div><div class="v" id="stNew">0</div></div>
      </div>
      <div class="filter-card">
        <div class="filter-grid">
          <div class="filter-item"><label>家属 / 长者 / 电话</label><input class="ctrl" id="qKeyword" placeholder="模糊查询" /></div>
          <div class="filter-item"><label>关系</label>
            <select class="ctrl" id="qRelation"><option value="">全部</option><option>子女</option><option>配偶</option><option>亲属</option><option>其他</option></select>
          </div>
          <div class="filter-item"><label>紧急联系人</label>
            <select class="ctrl" id="qPrimary"><option value="">全部</option><option value="1">是</option><option value="0">否</option></select>
          </div>
          <div class="filter-actions">
            <button type="button" class="btn btn-primary" id="btnSearch">查询</button>
            <button type="button" class="btn btn-default" id="btnReset">重置</button>
          </div>
        </div>
      </div>
      <div class="list-card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>家属姓名</th><th>关系</th><th>联系电话</th><th>关联长者</th><th>楼层床位</th>
                <th>紧急联系人</th><th>探访授权</th><th>登记日期</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="body"></tbody>
          </table>
        </div>
        <div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button">上一页</button><button type="button" class="active">1</button><button type="button">下一页</button></div></div>
      </div>
      <div class="drawer-mask" data-drawer-mask="familyDrawer" data-close-drawer="familyDrawer"></div>
      <aside class="drawer" id="familyDrawer">
        <div class="drawer-head"><h3 id="drawerTitle">新增家属</h3><button type="button" class="drawer-close" data-close-drawer="familyDrawer">×</button></div>
        <div class="drawer-body">
          <div class="form-grid">
            <div class="form-field"><label>家属姓名<span class="req">*</span></label><input class="ctrl" id="fName" /></div>
            <div class="form-field"><label>关系<span class="req">*</span></label>
              <select class="ctrl" id="fRelation"><option>子女</option><option>配偶</option><option>亲属</option><option>其他</option></select>
            </div>
            <div class="form-field"><label>联系电话<span class="req">*</span></label><input class="ctrl" id="fPhone" /></div>
            <div class="form-field"><label>关联长者<span class="req">*</span></label>
              <select class="ctrl" id="fElder"><option>张秀英</option><option>李建国</option><option>陈桂兰</option><option>王德福</option></select>
            </div>
            <div class="form-field"><label>紧急联系人</label>
              <select class="ctrl" id="fPrimary"><option value="1">是</option><option value="0">否</option></select>
            </div>
            <div class="form-field"><label>探访授权</label>
              <select class="ctrl" id="fVisit"><option value="1">允许</option><option value="0">禁止</option></select>
            </div>
            <div class="form-field full"><label>备注</label><textarea class="ctrl" id="fRemark"></textarea></div>
          </div>
        </div>
        <div class="drawer-foot">
          <button type="button" class="btn btn-default" data-close-drawer="familyDrawer">取消</button>
          <button type="button" class="btn btn-primary" id="btnSave">保存</button>
        </div>
      </aside>
    </template>
    <script src="../js/admin-nav.js?v=20260821c"></script>
    <script src="../js/admin-shell.js"></script>
    <script src="../js/admin-ui.js"></script>
    <script src="../js/org-family.js"></script>
  </body>
</html>
