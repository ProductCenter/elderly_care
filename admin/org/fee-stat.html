<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>费用统计 · 天津康养运营平台</title>
    <link rel="stylesheet" href="../css/admin-shell.css" />
    <link rel="stylesheet" href="../css/admin-list.css" />
  </head>
  <body data-primary="org" data-sub="fee-stat" data-tab="费用统计" data-asset-prefix="../../assets" data-index-href="../index.html">
    <div id="admin-root"></div>
    <template id="page-content">
      <div class="page-head">
        <div>
          <h1 class="page-title">费用统计</h1>
          <p class="page-desc">统计长者收费信息，汇总时段内应收总额，支持导出</p>
        </div>
        <button type="button" class="btn btn-primary" id="btnExport">导出表格</button>
      </div>
      <div class="filter-card">
        <div class="filter-grid">
          <div class="filter-item"><label>开始日期</label><input class="ctrl" id="qStart" type="date" value="2026-07-01" /></div>
          <div class="filter-item"><label>结束日期</label><input class="ctrl" id="qEnd" type="date" value="2026-07-31" /></div>
          <div class="filter-item"><label>楼层</label>
            <select class="ctrl" id="qFloor"><option value="">全部</option><option>1F</option><option>2F</option><option>3F</option><option>4F</option><option>5F</option></select>
          </div>
          <div class="filter-actions">
            <button type="button" class="btn btn-primary" id="btnSearch">统计</button>
            <button type="button" class="btn btn-default" id="btnReset">重置</button>
          </div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-card"><div class="k">应收合计</div><div class="v" id="stRecv">0<em>万</em></div></div>
        <div class="stat-card"><div class="k">实收合计</div><div class="v" id="stPaid">0<em>万</em></div></div>
        <div class="stat-card"><div class="k">欠费合计</div><div class="v" id="stDebt">0<em>万</em></div></div>
        <div class="stat-card"><div class="k">计费长者</div><div class="v" id="stElders">0<em>人</em></div></div>
      </div>
      <div class="list-card" style="margin-bottom:12px;padding:14px 16px">
        <h2 style="margin:0 0 8px;font-size:15px">费用构成</h2>
        <div id="feeChart" style="height:160px"></div>
      </div>
      <div class="list-card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>长者</th><th>楼层床位</th><th>床位费</th><th>护理费</th><th>餐费</th><th>其他</th><th>应收</th><th>实收</th><th>状态</th>
              </tr>
            </thead>
            <tbody id="body"></tbody>
          </table>
        </div>
        <div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div>
      </div>
    </template>
    <script src="../js/admin-nav.js?v=20260821c"></script>
    <script src="../js/admin-shell.js"></script>
    <script src="../js/org-fee-stat.js"></script>
  </body>
</html>
