<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>单点菜品 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="order-dish" data-tab="单点菜品" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">单点菜品</h1><p class="page-desc">支持线上线下单点，可选择堂食/打包，记录点餐人、取餐时间与特殊烹饪要求</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 登记点餐</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">今日订单</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">堂食</div><div class="v" id="stDine">0</div></div><div class="stat-card"><div class="k">打包</div><div class="v" id="stPack">0</div></div><div class="stat-card"><div class="k">营业额</div><div class="v" id="stAmt">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>点餐人 / 菜品</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>用餐方式</label><select class="ctrl" id="qMode"><option value="">全部</option><option value="堂食">堂食</option><option value="打包">打包</option></select></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待制作">待制作</option><option value="待取餐">待取餐</option><option value="已完成">已完成</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>时间</th><th>点餐人</th><th>菜品</th><th>方式</th><th>取餐时间</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">登记点餐</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>点餐人<span class="req">*</span></label><input class="ctrl" id="fUser" placeholder=""/></div><div class="form-field"><label>菜品<span class="req">*</span></label><input class="ctrl" id="fDish" placeholder=""/></div><div class="form-field"><label>方式</label><select class="ctrl" id="fMode"><option value="堂食">堂食</option><option value="打包">打包</option></select></div><div class="form-field"><label>取餐时间</label><input class="ctrl" id="fPickup" placeholder=""/></div><div class="form-field"><label>金额</label><input class="ctrl" id="fAmount" type="number" value="18"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="待制作">待制作</option><option value="待取餐">待取餐</option><option value="已完成">已完成</option></select></div><div class="form-field"><label>下单时间</label><input class="ctrl" id="fTime" placeholder=""/></div><div class="form-field full"><label>特殊要求</label><textarea class="ctrl" id="fNote" placeholder="少油少盐等"></textarea></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u767b\u8bb0\u70b9\u9910",editTitle:"编辑",rows:[{time:"2026-07-30 11:20",user:"张秀英家属",dish:"番茄牛腩+米饭",mode:"堂食",pickup:"11:40",amount:22,status:"待取餐",note:"少盐"},{time:"2026-07-30 11:05",user:"社区居民-李",dish:"两荤一素套餐",mode:"打包",pickup:"11:30",amount:19,status:"已完成",note:""},{time:"2026-07-30 10:50",user:"陈桂兰",dish:"清蒸鲈鱼",mode:"堂食",pickup:"11:20",amount:22,status:"待制作",note:""}],columns:[{key:"time"},{key:"user"},{key:"dish"},{key:"mode"},{key:"pickup"},{key:"amount"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.user||"").includes(v)||String(r.dish||"").includes(v))},{id:"qMode",match:(r,v)=>!v||String(r.mode)===v},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v}],formFields:[{id:"fUser",key:"user",type:"text",label:"点餐人",required:true},{id:"fDish",key:"dish",type:"text",label:"菜品",required:true},{id:"fMode",key:"mode",type:"select",label:"方式"},{id:"fPickup",key:"pickup",type:"text",label:"取餐时间"},{id:"fAmount",key:"amount",type:"number",label:"金额",default:18},{id:"fStatus",key:"status",type:"select",label:"状态"},{id:"fTime",key:"time",type:"text",label:"下单时间"},{id:"fNote",key:"note",type:"textarea",label:"特殊要求"}],stats:[{id:"stTotal",html:false,value:(l)=>l.filter(r=>(r.time||"").startsWith("2026-07-30")).length},{id:"stDine",html:false,value:(l)=>l.filter(r=>r.mode==="堂食").length},{id:"stPack",html:false,value:(l)=>l.filter(r=>r.mode==="打包").length},{id:"stAmt",html:true,value:(l)=>l.reduce((s,r)=>s+r.amount,0)+"<em>元</em>"}],getStatus:(r)=>({text:r.status,cls:r.status==="已完成"?"status-on":"status-busy"}),rowActions:null,onAction:null});</script>
</body></html>
