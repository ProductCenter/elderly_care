<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>家政服务管理 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="housekeeping" data-tab="家政服务管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">家政服务管理</h1><p class="page-desc">设置服务项目、时长、收费标准；支持预约→提醒→记录→金额</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新建家政预约</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">预约</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">待上门</div><div class="v" id="stTodo">0</div></div><div class="stat-card"><div class="k">已完成</div><div class="v" id="stDone">0</div></div><div class="stat-card"><div class="k">金额</div><div class="v" id="stAmt">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>客户 / 项目</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待上门">待上门</option><option value="服务中">服务中</option><option value="已完成">已完成</option></select></div><div class="filter-item"><label>区域</label><select class="ctrl" id="qArea"><option value="">全部</option><option value="河东">河东</option><option value="河西">河西</option><option value="和平">和平</option><option value="南开">南开</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>预约时间</th><th>客户</th><th>项目</th><th>时长</th><th>区域</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新建家政预约</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>客户<span class="req">*</span></label><input class="ctrl" id="fUser" placeholder=""/></div><div class="form-field"><label>项目</label><select class="ctrl" id="fItem"><option value="日常保洁">日常保洁</option><option value="深度保洁">深度保洁</option><option value="洗衣熨烫">洗衣熨烫</option></select></div><div class="form-field"><label>时长</label><input class="ctrl" id="fDuration" placeholder="2小时"/></div><div class="form-field"><label>区域</label><select class="ctrl" id="fArea"><option value="河东">河东</option><option value="河西">河西</option><option value="和平">和平</option><option value="南开">南开</option></select></div><div class="form-field"><label>预约时间<span class="req">*</span></label><input class="ctrl" id="fTime" placeholder=""/></div><div class="form-field"><label>金额</label><input class="ctrl" id="fAmount" type="number" value="120"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="待上门">待上门</option><option value="服务中">服务中</option><option value="已完成">已完成</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u5efa\u5bb6\u653f\u9884\u7ea6",editTitle:"编辑",rows:[{time:"2026-07-30 14:00",user:"张秀英家属",item:"日常保洁",duration:"2小时",area:"河东",amount:120,status:"待上门"},{time:"2026-07-29 09:00",user:"李娜",item:"深度保洁",duration:"4小时",area:"和平",amount:280,status:"已完成"},{time:"2026-07-31 10:00",user:"王敏",item:"日常保洁",duration:"2小时",area:"河西",amount:120,status:"服务中"}],columns:[{key:"time"},{key:"user"},{key:"item"},{key:"duration"},{key:"area"},{key:"amount"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.user||"").includes(v)||String(r.item||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"qArea",match:(r,v)=>!v||String(r.area)===v}],formFields:[{id:"fUser",key:"user",type:"text",label:"客户",required:true},{id:"fItem",key:"item",type:"select",label:"项目"},{id:"fDuration",key:"duration",type:"text",label:"时长"},{id:"fArea",key:"area",type:"select",label:"区域"},{id:"fTime",key:"time",type:"text",label:"预约时间",required:true},{id:"fAmount",key:"amount",type:"number",label:"金额",default:120},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stTodo",html:false,value:(l)=>l.filter(r=>r.status==="待上门").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已完成").length},{id:"stAmt",html:true,value:(l)=>l.reduce((s,r)=>s+r.amount,0)+"<em>元</em>"}],getStatus:(r)=>({text:r.status,cls:r.status==="已完成"?"status-on":"status-busy"}),rowActions:null,onAction:null});</script>
</body></html>
