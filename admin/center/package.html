<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>服务套餐 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="package" data-tab="服务套餐" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">服务套餐</h1><p class="page-desc">配置康养服务套餐：含服务项目、次数、有效期与价格</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新增套餐</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">套餐数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">在售</div><div class="v" id="stOn">0</div></div><div class="stat-card"><div class="k">累计售出</div><div class="v" id="stSold">0</div></div><div class="stat-card"><div class="k">套餐均价</div><div class="v" id="stAmt">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>套餐名</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="在售">在售</option><option value="下架">下架</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>套餐</th><th>含项目</th><th>有效期</th><th>价格</th><th>售出</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新增套餐</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>套餐名称<span class="req">*</span></label><input class="ctrl" id="fName" placeholder=""/></div><div class="form-field"><label>含项目<span class="req">*</span></label><input class="ctrl" id="fItems" placeholder="理发×2+修脚×1"/></div><div class="form-field"><label>有效期<span class="req">*</span></label><input class="ctrl" id="fValid" placeholder="90天"/></div><div class="form-field"><label>价格</label><input class="ctrl" id="fPrice" type="number" value="0"/></div><div class="form-field"><label>售出</label><input class="ctrl" id="fSold" type="number" value="0"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="在售">在售</option><option value="下架">下架</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u589e\u5957\u9910",editTitle:"编辑",rows:[{name:"便民关怀包",items:"理发×2+修脚×1",valid:"90天",price:168,sold:56,status:"在售"},{name:"居家清洁季卡",items:"保洁×6",valid:"90天",price:598,sold:22,status:"在售"},{name:"体验入门包",items:"设备体验×1+义诊×1",valid:"30天",price:0,sold:120,status:"在售"}],columns:[{key:"name"},{key:"items"},{key:"valid"},{key:"price"},{key:"sold"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.name||"").includes(v))}],formFields:[{id:"fName",key:"name",type:"text",label:"套餐名称",required:true},{id:"fItems",key:"items",type:"text",label:"含项目",required:true},{id:"fValid",key:"valid",type:"text",label:"有效期",required:true},{id:"fPrice",key:"price",type:"number",label:"价格",default:0},{id:"fSold",key:"sold",type:"number",label:"售出",default:0},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stOn",html:false,value:(l)=>l.filter(r=>r.status==="在售").length},{id:"stSold",html:false,value:(l)=>l.reduce((s,r)=>s+r.sold,0)},{id:"stAmt",html:false,value:(l)=>l.length?Math.round(l.reduce((s,r)=>s+r.price,0)/l.length):0}],getStatus:(r)=>({text:r.status,cls:r.status==="在售"?"status-on":"status-off"}),rowActions:null,onAction:null});</script>
</body></html>
