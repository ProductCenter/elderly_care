<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>团购周期设置 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="groupbuy-cycle" data-tab="团购周期设置" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">团购周期设置</h1><p class="page-desc">设置每周团购时间：预订期与到货取货期，系统自动提醒</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新增周期</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">周期数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">进行中</div><div class="v" id="stOn">0</div></div><div class="stat-card"><div class="k">下一取货日</div><div class="v" id="stNext">0</div></div><div class="stat-card"><div class="k">提醒开启</div><div class="v" id="stRemind">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>周期名</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="进行中">进行中</option><option value="未开始">未开始</option><option value="已结束">已结束</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>周期名称</th><th>预订期</th><th>取货期</th><th>提醒</th><th>参与人数</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新增周期</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>周期名称<span class="req">*</span></label><input class="ctrl" id="fName" placeholder=""/></div><div class="form-field"><label>预订期<span class="req">*</span></label><input class="ctrl" id="fBook" placeholder="周一至周三"/></div><div class="form-field"><label>取货期<span class="req">*</span></label><input class="ctrl" id="fPickup" placeholder="周五"/></div><div class="form-field"><label>提醒</label><select class="ctrl" id="fRemind"><option value="开">开</option><option value="关">关</option></select></div><div class="form-field"><label>参与人数</label><input class="ctrl" id="fUsers" type="number" value="0"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="进行中">进行中</option><option value="未开始">未开始</option><option value="已结束">已结束</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u589e\u5468\u671f",editTitle:"编辑",rows:[{name:"2026-W31 生鲜团",book:"周一至周三",pickup:"周五",remind:"开",users:208,status:"进行中"},{name:"2026-W30 日用团",book:"周一至周三",pickup:"周五",remind:"开",users:176,status:"已结束"},{name:"2026-W32 粮油团",book:"周一至周三",pickup:"周五",remind:"开",users:0,status:"未开始"}],columns:[{key:"name"},{key:"book"},{key:"pickup"},{key:"remind"},{key:"users"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.name||"").includes(v))}],formFields:[{id:"fName",key:"name",type:"text",label:"周期名称",required:true},{id:"fBook",key:"book",type:"text",label:"预订期",required:true},{id:"fPickup",key:"pickup",type:"text",label:"取货期",required:true},{id:"fRemind",key:"remind",type:"select",label:"提醒"},{id:"fUsers",key:"users",type:"number",label:"参与人数",default:0},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stOn",html:false,value:(l)=>l.filter(r=>r.status==="进行中").length},{id:"stNext",html:false,value:()=>"周五"},{id:"stRemind",html:false,value:(l)=>l.filter(r=>r.remind==="开").length}],getStatus:(r)=>({text:r.status,cls:r.status==="进行中"?"status-on":r.status==="已结束"?"status-off":"status-busy"}),rowActions:null,onAction:null});</script>
</body></html>
