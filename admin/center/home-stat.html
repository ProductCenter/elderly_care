<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>上门服务统计 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="home-stat" data-tab="上门服务统计" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">上门服务统计</h1><p class="page-desc">统计上门订单量、收入、服务占比与需求区域分布</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-default" id="btnExport">导出</button><button type="button" class="btn btn-primary" id="btnAdd">+ 生成统计</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">本月订单</div><div class="v" id="stOrd">0</div></div><div class="stat-card"><div class="k">本月收入</div><div class="v" id="stRev">0</div></div><div class="stat-card"><div class="k">家政占比</div><div class="v" id="stHk">0</div></div><div class="stat-card"><div class="k">热点区域</div><div class="v" id="stTop">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>月份</label><input class="ctrl" id="qMonth" placeholder=""/></div><div class="filter-item"><label>类型</label><select class="ctrl" id="qType"><option value="">全部</option><option value="家政">家政</option><option value="护理">护理</option></select></div><div class="filter-item"><label>区域</label><select class="ctrl" id="qArea"><option value="">全部</option><option value="河东">河东</option><option value="河西">河西</option><option value="和平">和平</option><option value="南开">南开</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>月份</th><th>类型</th><th>区域</th><th>订单量</th><th>收入</th><th>占比</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">生成统计</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>月份<span class="req">*</span></label><input class="ctrl" id="fMonth" placeholder=""/></div><div class="form-field"><label>类型</label><select class="ctrl" id="fType"><option value="家政">家政</option><option value="护理">护理</option></select></div><div class="form-field"><label>区域</label><select class="ctrl" id="fArea"><option value="河东">河东</option><option value="河西">河西</option><option value="和平">和平</option><option value="南开">南开</option></select></div><div class="form-field"><label>订单量</label><input class="ctrl" id="fOrders" type="number" value="0"/></div><div class="form-field"><label>收入</label><input class="ctrl" id="fRevenue" type="number" value="0"/></div><div class="form-field"><label>占比</label><input class="ctrl" id="fPct" placeholder=""/></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u751f\u6210\u7edf\u8ba1",editTitle:"编辑",rows:[{month:"2026-07",type:"家政",area:"河东",orders:42,revenue:6200,pct:"33%"},{month:"2026-07",type:"护理",area:"河东",orders:28,revenue:5100,pct:"22%"},{month:"2026-07",type:"家政",area:"和平",orders:21,revenue:3800,pct:"16%"}],columns:[{key:"month"},{key:"type"},{key:"area"},{key:"orders"},{key:"revenue"},{key:"pct"}],filters:[{id:"qMonth",match:(r,v)=>!v||(String(r.month||"").includes(v))},{id:"qType",match:(r,v)=>!v||String(r.type)===v},{id:"qArea",match:(r,v)=>!v||String(r.area)===v}],formFields:[{id:"fMonth",key:"month",type:"text",label:"月份",required:true},{id:"fType",key:"type",type:"select",label:"类型"},{id:"fArea",key:"area",type:"select",label:"区域"},{id:"fOrders",key:"orders",type:"number",label:"订单量",default:0},{id:"fRevenue",key:"revenue",type:"number",label:"收入",default:0},{id:"fPct",key:"pct",type:"text",label:"占比"}],stats:[{id:"stOrd",html:false,value:()=>128},{id:"stRev",html:true,value:()=>"18,640<em>元</em>"},{id:"stHk",html:false,value:()=>"55%"},{id:"stTop",html:false,value:()=>"河东"}],getStatus:null,rowActions:null,onAction:null});AdminUI.onReady(()=>{document.getElementById("btnExport")?.addEventListener("click",()=>alert("已导出上门服务统计（演示）"));});</script>
</body></html>
