<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>上门护理服务 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="home-care" data-tab="上门护理服务" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">上门护理服务</h1><p class="page-desc">基础护理（助浴、助行）、康复护理（按摩、康复训练）、陪同就医</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新建护理预约</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">预约</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">待上门</div><div class="v" id="stTodo">0</div></div><div class="stat-card"><div class="k">已完成</div><div class="v" id="stDone">0</div></div><div class="stat-card"><div class="k">金额</div><div class="v" id="stAmt">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>长者 / 项目</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>类型</label><select class="ctrl" id="qType"><option value="">全部</option><option value="基础护理">基础护理</option><option value="康复护理">康复护理</option><option value="陪同就医">陪同就医</option></select></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待上门">待上门</option><option value="服务中">服务中</option><option value="已完成">已完成</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>预约时间</th><th>长者</th><th>类型</th><th>项目</th><th>护理员</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新建护理预约</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>长者<span class="req">*</span></label><input class="ctrl" id="fElder" placeholder=""/></div><div class="form-field"><label>类型</label><select class="ctrl" id="fType"><option value="基础护理">基础护理</option><option value="康复护理">康复护理</option><option value="陪同就医">陪同就医</option></select></div><div class="form-field"><label>项目<span class="req">*</span></label><input class="ctrl" id="fItem" placeholder="助浴/助行/按摩…"/></div><div class="form-field"><label>护理员</label><input class="ctrl" id="fNurse" placeholder=""/></div><div class="form-field"><label>预约时间<span class="req">*</span></label><input class="ctrl" id="fTime" placeholder=""/></div><div class="form-field"><label>金额</label><input class="ctrl" id="fAmount" type="number" value="150"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="待上门">待上门</option><option value="服务中">服务中</option><option value="已完成">已完成</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u5efa\u62a4\u7406\u9884\u7ea6",editTitle:"编辑",rows:[{time:"2026-07-30 09:00",elder:"居家长者-刘",type:"基础护理",item:"助浴",nurse:"赵敏",amount:150,status:"待上门"},{time:"2026-07-29 15:00",elder:"居家长者-吴",type:"康复护理",item:"康复训练",nurse:"孙丽",amount:180,status:"已完成"},{time:"2026-07-31 08:30",elder:"王德福家属约",type:"陪同就医",item:"陪诊",nurse:"陈静",amount:200,status:"服务中"}],columns:[{key:"time"},{key:"elder"},{key:"type"},{key:"item"},{key:"nurse"},{key:"amount"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.elder||"").includes(v)||String(r.item||"").includes(v))},{id:"qType",match:(r,v)=>!v||String(r.type)===v},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v}],formFields:[{id:"fElder",key:"elder",type:"text",label:"长者",required:true},{id:"fType",key:"type",type:"select",label:"类型"},{id:"fItem",key:"item",type:"text",label:"项目",required:true},{id:"fNurse",key:"nurse",type:"text",label:"护理员"},{id:"fTime",key:"time",type:"text",label:"预约时间",required:true},{id:"fAmount",key:"amount",type:"number",label:"金额",default:150},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stTodo",html:false,value:(l)=>l.filter(r=>r.status==="待上门").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已完成").length},{id:"stAmt",html:true,value:(l)=>l.reduce((s,r)=>s+r.amount,0)+"<em>元</em>"}],getStatus:(r)=>({text:r.status,cls:r.status==="已完成"?"status-on":"status-busy"}),rowActions:null,onAction:null});</script>
</body></html>
