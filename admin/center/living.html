<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>在住服务管理 · 天津康养运营平台</title>
<link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="living" data-tab="在住服务管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div>
<template id="page-content">
<div class="page-head"><div><h1 class="page-title">在住服务管理</h1><p class="page-desc">记录在住长者日常服务需求：餐饮偏好、护理等级、医疗需求、特殊照护等</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 更新服务档案</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">在住档案</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">特殊照护</div><div class="v" id="stSpecial">0</div></div><div class="stat-card"><div class="k">特护/全护理</div><div class="v" id="stHigh">0</div></div><div class="stat-card"><div class="k">特殊饮食</div><div class="v" id="stDiet">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>长者 / 床位</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>护理等级</label><select class="ctrl" id="qCare"><option value="">全部</option><option value="自理">自理</option><option value="半护理">半护理</option><option value="全护理">全护理</option><option value="特护">特护</option></select></div><div class="filter-item"><label>楼层</label><select class="ctrl" id="qFloor"><option value="">全部</option><option value="1F">1F</option><option value="2F">2F</option><option value="3F">3F</option><option value="4F">4F</option><option value="5F">5F</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>长者</th><th>楼层</th><th>床位</th><th>护理等级</th><th>餐饮偏好</th><th>医疗需求</th><th>特殊照护</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer">
<div class="drawer-head"><h3 id="drawerTitle">更新服务档案</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>长者<span class="req">*</span></label><select class="ctrl" id="fElder"><option value="张秀英">张秀英</option><option value="李建国">李建国</option><option value="陈桂兰">陈桂兰</option><option value="王德福">王德福</option><option value="赵国强">赵国强</option></select></div><div class="form-field"><label>楼层</label><select class="ctrl" id="fFloor"><option value="1F">1F</option><option value="2F">2F</option><option value="3F">3F</option><option value="4F">4F</option><option value="5F">5F</option></select></div><div class="form-field"><label>床位<span class="req">*</span></label><input class="ctrl" id="fBed" placeholder=""/></div><div class="form-field"><label>护理等级</label><select class="ctrl" id="fCare"><option value="自理">自理</option><option value="半护理">半护理</option><option value="全护理">全护理</option><option value="特护">特护</option></select></div><div class="form-field"><label>餐饮偏好</label><input class="ctrl" id="fDiet" placeholder="软食/低盐/糖尿病餐"/></div><div class="form-field"><label>医疗需求</label><input class="ctrl" id="fMedical" placeholder=""/></div><div class="form-field"><label>特殊照护</label><input class="ctrl" id="fSpecial" placeholder=""/></div><div class="form-field full"><label>其他说明</label><textarea class="ctrl" id="fNote" placeholder=""></textarea></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div>
</aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u66f4\u65b0\u670d\u52a1\u6863\u6848",editTitle:"编辑",rows:[
    {elder:"张秀英",floor:"3F",bed:"312-A",care:"半护理",diet:"软食·低盐",medical:"高血压随访",special:"夜间巡视",note:""},
    {elder:"李建国",floor:"3F",bed:"312-B",care:"特护",diet:"糖尿病餐",medical:"血糖监测 qid",special:"翻身 q2h",note:""},
    {elder:"陈桂兰",floor:"2F",bed:"215-A",care:"自理",diet:"普食",medical:"无",special:"无",note:""},
    {elder:"王德福",floor:"1F",bed:"108-B",care:"全护理",diet:"软食",medical:"脑梗后遗症",special:"助行",note:""},
  ],columns:[{key:"elder"},{key:"floor"},{key:"bed"},{key:"care"},{key:"diet"},{key:"medical"},{key:"special"}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.elder||"").includes(v)||String(r.bed||"").includes(v))},{id:"qCare",match:(r,v)=>!v||String(r.care)===v},{id:"qFloor",match:(r,v)=>!v||String(r.floor)===v}],formFields:[{id:"fElder",key:"elder",type:"select",label:"长者",required:true},{id:"fFloor",key:"floor",type:"select",label:"楼层"},{id:"fBed",key:"bed",type:"text",label:"床位",required:true},{id:"fCare",key:"care",type:"select",label:"护理等级"},{id:"fDiet",key:"diet",type:"text",label:"餐饮偏好"},{id:"fMedical",key:"medical",type:"text",label:"医疗需求"},{id:"fSpecial",key:"special",type:"text",label:"特殊照护"},{id:"fNote",key:"note",type:"textarea",label:"其他说明"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stSpecial",html:false,value:(l)=>l.filter(r=>r.special && r.special!=="无").length},{id:"stHigh",html:false,value:(l)=>l.filter(r=>r.care==="特护"||r.care==="全护理").length},{id:"stDiet",html:false,value:(l)=>l.filter(r=>r.diet && r.diet!=="普食").length}],getStatus:null,rowActions:null,onAction:null});</script>
</body></html>
