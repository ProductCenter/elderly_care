<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>食堂运营统计 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="canteen-stat" data-tab="食堂运营统计" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">食堂运营统计</h1><p class="page-desc">菜品销量排行、营业收入、优惠减免、日均就餐与上门配送，支持按餐次/日期筛选</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-default" id="btnExport">导出</button><button type="button" class="btn btn-primary" id="btnAdd">+ 生成统计</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">今日营收</div><div class="v" id="stRev">0</div></div><div class="stat-card"><div class="k">日均就餐</div><div class="v" id="stDiners">0</div></div><div class="stat-card"><div class="k">优惠减免</div><div class="v" id="stDisc">0</div></div><div class="stat-card"><div class="k">上门配送</div><div class="v" id="stDel">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>日期</label><input class="ctrl" id="qRange" placeholder="2026-07-30"/></div><div class="filter-item"><label>餐次</label><select class="ctrl" id="qMeal"><option value="">全部</option><option value="早餐">早餐</option><option value="午餐">午餐</option><option value="晚餐">晚餐</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>日期</th><th>餐次</th><th>就餐人数</th><th>营收</th><th>减免</th><th>配送单</th><th>热销菜</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">生成统计</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>日期<span class="req">*</span></label><input class="ctrl" id="fDate" type="date"/></div><div class="form-field"><label>餐次</label><select class="ctrl" id="fMeal"><option value="早餐">早餐</option><option value="午餐">午餐</option><option value="晚餐">晚餐</option></select></div><div class="form-field"><label>就餐人数</label><input class="ctrl" id="fDiners" type="number" value="0"/></div><div class="form-field"><label>营收</label><input class="ctrl" id="fRevenue" type="number" value="0"/></div><div class="form-field"><label>减免</label><input class="ctrl" id="fDiscount" type="number" value="0"/></div><div class="form-field"><label>配送单</label><input class="ctrl" id="fDelivery" type="number" value="0"/></div><div class="form-field"><label>热销菜</label><input class="ctrl" id="fTop" placeholder=""/></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u751f\u6210\u7edf\u8ba1",editTitle:"编辑",rows:[{date:"2026-07-30",meal:"午餐",diners:286,revenue:4820,discount:520,delivery:26,top:"番茄牛腩"},{date:"2026-07-30",meal:"早餐",diners:126,revenue:980,discount:120,delivery:8,top:"小米粥"},{date:"2026-07-29",meal:"午餐",diners:274,revenue:4610,discount:480,delivery:22,top:"清蒸鲈鱼"}],columns:[{key:"date"},{key:"meal"},{key:"diners"},{key:"revenue"},{key:"discount"},{key:"delivery"},{key:"top"}],filters:[{id:"qRange",match:(r,v)=>!v||(String(r.date||"").includes(v))},{id:"qMeal",match:(r,v)=>!v||String(r.meal)===v},{id:"q",match:(r,v)=>!v||(String(r.name||"").includes(v))}],formFields:[{id:"fDate",key:"date",type:"date",label:"日期",required:true},{id:"fMeal",key:"meal",type:"select",label:"餐次"},{id:"fDiners",key:"diners",type:"number",label:"就餐人数",default:0},{id:"fRevenue",key:"revenue",type:"number",label:"营收",default:0},{id:"fDiscount",key:"discount",type:"number",label:"减免",default:0},{id:"fDelivery",key:"delivery",type:"number",label:"配送单",default:0},{id:"fTop",key:"top",type:"text",label:"热销菜"}],stats:[{id:"stRev",html:true,value:()=>"6,820<em>元</em>"},{id:"stDiners",html:true,value:()=>"398<em>人</em>"},{id:"stDisc",html:true,value:()=>"860<em>元</em>"},{id:"stDel",html:false,value:()=>46}],getStatus:null,rowActions:null,onAction:null});AdminUI.onReady(()=>{document.getElementById("btnExport")?.addEventListener("click",()=>alert("已导出食堂运营统计（演示）"));});</script>
</body></html>
