<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>智慧养老统计 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="smart-stat" data-tab="智慧养老统计" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">智慧养老统计</h1><p class="page-desc">统计设备体验人次、安装量、满意度，分析热门设备</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-default" id="btnExport">导出</button><button type="button" class="btn btn-primary" id="btnAdd">+ 生成统计</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">体验人次</div><div class="v" id="stExp">0</div></div><div class="stat-card"><div class="k">安装量</div><div class="v" id="stInstall">0</div></div><div class="stat-card"><div class="k">满意度</div><div class="v" id="stSat">0</div></div><div class="stat-card"><div class="k">热门设备</div><div class="v" id="stHot">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>月份</label><input class="ctrl" id="qMonth" placeholder=""/></div><div class="filter-item"><label>设备</label><input class="ctrl" id="qDevice" placeholder=""/></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>月份</th><th>设备</th><th>体验人次</th><th>安装量</th><th>满意度</th><th>转化率</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">生成统计</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>月份<span class="req">*</span></label><input class="ctrl" id="fMonth" placeholder=""/></div><div class="form-field"><label>设备<span class="req">*</span></label><input class="ctrl" id="fDevice" placeholder=""/></div><div class="form-field"><label>体验人次</label><input class="ctrl" id="fExp" type="number" value="0"/></div><div class="form-field"><label>安装量</label><input class="ctrl" id="fInstall" type="number" value="0"/></div><div class="form-field"><label>满意度</label><input class="ctrl" id="fSat" placeholder=""/></div><div class="form-field"><label>转化率</label><input class="ctrl" id="fConv" placeholder=""/></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u751f\u6210\u7edf\u8ba1",editTitle:"编辑",rows:[{month:"2026-07",device:"智能床垫",exp:68,install:18,sat:"97%",conv:"26%"},{month:"2026-07",device:"跌倒雷达",exp:52,install:14,sat:"96%",conv:"27%"},{month:"2026-07",device:"血压手表",exp:66,install:10,sat:"95%",conv:"15%"}],columns:[{key:"month"},{key:"device"},{key:"exp"},{key:"install"},{key:"sat"},{key:"conv"}],filters:[{id:"qMonth",match:(r,v)=>!v||(String(r.month||"").includes(v))},{id:"qDevice",match:(r,v)=>!v||(String(r.device||"").includes(v))},{id:"q",match:(r,v)=>!v||(String(r.month||"").includes(v))}],formFields:[{id:"fMonth",key:"month",type:"text",label:"月份",required:true},{id:"fDevice",key:"device",type:"text",label:"设备",required:true},{id:"fExp",key:"exp",type:"number",label:"体验人次",default:0},{id:"fInstall",key:"install",type:"number",label:"安装量",default:0},{id:"fSat",key:"sat",type:"text",label:"满意度"},{id:"fConv",key:"conv",type:"text",label:"转化率"}],stats:[{id:"stExp",html:false,value:()=>186},{id:"stInstall",html:false,value:()=>42},{id:"stSat",html:false,value:()=>"96.2%"},{id:"stHot",html:false,value:()=>"智能床垫"}],getStatus:null,rowActions:null,onAction:null});AdminUI.onReady(()=>{document.getElementById("btnExport")?.addEventListener("click",()=>alert("已导出智慧养老统计（演示）"));});</script>
</body></html>
