<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蛇口 · 街道长者服务中心</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #03101f;
      --panel: rgba(6, 28, 58, .72);
      --line: rgba(80, 170, 255, .28);
      --cyan: #3ecbff;
      --text: #e8f4ff;
      --muted: #8eb4d4;
      --font: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #000814; color: var(--text); font-family: var(--font); }
    body {
      background:
        linear-gradient(180deg, rgba(0, 10, 28, 0.28) 0%, transparent 16%),
        url("./assets/screen-body.png") center center / cover no-repeat,
        #000814;
    }
    .screen { height: 100%; display: flex; flex-direction: column; padding: 0 14px 10px; gap: 6px; }
    .header {
      height: 72px; flex-shrink: 0; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .header-bg {
      position: absolute; inset: 0; pointer-events: none;
      background: url("./assets/screen-header.png") center bottom / 100% 100% no-repeat;
    }
    .header h1 {
      position: relative; z-index: 1;
      font-size: clamp(26px, 2.2vw, 36px); letter-spacing: 0.14em; font-weight: 700;
      text-shadow: 0 0 18px rgba(0,229,255,.55), 0 2px 0 rgba(0,30,60,.45);
    }
    .header .right { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); z-index: 2; }
    .fs {
      border: 0; cursor: pointer; color: #d7eeff; font: inherit; font-size: 13px;
      padding: 6px 12px; border-radius: 16px;
      background: rgba(10,40,80,.55); box-shadow: inset 0 0 0 1px rgba(80,180,255,.4);
    }
    .main {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, 22%) minmax(0, 1fr) minmax(300px, 26%);
      gap: 10px;
    }
    .col { min-height: 0; display: flex; flex-direction: column; gap: 8px; }
    .block {
      background: var(--panel);
      box-shadow: inset 0 0 0 1px var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .block h3 { font-size: 16px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
    .grow { flex: 1; min-height: 0; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .kpi b { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .kpi b em { font-style: normal; font-size: 13px; margin-left: 2px; }
    .kpi span { color: var(--muted); font-size: 12px; }
    .rates { display: flex; gap: 18px; margin: 8px 0; }
    .rates b { font-size: 22px; color: #7ee0ff; }
    .rates span { display: block; color: var(--muted); font-size: 12px; }
    .cap { font-size: 13px; color: #c5dff3; margin: 4px 0; display: flex; justify-content: space-between; align-items: center; }
    .leg { display: flex; gap: 10px; color: var(--muted); font-size: 12px; }
    .leg i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
    .bars { display: flex; align-items: flex-end; gap: 10px; height: 92px; padding-top: 4px; }
    .bars .g { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
    .bars .pair { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; }
    .bars .pair i { width: 7px; border-radius: 2px 2px 0 0; display: block; }
    .bars em { font-style: normal; font-size: 11px; color: var(--muted); }
    .age { display: grid; grid-template-columns: 118px 1fr; gap: 8px; align-items: center; }
    .donut { width: 108px; height: 108px; border-radius: 50%; position: relative; background: rgba(80,170,255,.16); }
    .donut::after {
      content: ""; position: absolute; inset: 22px; border-radius: 50%;
      background: #062038; box-shadow: inset 0 0 0 1px rgba(80,170,255,.2);
    }
    .age-list { font-size: 12px; color: #c5dff3; display: flex; flex-direction: column; gap: 3px; }
    .age-list i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
    .org { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
    .cell { display: flex; gap: 8px; align-items: center; }
    .ico {
      width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
      font-size: 14px; flex-shrink: 0;
    }
    .cell b { display: block; font-size: 18px; line-height: 1.1; }
    .cell span { color: var(--muted); font-size: 12px; }
    .center { position: relative; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; position: relative; z-index: 5; }
    .card { border-radius: 8px; padding: 8px 10px; min-height: 92px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
    .card h4 { font-size: 14px; margin-bottom: 4px; }
    .card p { font-size: 12px; line-height: 1.45; opacity: .95; }
    .c1 { background: linear-gradient(160deg, #1d6dff, #123e9a); }
    .c2 { background: linear-gradient(160deg, #12b8c9, #0c6e86); }
    .c3 { background: linear-gradient(160deg, #1f9b62, #0d5c3d); }
    .c4 { background: linear-gradient(160deg, #1aa36a, #0e6b46); }
    .map-wrap {
      position: relative; flex: 1; min-height: 220px; z-index: 1;
      overflow: hidden; border-radius: 8px; pointer-events: auto;
    }
    #map { position: absolute; inset: 0; background: #071426; }
    .badge {
      position: absolute; z-index: 500; left: 50%; top: 10px; transform: translateX(-50%);
      background: rgba(4, 24, 52, .72); color: #fff; font-size: 13px;
      padding: 6px 14px; border-radius: 16px;
      box-shadow: inset 0 0 0 1px rgba(0,229,255,.55), 0 0 18px rgba(0,180,255,.35);
      white-space: nowrap; letter-spacing: 1px;
    }
    .comm-icon { background: none; border: 0; }
    .comm {
      display: flex; align-items: center; gap: 4px;
      white-space: nowrap; pointer-events: auto;
    }
    .comm i {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
      background: #00e5ff; border: 1px solid #fff;
      box-shadow: 0 0 8px #00e5ff;
    }
    .comm span {
      font-size: 12px; font-weight: 700; color: #042038;
      background: rgba(232, 248, 255, .94);
      padding: 1px 6px; border-radius: 3px;
      box-shadow: 0 1px 4px rgba(0,0,0,.28);
    }
    .mid-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: relative; z-index: 5; }
    .center .block { background: linear-gradient(180deg, rgba(4,22,48,.62), rgba(2,12,32,.4)); }
    .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 6px; }
    .subh { font-size: 16px; margin-bottom: 8px; }
    .money { display: flex; justify-content: space-between; gap: 8px; }
    .money .n { font-size: 28px; font-weight: 700; }
    .money .n.orange { color: #ffb020; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,160,40,.15); color: #ffc56a; border-radius: 8px; padding: 6px 8px;
    }
    .ai-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .ai-tags span {
      font-size: 12px; padding: 4px 8px; border-radius: 4px;
      background: rgba(20,80,140,.45); box-shadow: inset 0 0 0 1px rgba(80,170,255,.3);
    }
    .trio { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin: 6px 0; }
    .trio b { display: block; font-size: 22px; color: #7ee0ff; }
    .trio span { color: var(--muted); font-size: 12px; }
    .note { font-size: 12px; color: #b7d4ea; line-height: 1.55; max-height: 72px; overflow: auto; }
    .plot { height: 110px; }
    .plot svg { width: 100%; height: 100%; display: block; }
    .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <div class="screen">
    <header class="header">
      <div class="header-bg"></div>
      <h1>蛇口 · 街道长者服务中心</h1>
      <div class="right"><button class="fs" id="btnFs" type="button">全屏</button></div>
    </header>
    <div class="main">
      <section class="col">
        <div class="block grow">
          <h3>概览</h3>
          <div class="kpis">
            <div class="kpi"><b>—</b><span>指标</span></div>
            <div class="kpi"><b>—</b><span>指标</span></div>
            <div class="kpi"><b>—</b><span>指标</span></div>
          </div>
          <div class="rates">
            <div><b>—</b><span>指标</span></div>
            <div><b>—</b><span>指标</span></div>
          </div>
          <div class="cap">分布</div>
          <div class="bars" id="bars"></div>
          <div class="cap">构成</div>
          <div class="age">
            <div class="donut" id="ageDonut"></div>
            <div class="age-list" id="ageList"></div>
          </div>
        </div>
        <div class="block">
          <h3>明细</h3>
          <div class="org">
            <div class="cell"><div class="ico" style="background:#1d4ed8"></div><div><b>—</b><span>指标</span></div></div>
            <div class="cell"><div class="ico" style="background:#16a34a"></div><div><b>—</b><span>指标</span></div></div>
            <div class="cell"><div class="ico" style="background:#0ea5e9"></div><div><b>—</b><span>指标</span></div></div>
            <div class="cell"><div class="ico" style="background:#22c55e"></div><div><b>—</b><span>指标</span></div></div>
            <div class="cell"><div class="ico" style="background:#2563eb"></div><div><b>—</b><span>指标</span></div></div>
            <div class="cell"><div class="ico" style="background:#f59e0b"></div><div><b>—</b><span>指标</span></div></div>
          </div>
        </div>
      </section>

      <section class="col center">
        <div class="cards">
          <div class="card c1"><h4>指标</h4><p>—<br>—<br>—</p></div>
          <div class="card c2"><h4>指标</h4><p>—<br>—<br>—</p></div>
          <div class="card c3"><h4>指标</h4><p>—<br>—<br>—</p></div>
          <div class="card c4"><h4>指标</h4><p>—<br>—<br>—</p></div>
        </div>
        <div class="map-wrap">
          <div id="map"></div>
          <div class="badge">蛇口街道 · 13个社区</div>
        </div>
        <div class="mid-bottom">
          <div class="block">
            <div class="subh">模块</div>
            <div class="mini">
              <div class="cell"><div class="ico" style="background:#2563eb"></div><div><b>—</b><span>指标</span></div></div>
              <div class="cell"><div class="ico" style="background:#f59e0b"></div><div><b>—</b><span>指标</span></div></div>
              <div class="cell"><div class="ico" style="background:#2563eb"></div><div><b>—</b><span>指标</span></div></div>
              <div class="cell"><div class="ico" style="background:#22c55e"></div><div><b>—</b><span>指标</span></div></div>
            </div>
          </div>
          <div class="block">
            <div class="subh">模块</div>
            <div class="mini">
              <div class="cell"><div class="ico" style="background:#7c3aed"></div><div><b>—</b><span>指标</span></div></div>
              <div class="cell"><div class="ico" style="background:#0ea5e9"></div><div><b>—</b><span>指标</span></div></div>
              <div class="cell"><div class="ico" style="background:#16a34a"></div><div><b>—</b><span>指标</span></div></div>
              <div class="cell"><div class="ico" style="background:#64748b"></div><div><b>—</b><span>指标</span></div></div>
            </div>
          </div>
        </div>
      </section>

      <section class="col">
        <div class="block">
          <h3>汇总</h3>
          <div class="money">
            <div><div class="n">—</div><span style="color:var(--muted);font-size:12px">指标</span></div>
            <div class="pill"><div><div class="n orange" style="font-size:22px">—</div><span style="font-size:12px">指标</span></div></div>
          </div>
          <div class="cap">构成</div>
          <div class="age">
            <div class="donut" id="subDonut"></div>
            <div class="age-list" id="subList"></div>
          </div>
        </div>
        <div class="block">
          <h3>说明</h3>
          <div class="ai-tags"><span>—</span><span>—</span><span>—</span><span>—</span></div>
          <div class="trio">
            <div><b>—</b><span>指标</span></div>
            <div><b>—</b><span>指标</span></div>
            <div><b>—</b><span>指标</span></div>
          </div>
          <div class="cap">备注</div>
          <div class="note">—</div>
        </div>
        <div class="block grow">
          <h3>趋势</h3>
          <div class="plot" id="trend"></div>
          <div class="axis"><span>1月</span><span>2月</span><span>3月</span><span>4月</span><span>5月</span><span>6月</span><span>7月</span><span>8月</span><span>9月</span></div>
        </div>
      </section>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (() => {
      document.getElementById("bars").innerHTML = Array.from({ length: 6 }, () => `
        <div class="g"><div class="pair"><i style="height:8%;background:rgba(80,170,255,.35)"></i></div><em>—</em></div>`).join("");
      document.getElementById("trend").innerHTML = `<svg viewBox="0 0 320 100" preserveAspectRatio="none">
        <line x1="8" y1="92" x2="312" y2="92" stroke="rgba(80,170,255,.35)" stroke-width="1"/>
      </svg>`;

      document.getElementById("btnFs").onclick = () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      };

      const outOfChina = (lng, lat) => lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271;
      const tfLat = (x, y) => {
        let r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
        r += (20 * Math.sin(y * Math.PI) + 40 * Math.sin(y / 3 * Math.PI)) * 2 / 3;
        r += (160 * Math.sin(y / 12 * Math.PI) + 320 * Math.sin(y * Math.PI / 30)) * 2 / 3;
        return r;
      };
      const tfLng = (x, y) => {
        let r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
        r += (20 * Math.sin(x * Math.PI) + 40 * Math.sin(x / 3 * Math.PI)) * 2 / 3;
        r += (150 * Math.sin(x / 12 * Math.PI) + 300 * Math.sin(x / 30 * Math.PI)) * 2 / 3;
        return r;
      };
      const toLL = (lng, lat) => {
        if (outOfChina(lng, lat)) return [lat, lng];
        const a = 6378245, ee = 0.00669342162296594323;
        let dLat = tfLat(lng - 105, lat - 35), dLng = tfLng(lng - 105, lat - 35);
        const rad = lat / 180 * Math.PI;
        let magic = 1 - ee * Math.sin(rad) ** 2;
        const sq = Math.sqrt(magic);
        dLat = (dLat * 180) / ((a * (1 - ee)) / (magic * sq) * Math.PI);
        dLng = (dLng * 180) / (a / sq * Math.cos(rad) * Math.PI);
        return [lat + dLat, lng + dLng];
      };
      const boundary = [[113.906,22.501],[113.922,22.507],[113.940,22.508],[113.953,22.496],[113.949,22.480],[113.934,22.469],[113.916,22.467],[113.901,22.476],[113.902,22.490],[113.906,22.501]];
      const ring = boundary.map(([lng, lat]) => toLL(lng, lat));
      const map = L.map("map", { zoomControl: false, attributionControl: false, minZoom: 13, maxZoom: 17 });
      L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", { subdomains: "1234", maxZoom: 18 }).addTo(map);
      const communities = [
        { name: "东角头社区", lng: 113.9296, lat: 22.4766 },
        { name: "湾厦社区", lng: 113.9168, lat: 22.4942 },
        { name: "海湾社区", lng: 113.9132, lat: 22.4864 },
        { name: "渔一社区", lng: 113.9052, lat: 22.4792 },
        { name: "渔二社区", lng: 113.9094, lat: 22.4816 },
        { name: "海滨社区", lng: 113.9208, lat: 22.4852 },
        { name: "南水社区", lng: 113.9182, lat: 22.4768 },
        { name: "大铲社区", lng: 113.8520, lat: 22.5180 },
        { name: "内伶仃岛社区", lng: 113.8020, lat: 22.4110 },
        { name: "雷岭社区", lng: 113.9262, lat: 22.4964 },
        { name: "围仔社区", lng: 113.9254, lat: 22.4812 },
        { name: "南海玫瑰园社区", lng: 113.9110, lat: 22.4836 },
        { name: "海昌社区", lng: 113.9224, lat: 22.4906 }
      ];
      const area = L.polygon(ring, { color: "#00e5ff", weight: 2, fillColor: "#00b4ff", fillOpacity: 0.08 }).addTo(map);
      const markers = [];
      communities.forEach((c) => {
        const icon = L.divIcon({
          className: "comm-icon",
          iconSize: [88, 20],
          iconAnchor: [5, 10],
          html: `<div class="comm"><i></i><span>${c.name.replace("社区", "")}</span></div>`
        });
        markers.push(L.marker(toLL(c.lng, c.lat), { icon, title: c.name, zIndexOffset: 400 })
          .addTo(map)
          .bindPopup(`<b>${c.name}</b><br>蛇口街道`));
      });
      const fit = () => {
        map.invalidateSize();
        map.fitBounds(L.featureGroup(markers).getBounds().pad(0.2), { animate: false });
      };
      map.whenReady(() => requestAnimationFrame(fit));
      setTimeout(fit, 300);
    })();
  </script>
</body>
</html>
