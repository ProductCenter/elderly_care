<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>团购商品管理 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="groupbuy-goods" data-tab="团购商品管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">团购商品管理</h1><p class="page-desc">设置商品名称、规格、团购价、市场价、供应商等信息</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新增商品</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">商品数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">在售</div><div class="v" id="stOn">0</div></div><div class="stat-card"><div class="k">热销</div><div class="v" id="stHot">0</div></div><div class="stat-card"><div class="k">供应商</div><div class="v" id="stSupp">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>商品 / 供应商</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="在售">在售</option><option value="下架">下架</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>商品</th><th>规格</th><th>团购价</th><th>市场价</th><th>供应商</th><th>销量</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新增商品</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>商品名称<span class="req">*</span></label><input class="ctrl" id="fName" placeholder=""/></div><div class="form-field"><label>规格</label><input class="ctrl" id="fSpec" placeholder=""/></div><div class="form-field"><label>团购价</label><input class="ctrl" id="fPrice" type="number" value="0"/></div><div class="form-field"><label>市场价</label><input class="ctrl" id="fMarket" type="number" value="0"/></div><div class="form-field"><label>供应商</label><input class="ctrl" id="fSupplier" placeholder=""/></div><div class="form-field"><label>销量</label><input class="ctrl" id="fSold" type="number" value="0"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="在售">在售</option><option value="下架">下架</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u589e\u5546\u54c1",editTitle:"编辑",rows:[{name:"东北大米",spec:"10kg/袋",price:49.9,market:59.9,supplier:"金盛粮油",sold:128,status:"在售"},{name:"花生油",spec:"5L/桶",price:69.9,market:89.9,supplier:"津门粮油",sold:86,status:"在售"},{name:"鸡蛋",spec:"30枚",price:18.8,market:22,supplier:"鲜达农产",sold:210,status:"在售"},{name:"旧款纸巾",spec:"12卷",price:15.9,market:19.9,supplier:"日化批发",sold:12,status:"下架"}],columns:[{key:"name"},{key:"spec"},{key:"price"},{key:"market"},{key:"supplier"},{key:"sold"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v)||String(r.supplier||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.name||"").includes(v))}],formFields:[{id:"fName",key:"name",type:"text",label:"商品名称",required:true},{id:"fSpec",key:"spec",type:"text",label:"规格"},{id:"fPrice",key:"price",type:"number",label:"团购价",default:0},{id:"fMarket",key:"market",type:"number",label:"市场价",default:0},{id:"fSupplier",key:"supplier",type:"text",label:"供应商"},{id:"fSold",key:"sold",type:"number",label:"销量",default:0},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stOn",html:false,value:(l)=>l.filter(r=>r.status==="在售").length},{id:"stHot",html:false,value:(l)=>l.filter(r=>r.sold>=50).length},{id:"stSupp",html:false,value:(l)=>new Set(l.map(r=>r.supplier)).size}],getStatus:(r)=>({text:r.status,cls:r.status==="在售"?"status-on":"status-off"}),rowActions:null,onAction:null});</script>
</body></html>
