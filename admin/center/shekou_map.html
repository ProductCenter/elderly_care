<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蛇口街道地图</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #000b1d;
      --cyan: #00e5ff;
      --blue: #3b9eff;
      --orange: #ff9a1a;
      --green: #3ddea8;
      --text: #fff;
      --muted: #7fa3c4;
      --font: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: var(--font); color: var(--text); background: #000814; }
    .screen { height: 100%; display: flex; flex-direction: column; }
    .header {
      height: 64px; flex-shrink: 0; position: relative; z-index: 500;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px;
      background: linear-gradient(180deg, rgba(0,18,42,.96), rgba(0,12,30,.88));
      box-shadow: inset 0 -1px 0 rgba(0,200,255,.28);
    }
    .header h1 {
      font-size: 26px; font-weight: 700; letter-spacing: 3px;
      text-shadow: 0 0 16px rgba(0,200,255,.35);
    }
    .header h1::before {
      content: ""; display: inline-block; width: 0; height: 0; margin-right: 10px;
      border-left: 8px solid var(--cyan);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      filter: drop-shadow(0 0 5px rgba(0,229,255,.7));
      vertical-align: 2px;
    }
    .header .sub { margin-left: 12px; font-size: 14px; letter-spacing: 1px; color: var(--muted); font-weight: 500; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .header a, .seg button {
      color: #dff6ff; text-decoration: none; font-size: 14px;
      padding: 6px 12px; border-radius: 3px;
      background: rgba(0,60,110,.4);
      box-shadow: inset 0 0 0 1px rgba(0,200,255,.35);
    }
    .seg { display: inline-flex; overflow: hidden; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,200,255,.35); }
    .seg button {
      border: 0; cursor: pointer; background: transparent; box-shadow: none; border-radius: 0;
      font-family: inherit;
    }
    .seg button.on { color: #041428; background: linear-gradient(145deg, #5ee7ff, #3b9eff); }
    .stage { flex: 1; min-height: 0; position: relative; }
    #map { position: absolute; inset: 0; background: #071426; }
    .leaflet-container { background: #071426; font-family: var(--font); }
    .panel {
      position: absolute; z-index: 450; top: 14px; left: 14px; bottom: 14px; width: 280px;
      display: flex; flex-direction: column;
      background: rgba(4,18,40,.86);
      box-shadow: inset 0 0 0 1px rgba(0,200,255,.28), 0 8px 28px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      border-radius: 6px;
    }
    .panel .hd {
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(0,180,255,.18);
    }
    .panel .hd b { display: block; font-size: 18px; letter-spacing: 1px; }
    .panel .hd span { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); line-height: 1.45; }
    .list { flex: 1; overflow: auto; padding: 8px; }
    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-thumb { background: rgba(0,180,255,.35); }
    .item {
      width: 100%; text-align: left; cursor: pointer; font-family: inherit; color: inherit;
      display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center;
      padding: 8px 8px; margin-bottom: 4px; border: 0; border-radius: 4px;
      background: transparent;
    }
    .item:hover { background: rgba(30,100,180,.28); }
    .item.on {
      background: linear-gradient(90deg, rgba(26,111,212,.85), rgba(30,120,224,.35));
    }
    .dot {
      width: 22px; height: 22px; border-radius: 50%;
      display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #041428;
    }
    .item .nm { font-size: 15px; font-weight: 650; }
    .item .tx { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .foot {
      padding: 8px 12px 12px; font-size: 12px; color: var(--muted); line-height: 1.45;
      border-top: 1px solid rgba(0,180,255,.16);
    }
    .pin {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 4px rgba(0,229,255,.25), 0 0 12px rgba(0,229,255,.7);
    }
    .pin.hub { background: #ff9a1a; box-shadow: 0 0 0 4px rgba(255,154,26,.25), 0 0 12px rgba(255,154,26,.7); }
    .pin.site { background: #3ddea8; box-shadow: 0 0 0 4px rgba(61,222,168,.25), 0 0 12px rgba(61,222,168,.65); }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: rgba(4,18,40,.94); color: #fff;
      box-shadow: inset 0 0 0 1px rgba(0,200,255,.4);
      border-radius: 6px;
    }
    .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.5; }
    .leaflet-popup-content b { font-size: 15px; }
    .leaflet-control-zoom a {
      background: rgba(4,18,40,.9); color: #dff6ff;
      border-color: rgba(0,200,255,.35);
    }
    .leaflet-bar { border: 0; box-shadow: none; }
    .map-note {
      position: absolute; z-index: 450; right: 14px; bottom: 14px;
      padding: 8px 10px; font-size: 12px; color: #c5ddf0;
      background: rgba(4,18,40,.82);
      box-shadow: inset 0 0 0 1px rgba(0,200,255,.25);
      border-radius: 4px;
    }
    @media (max-width: 800px) {
      .panel { width: auto; right: 14px; bottom: auto; max-height: 42%; }
      .header h1 { font-size: 18px; letter-spacing: 1px; }
      .header .sub { display: none; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="header">
      <div>
        <h1>蛇口街道地图<span class="sub">深圳市 · 南山区</span></h1>
      </div>
      <div class="header-actions">
        <div class="seg" id="baseSeg" role="group" aria-label="底图">
          <button type="button" data-base="street" class="on">街道</button>
          <button type="button" data-base="sat">卫星</button>
        </div>
        <a href="./ecology-shekou-screen-v1.html">返回大屏</a>
      </div>
    </header>
    <div class="stage">
      <div id="map"></div>
      <aside class="panel">
        <div class="hd">
          <b>蛇口街道</b>
          <span>仅渲染蛇口街道。点选列表可在街道内定位。</span>
        </div>
        <div class="list" id="placeList"></div>
        <div class="foot">Leaflet 按街道边界单独渲染，范围外已遮住。边界为示意范围。</div>
      </aside>
      <div class="map-note">蛇口街道 · 南山区西南部</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (() => {
      const outOfChina = (lng, lat) => lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271;
      const transformLat = (x, y) => {
        let ret = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
        ret += (20 * Math.sin(y * Math.PI) + 40 * Math.sin(y / 3 * Math.PI)) * 2 / 3;
        ret += (160 * Math.sin(y / 12 * Math.PI) + 320 * Math.sin(y * Math.PI / 30)) * 2 / 3;
        return ret;
      };
      const transformLng = (x, y) => {
        let ret = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
        ret += (20 * Math.sin(x * Math.PI) + 40 * Math.sin(x / 3 * Math.PI)) * 2 / 3;
        ret += (150 * Math.sin(x / 12 * Math.PI) + 300 * Math.sin(x / 30 * Math.PI)) * 2 / 3;
        return ret;
      };
      const wgsToGcj = (lng, lat) => {
        if (outOfChina(lng, lat)) return [lng, lat];
        const a = 6378245.0;
        const ee = 0.00669342162296594323;
        let dLat = transformLat(lng - 105, lat - 35);
        let dLng = transformLng(lng - 105, lat - 35);
        const rad = lat / 180 * Math.PI;
        let magic = Math.sin(rad);
        magic = 1 - ee * magic * magic;
        const sqrtMagic = Math.sqrt(magic);
        dLat = (dLat * 180) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
        dLng = (dLng * 180) / (a / sqrtMagic * Math.cos(rad) * Math.PI);
        return [lng + dLng, lat + dLat];
      };

      /* 蛇口街道陆地示意范围：半岛东南端，渔港—东角头—深圳湾口岸 */
      const boundary = [
        [113.906, 22.501],
        [113.922, 22.507],
        [113.940, 22.508],
        [113.953, 22.496],
        [113.949, 22.480],
        [113.934, 22.469],
        [113.916, 22.467],
        [113.901, 22.476],
        [113.902, 22.490],
        [113.906, 22.501]
      ];

      const places = [
        { id: "hub", name: "蛇口街道长者服务中心", kind: "枢纽", desc: "街道一级综合服务枢纽", lng: 113.9176, lat: 22.4874, tone: "hub" },
        { id: "haian", name: "海岸社区", kind: "社区", desc: "覆盖社区", lng: 113.9335, lat: 22.4972, tone: "site" },
        { id: "haichang", name: "海昌社区", kind: "社区", desc: "覆盖社区", lng: 113.9192, lat: 22.4910, tone: "site" },
        { id: "haiwan", name: "海湾社区", kind: "社区", desc: "覆盖社区", lng: 113.9124, lat: 22.4866, tone: "site" },
        { id: "yuyi", name: "渔一社区", kind: "社区", desc: "覆盖社区", lng: 113.9058, lat: 22.4792, tone: "site" },
        { id: "yuer", name: "渔二社区", kind: "社区", desc: "覆盖社区", lng: 113.9096, lat: 22.4824, tone: "site" },
        { id: "leiling", name: "雷岭社区", kind: "社区", desc: "覆盖社区", lng: 113.9248, lat: 22.4946, tone: "site" },
        { id: "dongjiao", name: "东角头社区", kind: "社区", desc: "覆盖社区", lng: 113.9294, lat: 22.4768, tone: "site" },
        { id: "szwan", name: "深圳湾社区", kind: "社区", desc: "覆盖社区", lng: 113.9412, lat: 22.5022, tone: "site" },
        { id: "sea", name: "海上世界", kind: "地标", desc: "蛇口滨海地标", lng: 113.9142, lat: 22.4848, tone: "mark" }
      ];

      const toLatLng = (lng, lat) => {
        const [x, y] = wgsToGcj(lng, lat);
        return [y, x];
      };

      const street = L.tileLayer(
        "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}",
        { subdomains: "1234", maxZoom: 18, attribution: "高德地图" }
      );
      const sat = L.layerGroup([
        L.tileLayer("https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}", { subdomains: "1234", maxZoom: 18 }),
        L.tileLayer("https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}", { subdomains: "1234", maxZoom: 18 })
      ]);

      const map = L.map("map", {
        zoomControl: true,
        attributionControl: true,
        layers: [street],
        minZoom: 13,
        maxZoom: 17
      });
      map.zoomControl.setPosition("bottomright");
      map.createPane("mask");
      const maskPane = map.getPane("mask");
      maskPane.style.zIndex = 350;
      maskPane.style.pointerEvents = "none";

      const ring = boundary.map(([lng, lat]) => toLatLng(lng, lat));
      const area = L.polygon(ring, {
        color: "#00e5ff",
        weight: 2.5,
        opacity: 1,
        fill: false
      }).addTo(map);
      area.bindTooltip("蛇口街道", { permanent: true, direction: "center", className: "area-tip" });

      let maskLayer = null;
      const drawMask = () => {
        const b = map.getBounds().pad(1.2);
        const outer = [
          [b.getSouth(), b.getWest()],
          [b.getNorth(), b.getWest()],
          [b.getNorth(), b.getEast()],
          [b.getSouth(), b.getEast()]
        ];
        const hole = ring.slice().reverse();
        if (!maskLayer) {
          maskLayer = L.polygon([outer, hole], {
            pane: "mask",
            stroke: false,
            fillColor: "#000814",
            fillOpacity: 1,
            interactive: false
          }).addTo(map);
        } else {
          maskLayer.setLatLngs([outer, hole]);
        }
      };
      map.on("move zoom resize", drawMask);

      const markers = {};
      places.forEach((p) => {
        const icon = L.divIcon({
          className: "",
          iconSize: [18, 18],
          iconAnchor: [9, 9],
          html: `<div class="pin ${p.tone === "hub" ? "hub" : "site"}"></div>`
        });
        const marker = L.marker(toLatLng(p.lng, p.lat), { icon, title: p.name }).addTo(map);
        marker.bindPopup(`<b>${p.name}</b><br>${p.kind} · ${p.desc}`);
        marker.on("click", () => select(p.id, false));
        markers[p.id] = marker;
      });

      const streetBounds = area.getBounds().pad(0.08);
      map.setMaxBounds(streetBounds);
      map.fitBounds(area.getBounds(), { paddingTopLeft: [310, 40], paddingBottomRight: [40, 40] });
      drawMask();

      const list = document.getElementById("placeList");
      const toneColor = { hub: "#ff9a1a", site: "#3ddea8", mark: "#3b9eff" };
      list.innerHTML = places.map((p) => `
        <button type="button" class="item" data-id="${p.id}">
          <span class="dot" style="background:${toneColor[p.tone]}">${p.kind.slice(0, 1)}</span>
          <span><div class="nm">${p.name}</div><div class="tx">${p.kind}</div></span>
        </button>
      `).join("");

      const select = (id, fly = true) => {
        list.querySelectorAll(".item").forEach((el) => el.classList.toggle("on", el.dataset.id === id));
        const marker = markers[id];
        if (!marker) return;
        if (fly) map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 15), { duration: 0.6 });
        marker.openPopup();
      };
      list.querySelectorAll(".item").forEach((btn) => {
        btn.addEventListener("click", () => select(btn.dataset.id, true));
      });

      let base = street;
      document.getElementById("baseSeg").querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const next = btn.dataset.base === "sat" ? sat : street;
          if (next === base) return;
          map.removeLayer(base);
          next.addTo(map);
          base = next;
          document.querySelectorAll("#baseSeg button").forEach((b) => b.classList.toggle("on", b === btn));
        });
      });

      const style = document.createElement("style");
      style.textContent = `.area-tip{background:transparent;border:0;box-shadow:none;color:#e8fbff;font-weight:700;font-size:16px;letter-spacing:2px;text-shadow:0 0 8px rgba(0,20,40,.9);}`;
      document.head.appendChild(style);
    })();
  </script>
</body>
</html>
