<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>便民服务统计 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="convenience-stat" data-tab="便民服务统计" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">便民服务统计</h1><p class="page-desc">统计各类便民服务月度次数、收入，分析需求高峰时段</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-default" id="btnExport">导出</button><button type="button" class="btn btn-primary" id="btnAdd">+ 生成统计</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">本月服务</div><div class="v" id="stCnt">0</div></div><div class="stat-card"><div class="k">本月收入</div><div class="v" id="stRev">0</div></div><div class="stat-card"><div class="k">高峰时段</div><div class="v" id="stPeak">0</div></div><div class="stat-card"><div class="k">热门项目</div><div class="v" id="stTop">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>月份</label><input class="ctrl" id="qMonth" placeholder="2026-07"/></div><div class="filter-item"><label>类型</label><select class="ctrl" id="qType"><option value="">全部</option><option value="理发">理发</option><option value="修脚">修脚</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>月份</th><th>服务类型</th><th>服务次数</th><th>收入</th><th>高峰时段</th><th>环比</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">生成统计</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>月份<span class="req">*</span></label><input class="ctrl" id="fMonth" placeholder=""/></div><div class="form-field"><label>类型</label><select class="ctrl" id="fType"><option value="理发">理发</option><option value="修脚">修脚</option></select></div><div class="form-field"><label>次数</label><input class="ctrl" id="fCount" type="number" value="0"/></div><div class="form-field"><label>收入</label><input class="ctrl" id="fRevenue" type="number" value="0"/></div><div class="form-field"><label>高峰时段</label><input class="ctrl" id="fPeak" placeholder=""/></div><div class="form-field"><label>环比</label><input class="ctrl" id="fMom" placeholder=""/></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u751f\u6210\u7edf\u8ba1",editTitle:"编辑",rows:[{month:"2026-07",type:"理发",count:96,revenue:3360,peak:"09-11",mom:"+12%"},{month:"2026-07",type:"修脚",count:60,revenue:2100,peak:"14-16",mom:"+8%"},{month:"2026-06",type:"理发",count:86,revenue:3010,peak:"09-11",mom:"+5%"}],columns:[{key:"month"},{key:"type"},{key:"count"},{key:"revenue"},{key:"peak"},{key:"mom"}],filters:[{id:"qMonth",match:(r,v)=>!v||(String(r.month||"").includes(v))},{id:"qType",match:(r,v)=>!v||String(r.type)===v},{id:"q",match:(r,v)=>!v||(String(r.type||"").includes(v))}],formFields:[{id:"fMonth",key:"month",type:"text",label:"月份",required:true},{id:"fType",key:"type",type:"select",label:"类型"},{id:"fCount",key:"count",type:"number",label:"次数",default:0},{id:"fRevenue",key:"revenue",type:"number",label:"收入",default:0},{id:"fPeak",key:"peak",type:"text",label:"高峰时段"},{id:"fMom",key:"mom",type:"text",label:"环比"}],stats:[{id:"stCnt",html:false,value:()=>156},{id:"stRev",html:true,value:()=>"5,460<em>元</em>"},{id:"stPeak",html:false,value:()=>"09-11点"},{id:"stTop",html:false,value:()=>"理发"}],getStatus:null,rowActions:null,onAction:null});AdminUI.onReady(()=>{document.getElementById("btnExport")?.addEventListener("click",()=>alert("已导出便民服务统计（演示）"));});</script>
</body></html>
