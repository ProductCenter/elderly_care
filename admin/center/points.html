<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>积分管理 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="points" data-tab="积分管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">积分管理</h1><p class="page-desc">积分规则配置、发放记录、兑换与余额查询</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 发放积分</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">持有人数</div><div class="v" id="stUsers">0</div></div><div class="stat-card"><div class="k">本月发放</div><div class="v" id="stGrant">0</div></div><div class="stat-card"><div class="k">本月兑换</div><div class="v" id="stUse">0</div></div><div class="stat-card"><div class="k">积分余额合计</div><div class="v" id="stBal">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>姓名 / 事由</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>类型</label><select class="ctrl" id="qType"><option value="">全部</option><option value="发放">发放</option><option value="兑换">兑换</option><option value="调整">调整</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>日期</th><th>姓名</th><th>类型</th><th>积分</th><th>事由</th><th>余额</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">发放积分</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>姓名<span class="req">*</span></label><input class="ctrl" id="fUser" placeholder=""/></div><div class="form-field"><label>类型</label><select class="ctrl" id="fType"><option value="发放">发放</option><option value="兑换">兑换</option><option value="调整">调整</option></select></div><div class="form-field"><label>积分</label><input class="ctrl" id="fPoints" type="number" value="0"/></div><div class="form-field"><label>日期<span class="req">*</span></label><input class="ctrl" id="fDate" type="date"/></div><div class="form-field"><label>事由<span class="req">*</span></label><input class="ctrl" id="fReason" placeholder=""/></div><div class="form-field"><label>余额</label><input class="ctrl" id="fBalance" type="number" value="0"/></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u53d1\u653e\u79ef\u5206",editTitle:"编辑",rows:[{date:"2026-07-30",user:"张伟",type:"发放",points:20,reason:"参加智能手机课堂",balance:320},{date:"2026-07-29",user:"李娜",type:"兑换",points:-50,reason:"兑换洗衣液",balance:180},{date:"2026-07-28",user:"王敏",type:"发放",points:10,reason:"团购取货打卡",balance:95}],columns:[{key:"date"},{key:"user"},{key:"type"},{key:"points"},{key:"reason"},{key:"balance"}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.user||"").includes(v)||String(r.reason||"").includes(v))},{id:"qType",match:(r,v)=>!v||String(r.type)===v},{id:"q",match:(r,v)=>!v||(String(r.user||"").includes(v))}],formFields:[{id:"fUser",key:"user",type:"text",label:"姓名",required:true},{id:"fType",key:"type",type:"select",label:"类型"},{id:"fPoints",key:"points",type:"number",label:"积分",default:0},{id:"fDate",key:"date",type:"date",label:"日期",required:true},{id:"fReason",key:"reason",type:"text",label:"事由",required:true},{id:"fBalance",key:"balance",type:"number",label:"余额",default:0}],stats:[{id:"stUsers",html:false,value:(l)=>new Set(l.map(r=>r.user)).size},{id:"stGrant",html:false,value:(l)=>l.filter(r=>r.type==="发放").reduce((s,r)=>s+r.points,0)},{id:"stUse",html:false,value:(l)=>l.filter(r=>r.type==="兑换").reduce((s,r)=>s+Math.abs(r.points),0)},{id:"stBal",html:false,value:()=>18620}],getStatus:null,rowActions:null,onAction:null});</script>
</body></html>
