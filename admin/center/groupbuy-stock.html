<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>团购库存管理 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="groupbuy-stock" data-tab="团购库存管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">团购库存管理</h1><p class="page-desc">记录团购商品到货数量、出库数量、库存状态</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 登记库存</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">SKU</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">库存不足</div><div class="v" id="stLow">0</div></div><div class="stat-card"><div class="k">本周到货</div><div class="v" id="stIn">0</div></div><div class="stat-card"><div class="k">本周出库</div><div class="v" id="stOut">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>商品</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="充足">充足</option><option value="不足">不足</option><option value="缺货">缺货</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>商品</th><th>到货</th><th>出库</th><th>库存</th><th>安全库存</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">登记库存</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>商品<span class="req">*</span></label><input class="ctrl" id="fName" placeholder=""/></div><div class="form-field"><label>到货</label><input class="ctrl" id="fInbound" type="number" value="0"/></div><div class="form-field"><label>出库</label><input class="ctrl" id="fOutbound" type="number" value="0"/></div><div class="form-field"><label>库存</label><input class="ctrl" id="fStock" type="number" value="0"/></div><div class="form-field"><label>安全库存</label><input class="ctrl" id="fSafe" type="number" value="10"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="充足">充足</option><option value="不足">不足</option><option value="缺货">缺货</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u767b\u8bb0\u5e93\u5b58",editTitle:"编辑",rows:[{name:"东北大米",inbound:150,outbound:128,stock:22,safe:20,status:"充足"},{name:"花生油",inbound:100,outbound:86,stock:14,safe:20,status:"不足"},{name:"鸡蛋",inbound:250,outbound:210,stock:40,safe:30,status:"充足"},{name:"旧款纸巾",inbound:0,outbound:12,stock:0,safe:10,status:"缺货"}],columns:[{key:"name"},{key:"inbound"},{key:"outbound"},{key:"stock"},{key:"safe"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.name||"").includes(v))}],formFields:[{id:"fName",key:"name",type:"text",label:"商品",required:true},{id:"fInbound",key:"inbound",type:"number",label:"到货",default:0},{id:"fOutbound",key:"outbound",type:"number",label:"出库",default:0},{id:"fStock",key:"stock",type:"number",label:"库存",default:0},{id:"fSafe",key:"safe",type:"number",label:"安全库存",default:10},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stLow",html:false,value:(l)=>l.filter(r=>r.stock<=r.safe).length},{id:"stIn",html:false,value:(l)=>l.reduce((s,r)=>s+r.inbound,0)},{id:"stOut",html:false,value:(l)=>l.reduce((s,r)=>s+r.outbound,0)}],getStatus:(r)=>({text:r.status,cls:r.status==="充足"?"status-on":r.status==="缺货"?"status-repair":"status-busy"}),rowActions:null,onAction:null});</script>
</body></html>
