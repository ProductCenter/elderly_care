<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>团购运营统计 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="groupbuy-stat" data-tab="团购运营统计" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">团购运营统计</h1><p class="page-desc">统计参与人数、订单金额、销量排行，分析热门商品类型</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-default" id="btnExport">导出</button><button type="button" class="btn btn-primary" id="btnAdd">+ 生成统计</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">参与人数</div><div class="v" id="stUsers">0</div></div><div class="stat-card"><div class="k">订单金额</div><div class="v" id="stAmt">0</div></div><div class="stat-card"><div class="k">热销商品</div><div class="v" id="stTop">0</div></div><div class="stat-card"><div class="k">参与率</div><div class="v" id="stRate">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>周期</label><input class="ctrl" id="qWeek" placeholder=""/></div><div class="filter-item"><label>类型</label><select class="ctrl" id="qCat"><option value="">全部</option><option value="生鲜">生鲜</option><option value="粮油">粮油</option><option value="日用">日用</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>周期</th><th>类型</th><th>参与人数</th><th>订单金额</th><th>热销商品</th><th>参与率</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">生成统计</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>周期<span class="req">*</span></label><input class="ctrl" id="fWeek" placeholder=""/></div><div class="form-field"><label>类型</label><select class="ctrl" id="fCat"><option value="生鲜">生鲜</option><option value="粮油">粮油</option><option value="日用">日用</option></select></div><div class="form-field"><label>参与人数</label><input class="ctrl" id="fUsers" type="number" value="0"/></div><div class="form-field"><label>订单金额</label><input class="ctrl" id="fAmount" type="number" value="0"/></div><div class="form-field"><label>热销商品</label><input class="ctrl" id="fTop" placeholder=""/></div><div class="form-field"><label>参与率</label><input class="ctrl" id="fRate" placeholder=""/></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u751f\u6210\u7edf\u8ba1",editTitle:"编辑",rows:[{week:"2026-W31",cat:"生鲜",users:120,amount:12600,top:"鸡蛋",rate:"36%"},{week:"2026-W31",cat:"粮油",users:88,amount:11200,top:"东北大米",rate:"27%"},{week:"2026-W30",cat:"日用",users:76,amount:5400,top:"洗衣液",rate:"23%"}],columns:[{key:"week"},{key:"cat"},{key:"users"},{key:"amount"},{key:"top"},{key:"rate"}],filters:[{id:"qWeek",match:(r,v)=>!v||(String(r.week||"").includes(v))},{id:"qCat",match:(r,v)=>!v||String(r.cat)===v},{id:"q",match:(r,v)=>!v||(String(r.week||"").includes(v))}],formFields:[{id:"fWeek",key:"week",type:"text",label:"周期",required:true},{id:"fCat",key:"cat",type:"select",label:"类型"},{id:"fUsers",key:"users",type:"number",label:"参与人数",default:0},{id:"fAmount",key:"amount",type:"number",label:"订单金额",default:0},{id:"fTop",key:"top",type:"text",label:"热销商品"},{id:"fRate",key:"rate",type:"text",label:"参与率"}],stats:[{id:"stUsers",html:false,value:()=>208},{id:"stAmt",html:true,value:()=>"28,640<em>元</em>"},{id:"stTop",html:false,value:()=>"鸡蛋"},{id:"stRate",html:false,value:()=>"63.2%"}],getStatus:null,rowActions:null,onAction:null});AdminUI.onReady(()=>{document.getElementById("btnExport")?.addEventListener("click",()=>alert("已导出团购运营统计（演示）"));});</script>
</body></html>
