<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>预定管理 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="groupbuy-order" data-tab="预定管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">预定管理</h1><p class="page-desc">预定登记购货人、商品、数量，区分已定未取 / 已定已取</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 登记预定</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">预定数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">已定未取</div><div class="v" id="stWait">0</div></div><div class="stat-card"><div class="k">已定已取</div><div class="v" id="stDone">0</div></div><div class="stat-card"><div class="k">预定金额</div><div class="v" id="stAmt">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>购货人 / 商品</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="已定未取">已定未取</option><option value="已定已取">已定已取</option><option value="已取消">已取消</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>预定日</th><th>购货人</th><th>商品</th><th>数量</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">登记预定</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>购货人<span class="req">*</span></label><input class="ctrl" id="fUser" placeholder=""/></div><div class="form-field"><label>商品<span class="req">*</span></label><input class="ctrl" id="fGoods" placeholder=""/></div><div class="form-field"><label>数量<span class="req">*</span></label><input class="ctrl" id="fQty" placeholder=""/></div><div class="form-field"><label>金额</label><input class="ctrl" id="fAmount" type="number" value="0"/></div><div class="form-field"><label>预定日<span class="req">*</span></label><input class="ctrl" id="fDate" type="date"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="已定未取">已定未取</option><option value="已定已取">已定已取</option><option value="已取消">已取消</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u767b\u8bb0\u9884\u5b9a",editTitle:"编辑",rows:[{date:"2026-07-28",user:"张伟",goods:"东北大米",qty:"1袋",amount:49.9,status:"已定未取"},{date:"2026-07-28",user:"李娜",goods:"鸡蛋",qty:"2份",amount:37.6,status:"已定已取"},{date:"2026-07-29",user:"王敏",goods:"花生油",qty:"1桶",amount:69.9,status:"已定未取"}],columns:[{key:"date"},{key:"user"},{key:"goods"},{key:"qty"},{key:"amount"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.user||"").includes(v)||String(r.goods||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.user||"").includes(v))}],formFields:[{id:"fUser",key:"user",type:"text",label:"购货人",required:true},{id:"fGoods",key:"goods",type:"text",label:"商品",required:true},{id:"fQty",key:"qty",type:"text",label:"数量",required:true},{id:"fAmount",key:"amount",type:"number",label:"金额",default:0},{id:"fDate",key:"date",type:"date",label:"预定日",required:true},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stWait",html:false,value:(l)=>l.filter(r=>r.status==="已定未取").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已定已取").length},{id:"stAmt",html:true,value:(l)=>l.reduce((s,r)=>s+r.amount,0)+"<em>元</em>"}],getStatus:(r)=>({text:r.status,cls:r.status==="已定已取"?"status-on":r.status==="已取消"?"status-off":"status-busy"}),rowActions:(r,i)=> r.status==="已定未取"?`<button type="button" class="link" data-act="pick" data-i="${i}">确认取货</button> <button type="button" class="link" data-edit="${i}">编辑</button>`:`<button type="button" class="link" data-edit="${i}">编辑</button>`,onAction:(act,i,data,render)=>{ if(act==="pick"){ data[i].status="已定已取"; render(); }}});</script>
</body></html>
