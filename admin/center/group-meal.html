<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>团餐服务 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="group-meal" data-tab="团餐服务" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">团餐服务</h1><p class="page-desc">承接学校、团体、周边机构团餐：份数、金额、菜单与定时配送</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新建团餐单</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">团餐单</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">待配送</div><div class="v" id="stTodo">0</div></div><div class="stat-card"><div class="k">已完成</div><div class="v" id="stDone">0</div></div><div class="stat-card"><div class="k">合同额</div><div class="v" id="stAmt">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>客户 / 单号</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待确认">待确认</option><option value="待配送">待配送</option><option value="配送中">配送中</option><option value="已完成">已完成</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>单号</th><th>客户</th><th>份数</th><th>金额</th><th>配送时间</th><th>菜单摘要</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新建团餐单</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>客户单位<span class="req">*</span></label><input class="ctrl" id="fClient" placeholder=""/></div><div class="form-field"><label>份数</label><input class="ctrl" id="fQty" type="number" value="50"/></div><div class="form-field"><label>金额</label><input class="ctrl" id="fAmount" type="number" value="0"/></div><div class="form-field"><label>配送时间<span class="req">*</span></label><input class="ctrl" id="fDeliver" placeholder=""/></div><div class="form-field"><label>菜单摘要</label><input class="ctrl" id="fMenu" placeholder=""/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="待确认">待确认</option><option value="待配送">待配送</option><option value="配送中">配送中</option><option value="已完成">已完成</option></select></div><div class="form-field full"><label>备注</label><textarea class="ctrl" id="fNote" placeholder=""></textarea></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u5efa\u56e2\u9910\u5355",editTitle:"编辑",rows:[{no:"TC20260730001",client:"河东小学",qty:120,amount:2280,deliver:"2026-07-30 11:00",menu:"两荤一素套餐",status:"待配送",note:""},{no:"TC20260728002",client:"社区党群中心",qty:40,amount:760,deliver:"2026-07-28 12:00",menu:"一荤两素",status:"已完成",note:""},{no:"TC20260731003",client:"周边工厂食堂",qty:200,amount:4000,deliver:"2026-07-31 11:30",menu:"定制菜单",status:"待确认",note:""}],columns:[{key:"no"},{key:"client"},{key:"qty"},{key:"amount"},{key:"deliver"},{key:"menu"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.client||"").includes(v)||String(r.no||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.client||"").includes(v))}],formFields:[{id:"fClient",key:"client",type:"text",label:"客户单位",required:true},{id:"fQty",key:"qty",type:"number",label:"份数",default:50},{id:"fAmount",key:"amount",type:"number",label:"金额",default:0},{id:"fDeliver",key:"deliver",type:"text",label:"配送时间",required:true},{id:"fMenu",key:"menu",type:"text",label:"菜单摘要"},{id:"fStatus",key:"status",type:"select",label:"状态"},{id:"fNote",key:"note",type:"textarea",label:"备注"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stTodo",html:false,value:(l)=>l.filter(r=>r.status==="待配送").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已完成").length},{id:"stAmt",html:true,value:(l)=>l.reduce((s,r)=>s+r.amount,0)+"<em>元</em>"}],getStatus:(r)=>({text:r.status,cls:r.status==="已完成"?"status-on":"status-busy"}),rowActions:null,onAction:null});</script>
</body></html>
