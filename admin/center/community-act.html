<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>社区活动管理 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="community-act" data-tab="社区活动管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">社区活动管理</h1><p class="page-desc">发布社区活动、报名管理、签到核销与活动反馈</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 发布活动</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">活动数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">报名中</div><div class="v" id="stOn">0</div></div><div class="stat-card"><div class="k">报名人数</div><div class="v" id="stUsers">0</div></div><div class="stat-card"><div class="k">已结束</div><div class="v" id="stDone">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>活动名</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="报名中">报名中</option><option value="进行中">进行中</option><option value="已结束">已结束</option><option value="已取消">已取消</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>活动</th><th>日期</th><th>地点</th><th>名额</th><th>已报名</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">发布活动</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>活动名称<span class="req">*</span></label><input class="ctrl" id="fName" placeholder=""/></div><div class="form-field"><label>日期<span class="req">*</span></label><input class="ctrl" id="fDate" type="date"/></div><div class="form-field"><label>地点<span class="req">*</span></label><input class="ctrl" id="fPlace" placeholder=""/></div><div class="form-field"><label>名额</label><input class="ctrl" id="fQuota" type="number" value="30"/></div><div class="form-field"><label>已报名</label><input class="ctrl" id="fSigned" type="number" value="0"/></div><div class="form-field full"><label>简介</label><textarea class="ctrl" id="fDesc" placeholder=""></textarea></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="报名中">报名中</option><option value="进行中">进行中</option><option value="已结束">已结束</option><option value="已取消">已取消</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u53d1\u5e03\u6d3b\u52a8",editTitle:"编辑",rows:[{name:"夏日品茗茶会",date:"2026-08-02",place:"一楼多功能厅",quota:40,signed:28,desc:"品茗交流",status:"报名中"},{name:"智能手机课堂",date:"2026-07-25",place:"二楼教室",quota:30,signed:30,desc:"微信与支付教学",status:"已结束"},{name:"健康义诊",date:"2026-08-05",place:"大厅",quota:80,signed:45,desc:"血压血糖检测",status:"报名中"}],columns:[{key:"name"},{key:"date"},{key:"place"},{key:"quota"},{key:"signed"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.name||"").includes(v))}],formFields:[{id:"fName",key:"name",type:"text",label:"活动名称",required:true},{id:"fDate",key:"date",type:"date",label:"日期",required:true},{id:"fPlace",key:"place",type:"text",label:"地点",required:true},{id:"fQuota",key:"quota",type:"number",label:"名额",default:30},{id:"fSigned",key:"signed",type:"number",label:"已报名",default:0},{id:"fDesc",key:"desc",type:"textarea",label:"简介"},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stOn",html:false,value:(l)=>l.filter(r=>r.status==="报名中").length},{id:"stUsers",html:false,value:(l)=>l.reduce((s,r)=>s+r.signed,0)},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已结束").length}],getStatus:(r)=>({text:r.status,cls:r.status==="报名中"?"status-on":r.status==="进行中"?"status-busy":"status-off"}),rowActions:null,onAction:null});</script>
</body></html>
