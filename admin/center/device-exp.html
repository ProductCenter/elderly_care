<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>设备体验管理 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="device-exp" data-tab="设备体验管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">设备体验管理</h1><p class="page-desc">居民预约设备体验时间，到场核销，记录体验反馈</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 预约登记</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">预约数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">待核销</div><div class="v" id="stWait">0</div></div><div class="stat-card"><div class="k">已体验</div><div class="v" id="stDone">0</div></div><div class="stat-card"><div class="k">平均评分</div><div class="v" id="stScore">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>姓名 / 设备</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待核销">待核销</option><option value="已体验">已体验</option><option value="已取消">已取消</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>预约日</th><th>时段</th><th>姓名</th><th>设备</th><th>评分</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">预约登记</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>姓名<span class="req">*</span></label><input class="ctrl" id="fUser" placeholder=""/></div><div class="form-field"><label>设备<span class="req">*</span></label><input class="ctrl" id="fDevice" placeholder=""/></div><div class="form-field"><label>预约日<span class="req">*</span></label><input class="ctrl" id="fDate" type="date"/></div><div class="form-field"><label>时段<span class="req">*</span></label><input class="ctrl" id="fSlot" placeholder="10:00-10:30"/></div><div class="form-field"><label>评分</label><input class="ctrl" id="fScore" type="number" value="0"/></div><div class="form-field full"><label>反馈</label><textarea class="ctrl" id="fFeedback" placeholder=""></textarea></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="待核销">待核销</option><option value="已体验">已体验</option><option value="已取消">已取消</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u9884\u7ea6\u767b\u8bb0",editTitle:"编辑",rows:[{date:"2026-07-30",slot:"10:00-10:30",user:"张伟",device:"智能床垫",score:0,feedback:"",status:"待核销"},{date:"2026-07-29",slot:"14:00-14:30",user:"李娜",device:"跌倒雷达",score:5,feedback:"讲解清楚",status:"已体验"},{date:"2026-07-28",slot:"09:30-10:00",user:"王敏",device:"血压手表",score:4,feedback:"佩戴舒适",status:"已体验"}],columns:[{key:"date"},{key:"slot"},{key:"user"},{key:"device"},{key:"score"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.user||"").includes(v)||String(r.device||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.user||"").includes(v))}],formFields:[{id:"fUser",key:"user",type:"text",label:"姓名",required:true},{id:"fDevice",key:"device",type:"text",label:"设备",required:true},{id:"fDate",key:"date",type:"date",label:"预约日",required:true},{id:"fSlot",key:"slot",type:"text",label:"时段",required:true},{id:"fScore",key:"score",type:"number",label:"评分",default:0},{id:"fFeedback",key:"feedback",type:"textarea",label:"反馈"},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stWait",html:false,value:(l)=>l.filter(r=>r.status==="待核销").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已体验").length},{id:"stScore",html:false,value:(l)=>{const a=l.filter(r=>r.score);return a.length?(a.reduce((s,r)=>s+r.score,0)/a.length).toFixed(1):"-"}}],getStatus:(r)=>({text:r.status,cls:r.status==="已体验"?"status-on":r.status==="已取消"?"status-off":"status-busy"}),rowActions:(r,i)=> r.status==="待核销"?`<button type="button" class="link" data-act="check" data-i="${i}">核销</button> <button type="button" class="link" data-edit="${i}">编辑</button>`:`<button type="button" class="link" data-edit="${i}">编辑</button>`,onAction:(act,i,data,render)=>{ if(act==="check"){ data[i].status="已体验"; if(!data[i].score) data[i].score=5; render(); }}});</script>
</body></html>
