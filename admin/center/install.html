<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>安装及适老化改造 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="install" data-tab="安装及适老化改造" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">安装及适老化改造</h1><p class="page-desc">居民购买设备后登记安装需求，跟踪安装进度与验收</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 登记安装</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">安装单</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">待安装</div><div class="v" id="stWait">0</div></div><div class="stat-card"><div class="k">安装中</div><div class="v" id="stDoing">0</div></div><div class="stat-card"><div class="k">已验收</div><div class="v" id="stDone">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>姓名 / 设备</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待安装">待安装</option><option value="安装中">安装中</option><option value="已验收">已验收</option><option value="已取消">已取消</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>登记日</th><th>姓名</th><th>设备</th><th>地址</th><th>工程师</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">登记安装</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>姓名<span class="req">*</span></label><input class="ctrl" id="fUser" placeholder=""/></div><div class="form-field"><label>设备<span class="req">*</span></label><input class="ctrl" id="fDevice" placeholder=""/></div><div class="form-field"><label>地址<span class="req">*</span></label><input class="ctrl" id="fAddr" placeholder=""/></div><div class="form-field"><label>工程师</label><input class="ctrl" id="fTech" placeholder=""/></div><div class="form-field"><label>登记日<span class="req">*</span></label><input class="ctrl" id="fDate" type="date"/></div><div class="form-field full"><label>备注</label><textarea class="ctrl" id="fNote" placeholder=""></textarea></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="待安装">待安装</option><option value="安装中">安装中</option><option value="已验收">已验收</option><option value="已取消">已取消</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u767b\u8bb0\u5b89\u88c5",editTitle:"编辑",rows:[{date:"2026-07-28",user:"张伟",device:"跌倒雷达",addr:"幸福里3-2-101",tech:"赵工",note:"需打孔",status:"安装中"},{date:"2026-07-27",user:"李娜",device:"智能床垫",addr:"康宁苑5-1-802",tech:"钱工",note:"",status:"已验收"},{date:"2026-07-29",user:"王敏",device:"血压手表",addr:"和美家园2-4-301",tech:"",note:"待派工",status:"待安装"}],columns:[{key:"date"},{key:"user"},{key:"device"},{key:"addr"},{key:"tech"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.user||"").includes(v)||String(r.device||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.user||"").includes(v))}],formFields:[{id:"fUser",key:"user",type:"text",label:"姓名",required:true},{id:"fDevice",key:"device",type:"text",label:"设备",required:true},{id:"fAddr",key:"addr",type:"text",label:"地址",required:true},{id:"fTech",key:"tech",type:"text",label:"工程师"},{id:"fDate",key:"date",type:"date",label:"登记日",required:true},{id:"fNote",key:"note",type:"textarea",label:"备注"},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stWait",html:false,value:(l)=>l.filter(r=>r.status==="待安装").length},{id:"stDoing",html:false,value:(l)=>l.filter(r=>r.status==="安装中").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已验收").length}],getStatus:(r)=>({text:r.status,cls:r.status==="已验收"?"status-on":r.status==="安装中"?"status-busy":r.status==="已取消"?"status-off":"status-repair"}),rowActions:null,onAction:null});</script>
</body></html>
