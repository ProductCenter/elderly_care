<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>设备展示管理 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="device-show" data-tab="设备展示管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">设备展示管理</h1><p class="page-desc">管理展厅展示设备：名称、功能介绍、体验方式、预约规则</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新增展品</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">展品数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">可体验</div><div class="v" id="stOn">0</div></div><div class="stat-card"><div class="k">今日预约</div><div class="v" id="stBook">0</div></div><div class="stat-card"><div class="k">品牌数</div><div class="v" id="stBrand">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>设备 / 品牌</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="可体验">可体验</option><option value="维护中">维护中</option><option value="下架">下架</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>设备</th><th>品牌</th><th>功能</th><th>体验方式</th><th>今日预约</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新增展品</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>设备名称<span class="req">*</span></label><input class="ctrl" id="fName" placeholder=""/></div><div class="form-field"><label>品牌</label><input class="ctrl" id="fBrand" placeholder=""/></div><div class="form-field"><label>功能介绍<span class="req">*</span></label><input class="ctrl" id="fFunc" placeholder=""/></div><div class="form-field"><label>体验方式</label><select class="ctrl" id="fMode"><option value="现场体验">现场体验</option><option value="预约体验">预约体验</option><option value="讲解演示">讲解演示</option></select></div><div class="form-field"><label>今日预约</label><input class="ctrl" id="fToday" type="number" value="0"/></div><div class="form-field full"><label>预约规则</label><textarea class="ctrl" id="fRule" placeholder="如：提前1天预约，每次30分钟"></textarea></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="可体验">可体验</option><option value="维护中">维护中</option><option value="下架">下架</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u589e\u5c55\u54c1",editTitle:"编辑",rows:[{name:"智能床垫",brand:"睡宝",func:"体征监测/离床告警",mode:"预约体验",today:6,rule:"提前1天预约，每次30分钟",status:"可体验"},{name:"跌倒雷达",brand:"安居",func:"跌倒检测/一键呼叫",mode:"讲解演示",today:3,rule:"现场讲解15分钟",status:"可体验"},{name:"血压手表",brand:"康心",func:"血压心率连续监测",mode:"现场体验",today:0,rule:"现场试用",status:"维护中"}],columns:[{key:"name"},{key:"brand"},{key:"func"},{key:"mode"},{key:"today"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v)||String(r.brand||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.name||"").includes(v))}],formFields:[{id:"fName",key:"name",type:"text",label:"设备名称",required:true},{id:"fBrand",key:"brand",type:"text",label:"品牌"},{id:"fFunc",key:"func",type:"text",label:"功能介绍",required:true},{id:"fMode",key:"mode",type:"select",label:"体验方式"},{id:"fToday",key:"today",type:"number",label:"今日预约",default:0},{id:"fRule",key:"rule",type:"textarea",label:"预约规则"},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stOn",html:false,value:(l)=>l.filter(r=>r.status==="可体验").length},{id:"stBook",html:false,value:(l)=>l.reduce((s,r)=>s+r.today,0)},{id:"stBrand",html:false,value:(l)=>new Set(l.map(r=>r.brand)).size}],getStatus:(r)=>({text:r.status,cls:r.status==="可体验"?"status-on":r.status==="维护中"?"status-busy":"status-off"}),rowActions:null,onAction:null});</script>
</body></html>
