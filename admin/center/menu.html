<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>菜单规划管理 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="menu" data-tab="菜单规划管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">菜单规划管理</h1><p class="page-desc">每周提前发布菜谱：早餐/午餐各 8-12 个菜品，含食材、营养、口味、单价</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 添加菜品</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">菜品数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">早餐</div><div class="v" id="stB">0</div></div><div class="stat-card"><div class="k">午餐</div><div class="v" id="stL">0</div></div><div class="stat-card"><div class="k">本周上架</div><div class="v" id="stOn">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>菜品</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>餐次</label><select class="ctrl" id="qMeal"><option value="">全部</option><option value="早餐">早餐</option><option value="午餐">午餐</option><option value="晚餐">晚餐</option></select></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="上架">上架</option><option value="下架">下架</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>菜品</th><th>餐次</th><th>口味</th><th>营养标签</th><th>单价</th><th>周次</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">添加菜品</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>菜品名称<span class="req">*</span></label><input class="ctrl" id="fName" placeholder=""/></div><div class="form-field"><label>餐次</label><select class="ctrl" id="fMeal"><option value="早餐">早餐</option><option value="午餐">午餐</option><option value="晚餐">晚餐</option></select></div><div class="form-field"><label>口味</label><input class="ctrl" id="fTaste" placeholder=""/></div><div class="form-field"><label>营养标签</label><input class="ctrl" id="fNutrition" placeholder="高蛋白/低盐"/></div><div class="form-field"><label>单价</label><input class="ctrl" id="fPrice" type="number" value="8"/></div><div class="form-field"><label>周次</label><input class="ctrl" id="fWeek" placeholder="2026-W31"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="上架">上架</option><option value="下架">下架</option></select></div><div class="form-field full"><label>食材清单</label><textarea class="ctrl" id="fIng" placeholder=""></textarea></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u6dfb\u52a0\u83dc\u54c1",editTitle:"编辑",rows:[{name:"小米粥",meal:"早餐",taste:"清淡",nutrition:"易消化",price:3,week:"2026-W31",status:"上架",ing:"小米,水"},{name:"番茄牛腩",meal:"午餐",taste:"家常",nutrition:"高蛋白",price:18,week:"2026-W31",status:"上架",ing:"牛腩,番茄"},{name:"清蒸鲈鱼",meal:"午餐",taste:"清淡",nutrition:"低脂",price:22,week:"2026-W31",status:"上架",ing:"鲈鱼"},{name:"疙瘩汤",meal:"晚餐",taste:"家常",nutrition:"暖胃",price:8,week:"2026-W31",status:"上架",ing:"面粉,番茄"}],columns:[{key:"name"},{key:"meal"},{key:"taste"},{key:"nutrition"},{key:"price"},{key:"week"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.name||"").includes(v))},{id:"qMeal",match:(r,v)=>!v||String(r.meal)===v},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v}],formFields:[{id:"fName",key:"name",type:"text",label:"菜品名称",required:true},{id:"fMeal",key:"meal",type:"select",label:"餐次"},{id:"fTaste",key:"taste",type:"text",label:"口味"},{id:"fNutrition",key:"nutrition",type:"text",label:"营养标签"},{id:"fPrice",key:"price",type:"number",label:"单价",default:8},{id:"fWeek",key:"week",type:"text",label:"周次"},{id:"fStatus",key:"status",type:"select",label:"状态"},{id:"fIng",key:"ing",type:"textarea",label:"食材清单"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stB",html:false,value:(l)=>l.filter(r=>r.meal==="早餐").length},{id:"stL",html:false,value:(l)=>l.filter(r=>r.meal==="午餐").length},{id:"stOn",html:false,value:(l)=>l.filter(r=>r.status==="上架").length}],getStatus:(r)=>({text:r.status,cls:r.status==="上架"?"status-on":"status-off"}),rowActions:null,onAction:null});</script>
</body></html>
