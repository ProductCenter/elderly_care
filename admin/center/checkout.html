<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>退住办理 · 天津康养运营平台</title>
<link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="checkout" data-tab="退住办理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div>
<template id="page-content">
<div class="page-head"><div><h1 class="page-title">退住办理</h1><p class="page-desc">规范化退住：费用结算 → 物品清点 → 房间验收 → 退住原因 → 后续服务推荐</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 发起退住</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">退住单</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">办理中</div><div class="v" id="stDoing">0</div></div><div class="stat-card"><div class="k">已退住</div><div class="v" id="stDone">0</div></div><div class="stat-card"><div class="k">本月退住</div><div class="v" id="stMonth">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>长者 / 单号</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="费用结算">费用结算</option><option value="物品清点">物品清点</option><option value="房间验收">房间验收</option><option value="已退住">已退住</option></select></div><div class="filter-item"><label>原因</label><select class="ctrl" id="qReason"><option value="">全部</option><option value="家属接回">家属接回</option><option value="转院">转院</option><option value="身故">身故</option><option value="其他">其他</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>单号</th><th>长者</th><th>原床位</th><th>原因</th><th>结算金额</th><th>经办人</th><th>申请日</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer">
<div class="drawer-head"><h3 id="drawerTitle">发起退住</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>长者<span class="req">*</span></label><select class="ctrl" id="fElder"><option value="张秀英">张秀英</option><option value="李建国">李建国</option><option value="陈桂兰">陈桂兰</option><option value="王德福">王德福</option><option value="赵国强">赵国强</option></select></div><div class="form-field"><label>原床位<span class="req">*</span></label><input class="ctrl" id="fBed" placeholder=""/></div><div class="form-field"><label>退住原因</label><select class="ctrl" id="fReason"><option value="家属接回">家属接回</option><option value="转院">转院</option><option value="身故">身故</option><option value="其他">其他</option></select></div><div class="form-field"><label>结算金额</label><input class="ctrl" id="fAmount" type="number" value="0"/></div><div class="form-field"><label>经办人</label><input class="ctrl" id="fBy" placeholder=""/></div><div class="form-field"><label>申请日<span class="req">*</span></label><input class="ctrl" id="fDate" type="date"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="费用结算">费用结算</option><option value="物品清点">物品清点</option><option value="房间验收">房间验收</option><option value="已退住">已退住</option></select></div><div class="form-field full"><label>后续服务推荐</label><textarea class="ctrl" id="fNote" placeholder="居家上门/日间照料等"></textarea></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div>
</aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u53d1\u8d77\u9000\u4f4f",editTitle:"编辑",rows:[
    {no:"TZ20260725001",elder:"试住长者",bed:"4F 401-B",reason:"家属接回",amount:3200,by:"刘芳",date:"2026-07-25",status:"已退住",note:"推荐上门护理"},
    {no:"TZ20260730002",elder:"王德福",bed:"1F 108-B",reason:"转院",amount:8600,by:"陈静",date:"2026-07-30",status:"费用结算",note:""},
  ],columns:[{key:"no"},{key:"elder"},{key:"bed"},{key:"reason"},{key:"amount"},{key:"by"},{key:"date"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.elder||"").includes(v)||String(r.no||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"qReason",match:(r,v)=>!v||String(r.reason)===v}],formFields:[{id:"fElder",key:"elder",type:"select",label:"长者",required:true},{id:"fBed",key:"bed",type:"text",label:"原床位",required:true},{id:"fReason",key:"reason",type:"select",label:"退住原因"},{id:"fAmount",key:"amount",type:"number",label:"结算金额",default:0},{id:"fBy",key:"by",type:"text",label:"经办人"},{id:"fDate",key:"date",type:"date",label:"申请日",required:true},{id:"fStatus",key:"status",type:"select",label:"状态"},{id:"fNote",key:"note",type:"textarea",label:"后续服务推荐"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stDoing",html:false,value:(l)=>l.filter(r=>r.status!=="已退住").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已退住").length},{id:"stMonth",html:false,value:(l)=>l.filter(r=>(r.date||"").startsWith("2026-07")&&r.status==="已退住").length}],getStatus:(r)=>({text:r.status,cls:r.status==="已退住"?"status-on":"status-busy"}),rowActions:null,onAction:null});</script>
</body></html>
