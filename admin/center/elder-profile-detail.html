<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>长者健康详情 · C-Life 运营驾驶舱</title>
  <style>
    :root {
      --bg: #050d1f;
      --cyan: #38bdf8;
      --blue: #3b82f6;
      --teal: #2dd4bf;
      --violet: #a78bfa;
      --amber: #fbbf24;
      --rose: #f87171;
      --muted: #7ea4c9;
      --line: rgba(64, 168, 255, 0.28);
      --font: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%; font-family: var(--font); color: #e8f3ff;
      background:
        radial-gradient(800px 420px at 50% 0%, rgba(30,100,180,.2), transparent 60%),
        linear-gradient(180deg, #061228, #050d1f 50%, #040a18);
    }
    .page { max-width: 1280px; margin: 0 auto; padding: 18px 20px 28px; }
    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .top h1 {
      font-size: 22px; letter-spacing: 2px;
      background: linear-gradient(180deg, #fff, #7dd3fc);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .top p { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    .btn {
      height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
      background: rgba(12,40,80,.7); color: #c7e4ff; font-size: 12px; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn.primary {
      background: linear-gradient(135deg, rgba(56,189,248,.4), rgba(59,130,246,.5));
      color: #fff; border: none; box-shadow: 0 0 14px rgba(56,189,248,.3);
    }
    .panel {
      border: 1px solid var(--line); border-radius: 12px;
      background: rgba(8,28,58,.72); padding: 16px;
      box-shadow: 0 0 24px rgba(0,0,0,.3); margin-bottom: 12px;
      position: relative;
    }
    .panel::before {
      content: ""; position: absolute; left: 16px; right: 16px; top: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    }
    .sec { font-size: 13px; color: #93c5fd; margin-bottom: 10px; font-weight: 700; }
    .pinfo { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; margin-bottom: 12px; }
    .pinfo b { color: var(--muted); font-weight: 500; margin-right: 6px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tags span {
      font-size: 12px; padding: 4px 10px; border-radius: 5px;
      background: rgba(30,58,95,.9); border: 1px solid rgba(100,140,190,.35); color: #c7d7eb;
    }
    .judge {
      padding: 10px 12px; border-radius: 8px; margin-bottom: 14px;
      border: 1px solid rgba(64,168,255,.3); background: rgba(8,28,58,.55);
      font-size: 13px; color: #c7d7eb; line-height: 1.5;
    }
    .judge strong { color: var(--amber); }
    .vitals {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
    }
    .vital {
      padding: 12px 14px; border-radius: 8px;
      background: rgba(4,18,40,.7); border: 1px solid rgba(64,168,255,.2);
    }
    .vital .t { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .vital .row { display: flex; justify-content: space-between; align-items: baseline; }
    .vital .val { font-size: 22px; font-weight: 800; }
    .vital .val em { font-style: normal; font-size: 11px; color: var(--muted); margin-left: 3px; }
    .vital .st { font-size: 12px; font-weight: 700; }
    .st.ok { color: var(--cyan); }
    .st.low { color: var(--rose); }
    .st.na { color: #6488a8; }
    .charts {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .chart-box {
      border: 1px solid rgba(64,168,255,.2); border-radius: 10px;
      background: rgba(4,16,36,.5); padding: 10px 12px; min-height: 220px;
      display: flex; flex-direction: column;
    }
    .chart-box .cap { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .chart-box > div:last-child { flex: 1; min-height: 160px; }
    @media (max-width: 900px) {
      .vitals, .charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

      <div class="chart-box">

        <div id="orderLine"></div>
      </div>
    </section>
  </div>

            { name: "舒张压", val: "80", unit: "mmHg", st: "正常", cls: "ok" },

            { name: "空腹血糖", val: "--", unit: "", st: "暂无", cls: "na" },

          ],

          pulse: [62, 64, 66, 63, 65, 64, 64],
          spo2: [97, 98, 98, 97, 98, 98, 98],
        },
      };

      const id = new URLSearchParams(location.search).get("id") || "chen";
      const e = DB[id] || DB.chen;

      document.getElementById("pinfo").innerHTML = `
        <span><b>姓名</b>${e.name}</span>
        <span><b>性别</b>${e.gender}</span>
        <span><b>年龄</b>${e.age}</span>
        <span><b>体重</b>${e.weight}</span>
        <span><b>身高</b>${e.height}</span>
        <span><b>档案号</b>${id.toUpperCase()}-JS01</span>`;
      document.getElementById("tags").innerHTML = e.tags.map(t => `<span>${t}</span>`).join("");
      document.getElementById("judge").innerHTML = e.judge;
      document.getElementById("vitals").innerHTML = e.vitals.map(v => `
        <div class="vital">
          <div class="t">${v.name}</div>
          <div class="row">
            <div class="val">${v.val}${v.unit ? `<em>${v.unit}</em>` : ""}</div>
            <div class="st ${v.cls}">${v.st}</div>
          </div>
        </div>`).join("");

      document.getElementById("btnFs").onclick = () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      };

      function lineChart(el, labels, series, yMax) {
        const w = 520, h = 180, pad = { l: 34, r: 10, t: 12, b: 24 };
        const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
        const max = yMax || Math.max(...series.flatMap(s => s.data), 1) * 1.15;
        const xAt = i => pad.l + (iw * i) / Math.max(labels.length - 1, 1);
        const yAt = v => pad.t + ih - (v / max) * ih;
        let svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;display:block">`;
        for (let i = 0; i <= 4; i++) {
          const y = pad.t + (ih * i) / 4;
          svg += `<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="rgba(56,189,248,.12)" stroke-dasharray="3 3"/>`;
          svg += `<text x="${pad.l-4}" y="${y+3}" fill="#6488a8" font-size="10" text-anchor="end">${Math.round(max*(1-i/4))}</text>`;
        }
        labels.forEach((lab, i) => svg += `<text x="${xAt(i)}" y="${h-6}" fill="#6488a8" font-size="10" text-anchor="middle">${lab}</text>`);
        series.forEach(s => {
          const d = s.data.map((v, i) => `${i?"L":"M"}${xAt(i)},${yAt(v)}`).join(" ");
          svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2"/>`;
          s.data.forEach((v, i) => svg += `<circle cx="${xAt(i)}" cy="${yAt(v)}" r="3" fill="#041024" stroke="${s.color}" stroke-width="1.8"/>`);
        });
        el.innerHTML = svg + "</svg>";
      }

      function barChart(el, labels, data, colors) {
        const w = 520, h = 180, pad = { l: 34, r: 10, t: 12, b: 28 };
        const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
        const max = Math.max(...data, 1) * 1.2;
        const gw = iw / labels.length, bw = Math.min(36, gw * 0.5);
        let svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;display:block">`;
        labels.forEach((lab, i) => {
          const bh = (data[i] / max) * ih, x = pad.l + gw * i + gw / 2 - bw / 2;
          svg += `<rect x="${x}" y="${pad.t+ih-bh}" width="${bw}" height="${bh}" rx="3" fill="${colors[i%colors.length]}"/>`;
          svg += `<text x="${x+bw/2}" y="${h-8}" fill="#7ea4c9" font-size="10" text-anchor="middle">${lab}</text>`;
          svg += `<text x="${x+bw/2}" y="${pad.t+ih-bh-5}" fill="#93c5fd" font-size="10" text-anchor="middle">${data[i]}</text>`;
        });
        el.innerHTML = svg + "</svg>";
      }

      const days = ["01","02","03","04","05","06","07"];
      lineChart(document.getElementById("bpLine"), days, [
        { name: "收缩压", color: "#38bdf8", data: e.bp.sys },
        { name: "舒张压", color: "#a78bfa", data: e.bp.dia },
      ], 160);
      lineChart(document.getElementById("pulseLine"), days, [
        { name: "脉率", color: "#f87171", data: e.pulse },
        { name: "血氧", color: "#2dd4bf", data: e.spo2 },

      barChart(document.getElementById("sceneBar"),

</body>
</html>
