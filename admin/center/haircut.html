<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>理发服务管理 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="haircut" data-tab="理发服务管理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">理发服务管理</h1><p class="page-desc">管理理发服务预约：服务时间 → 预约 → 提醒 → 记录 → 金额</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新建理发预约</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">预约数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">待服务</div><div class="v" id="stTodo">0</div></div><div class="stat-card"><div class="k">已完成</div><div class="v" id="stDone">0</div></div><div class="stat-card"><div class="k">服务金额</div><div class="v" id="stAmt">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>顾客</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待服务">待服务</option><option value="已提醒">已提醒</option><option value="已完成">已完成</option><option value="已取消">已取消</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>预约时间</th><th>顾客</th><th>联系电话</th><th>服务项</th><th>金额</th><th>备注</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新建理发预约</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>顾客<span class="req">*</span></label><input class="ctrl" id="fUser" placeholder=""/></div><div class="form-field"><label>电话</label><input class="ctrl" id="fPhone" placeholder=""/></div><div class="form-field"><label>预约时间<span class="req">*</span></label><input class="ctrl" id="fTime" placeholder=""/></div><div class="form-field"><label>服务项</label><input class="ctrl" id="fItem" placeholder=""/></div><div class="form-field"><label>金额</label><input class="ctrl" id="fAmount" type="number" value="35"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="待服务">待服务</option><option value="已提醒">已提醒</option><option value="已完成">已完成</option><option value="已取消">已取消</option></select></div><div class="form-field full"><label>备注</label><textarea class="ctrl" id="fNote" placeholder=""></textarea></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u5efa\u7406\u53d1\u9884\u7ea6",editTitle:"编辑",rows:[{time:"2026-07-30 09:30",user:"张秀英",phone:"138****6621",item:"理发",amount:35,note:"",status:"待服务"},{time:"2026-07-29 14:00",user:"陈桂兰",phone:"135****7788",item:"理发",amount:40,note:"",status:"已完成"},{time:"2026-07-31 10:00",user:"社区居民-王",phone:"139****1180",item:"理发",amount:35,note:"",status:"已提醒"}],columns:[{key:"time"},{key:"user"},{key:"phone"},{key:"item"},{key:"amount"},{key:"note"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.user||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.user||"").includes(v))}],formFields:[{id:"fUser",key:"user",type:"text",label:"顾客",required:true},{id:"fPhone",key:"phone",type:"text",label:"电话"},{id:"fTime",key:"time",type:"text",label:"预约时间",required:true},{id:"fItem",key:"item",type:"text",label:"服务项"},{id:"fAmount",key:"amount",type:"number",label:"金额",default:35},{id:"fStatus",key:"status",type:"select",label:"状态"},{id:"fNote",key:"note",type:"textarea",label:"备注"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stTodo",html:false,value:(l)=>l.filter(r=>r.status==="待服务").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已完成").length},{id:"stAmt",html:true,value:(l)=>l.reduce((s,r)=>s+r.amount,0)+"<em>元</em>"}],getStatus:(r)=>({text:r.status,cls:r.status==="已完成"?"status-on":r.status==="已取消"?"status-off":"status-busy"}),rowActions:null,onAction:null});</script>
</body></html>
