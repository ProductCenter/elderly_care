<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>入住办理 · 天津康养运营平台</title>
<link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="center" data-sub="checkin" data-tab="入住办理" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div>
<template id="page-content">
<div class="page-head"><div><h1 class="page-title">入住办理</h1><p class="page-desc">标准化入住流程：能力评估 → 资料采集 → 合同签订 → 床位分配 → 费用缴纳</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新建入住单</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">入住单</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">办理中</div><div class="v" id="stDoing">0</div></div><div class="stat-card"><div class="k">已入住</div><div class="v" id="stDone">0</div></div><div class="stat-card"><div class="k">本月新入</div><div class="v" id="stMonth">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>长者 / 单号</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="资料采集">资料采集</option><option value="评估中">评估中</option><option value="待签约">待签约</option><option value="待缴费">待缴费</option><option value="办理中">办理中</option><option value="已入住">已入住</option></select></div><div class="filter-item"><label>来源</label><select class="ctrl" id="qType"><option value="">全部</option><option value="社招">社招</option><option value="特困">特困</option><option value="转介">转介</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>单号</th><th>长者</th><th>来源</th><th>能力等级</th><th>拟分配床位</th><th>经办人</th><th>申请日</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer">
<div class="drawer-head"><h3 id="drawerTitle">新建入住单</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>长者<span class="req">*</span></label><input class="ctrl" id="fElder" placeholder=""/></div><div class="form-field"><label>来源</label><select class="ctrl" id="fSource"><option value="社招">社招</option><option value="特困">特困</option><option value="转介">转介</option></select></div><div class="form-field"><label>能力等级</label><select class="ctrl" id="fLevel"><option value="待评估">待评估</option><option value="能力完好">能力完好</option><option value="轻度失能">轻度失能</option><option value="中度失能">中度失能</option><option value="重度失能">重度失能</option></select></div><div class="form-field"><label>拟分配床位</label><input class="ctrl" id="fBed" placeholder=""/></div><div class="form-field"><label>经办人</label><input class="ctrl" id="fBy" placeholder=""/></div><div class="form-field"><label>申请日<span class="req">*</span></label><input class="ctrl" id="fDate" type="date"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="资料采集">资料采集</option><option value="评估中">评估中</option><option value="待签约">待签约</option><option value="待缴费">待缴费</option><option value="办理中">办理中</option><option value="已入住">已入住</option></select></div><div class="form-field full"><label>备注</label><textarea class="ctrl" id="fNote" placeholder=""></textarea></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div>
</aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u5efa\u5165\u4f4f\u5355",editTitle:"编辑",rows:[
    {no:"RZ20260730001",elder:"赵国强",source:"社招",level:"轻度失能",bed:"2F 220-A",by:"刘芳",date:"2026-07-30",status:"待签约",note:""},
    {no:"RZ20260728002",elder:"周明",source:"转介",level:"中度失能",bed:"5F 502-A",by:"陈静",date:"2026-07-28",status:"待缴费",note:""},
    {no:"RZ20260705003",elder:"陈桂兰",source:"社招",level:"能力完好",bed:"2F 215-A",by:"刘芳",date:"2026-07-05",status:"已入住",note:""},
    {no:"RZ20260729004",elder:"孙秀英",source:"特困",level:"待评估",bed:"",by:"王悦",date:"2026-07-29",status:"评估中",note:""},
  ],columns:[{key:"no"},{key:"elder"},{key:"source"},{key:"level"},{key:"bed"},{key:"by"},{key:"date"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.elder||"").includes(v)||String(r.no||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"qType",match:(r,v)=>!v||String(r.source)===v}],formFields:[{id:"fElder",key:"elder",type:"text",label:"长者",required:true},{id:"fSource",key:"source",type:"select",label:"来源"},{id:"fLevel",key:"level",type:"select",label:"能力等级"},{id:"fBed",key:"bed",type:"text",label:"拟分配床位"},{id:"fBy",key:"by",type:"text",label:"经办人"},{id:"fDate",key:"date",type:"date",label:"申请日",required:true},{id:"fStatus",key:"status",type:"select",label:"状态"},{id:"fNote",key:"note",type:"textarea",label:"备注"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stDoing",html:false,value:(l)=>l.filter(r=>r.status==="办理中").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已入住").length},{id:"stMonth",html:false,value:(l)=>l.filter(r=>(r.date||"").startsWith("2026-07")).length}],getStatus:(r)=>({text:r.status,cls:r.status==="已入住"?"status-on":"status-busy"}),rowActions:null,onAction:null});</script>
</body></html>
