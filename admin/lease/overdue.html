<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>租金逾期预警 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="lease" data-sub="overdue" data-tab="租金逾期预警" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">租金逾期预警</h1><p class="page-desc">跟踪逾期租金、催缴次数、承诺还款日与处理结果</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新增催缴</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">欠费户</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">欠费合计</div><div class="v" id="stAmt">0</div></div><div class="stat-card"><div class="k">待催缴</div><div class="v" id="stUrge">0</div></div><div class="stat-card"><div class="k">已承诺</div><div class="v" id="stPromise">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>房号 / 租户</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待催缴">待催缴</option><option value="已承诺">已承诺</option><option value="已结清">已结清</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>房号</th><th>租户</th><th>欠费</th><th>逾期天</th><th>催缴次</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新增催缴</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>房号<span class="req">*</span></label><input class="ctrl" id="fRoom" placeholder=""/></div><div class="form-field"><label>租户<span class="req">*</span></label><input class="ctrl" id="fTenant" placeholder=""/></div><div class="form-field"><label>欠费金额</label><input class="ctrl" id="fAmount" type="number" value="0"/></div><div class="form-field"><label>逾期天</label><input class="ctrl" id="fDays" type="number" value="0"/></div><div class="form-field"><label>催缴次</label><input class="ctrl" id="fTimes" type="number" value="0"/></div><div class="form-field"><label>承诺还款日</label><input class="ctrl" id="fPromise" type="date"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="待催缴">待催缴</option><option value="已承诺">已承诺</option><option value="已结清">已结清</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u589e\u50ac\u7f34",editTitle:"编辑",rows:[{room:"B-201",tenant:"康宁诊所",amount:4800,days:12,times:1,promise:"2026-08-05",status:"已承诺"},{room:"C-105",tenant:"老街茶馆",amount:2100,days:28,times:3,promise:"",status:"待催缴"}],columns:[{key:"room"},{key:"tenant"},{key:"amount"},{key:"days"},{key:"times"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.room||"").includes(v)||String(r.tenant||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.room||"").includes(v))}],formFields:[{id:"fRoom",key:"room",type:"text",label:"房号",required:true},{id:"fTenant",key:"tenant",type:"text",label:"租户",required:true},{id:"fAmount",key:"amount",type:"number",label:"欠费金额",default:0},{id:"fDays",key:"days",type:"number",label:"逾期天",default:0},{id:"fTimes",key:"times",type:"number",label:"催缴次",default:0},{id:"fPromise",key:"promise",type:"date",label:"承诺还款日"},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stAmt",html:true,value:(l)=>l.reduce((s,r)=>s+r.amount,0)+"<em>元</em>"},{id:"stUrge",html:false,value:(l)=>l.filter(r=>r.status==="待催缴").length},{id:"stPromise",html:false,value:(l)=>l.filter(r=>r.status==="已承诺").length}],getStatus:(r)=>({text:r.status,cls:r.status==="已结清"?"status-on":r.status==="已承诺"?"status-busy":"status-repair"}),rowActions:(r,i)=> r.status!=="已结清"?`<button type="button" class="link" data-act="urge" data-i="${i}">登记催缴</button> <button type="button" class="link" data-edit="${i}">编辑</button>`:`<button type="button" class="link" data-edit="${i}">编辑</button>`,onAction:(act,i,data,render)=>{ if(act==="urge"){ data[i].times=(data[i].times||0)+1; data[i].status="已承诺"; render(); }}});</script>
</body></html>
