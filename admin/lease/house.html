<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>房屋信息 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="lease" data-sub="house" data-tab="房屋信息" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">房屋信息</h1><p class="page-desc">管理租赁房源：房号、面积、租金、租户、合同周期与状态</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 新增房源</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">房源数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">已出租</div><div class="v" id="stRent">0</div></div><div class="stat-card"><div class="k">空置</div><div class="v" id="stEmpty">0</div></div><div class="stat-card"><div class="k">出租率</div><div class="v" id="stRate">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>房号 / 租户</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="已出租">已出租</option><option value="空置">空置</option><option value="装修中">装修中</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>房号</th><th>面积</th><th>月租</th><th>租户</th><th>合同期</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">新增房源</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>房号<span class="req">*</span></label><input class="ctrl" id="fRoom" placeholder=""/></div><div class="form-field"><label>面积㎡<span class="req">*</span></label><input class="ctrl" id="fArea" placeholder=""/></div><div class="form-field"><label>月租</label><input class="ctrl" id="fRent" type="number" value="0"/></div><div class="form-field"><label>租户</label><input class="ctrl" id="fTenant" placeholder=""/></div><div class="form-field"><label>合同期</label><input class="ctrl" id="fPeriod" placeholder="2026-01~2026-12"/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="已出租">已出租</option><option value="空置">空置</option><option value="装修中">装修中</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u65b0\u589e\u623f\u6e90",editTitle:"编辑",rows:[{room:"A-101",area:"68",rent:3200,tenant:"津城便利店",period:"2026-01~2026-12",status:"已出租"},{room:"A-102",area:"45",rent:2100,tenant:"",period:"-",status:"空置"},{room:"B-201",area:"92",rent:4800,tenant:"康宁诊所",period:"2025-07~2026-06",status:"已出租"},{room:"B-202",area:"56",rent:2600,tenant:"",period:"-",status:"装修中"}],columns:[{key:"room"},{key:"area"},{key:"rent"},{key:"tenant"},{key:"period"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.room||"").includes(v)||String(r.tenant||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.room||"").includes(v))}],formFields:[{id:"fRoom",key:"room",type:"text",label:"房号",required:true},{id:"fArea",key:"area",type:"text",label:"面积㎡",required:true},{id:"fRent",key:"rent",type:"number",label:"月租",default:0},{id:"fTenant",key:"tenant",type:"text",label:"租户"},{id:"fPeriod",key:"period",type:"text",label:"合同期"},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stRent",html:false,value:(l)=>l.filter(r=>r.status==="已出租").length},{id:"stEmpty",html:false,value:(l)=>l.filter(r=>r.status==="空置").length},{id:"stRate",html:false,value:(l)=>l.length?Math.round(100*l.filter(r=>r.status==="已出租").length/l.length)+"%":"-"}],getStatus:(r)=>({text:r.status,cls:r.status==="已出租"?"status-on":r.status==="装修中"?"status-busy":"status-off"}),rowActions:null,onAction:null});</script>
</body></html>
