<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>每月缴费情况 · 天津康养运营平台</title><link rel="stylesheet" href="../css/admin-shell.css"/><link rel="stylesheet" href="../css/admin-list.css"/></head>
<body data-primary="lease" data-sub="payment" data-tab="每月缴费情况" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div><template id="page-content">
<div class="page-head"><div><h1 class="page-title">每月缴费情况</h1><p class="page-desc">登记每月租金应收、实收、缴费方式与开票状态</p></div>
<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" id="btnAdd">+ 登记缴费</button></div></div>
<div class="stat-row"><div class="stat-card"><div class="k">账单数</div><div class="v" id="stTotal">0</div></div><div class="stat-card"><div class="k">已收</div><div class="v" id="stPaid">0</div></div><div class="stat-card"><div class="k">待收</div><div class="v" id="stWait">0</div></div><div class="stat-card"><div class="k">本月实收</div><div class="v" id="stAmt">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>房号 / 租户</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="已收">已收</option><option value="待收">待收</option><option value="部分收">部分收</option></select></div><div class="filter-item"><label></label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>账期</th><th>房号</th><th>租户</th><th>应收</th><th>方式</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer"><div class="drawer-head"><h3 id="drawerTitle">登记缴费</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
<div class="drawer-body"><div class="form-grid"><div class="form-field"><label>账期<span class="req">*</span></label><input class="ctrl" id="fMonth" placeholder="2026-07"/></div><div class="form-field"><label>房号<span class="req">*</span></label><input class="ctrl" id="fRoom" placeholder=""/></div><div class="form-field"><label>租户<span class="req">*</span></label><input class="ctrl" id="fTenant" placeholder=""/></div><div class="form-field"><label>应收</label><input class="ctrl" id="fAmount" type="number" value="0"/></div><div class="form-field"><label>方式</label><select class="ctrl" id="fPay"><option value="转账">转账</option><option value="现金">现金</option><option value="微信">微信</option><option value="-">-</option></select></div><div class="form-field"><label>开票</label><select class="ctrl" id="fInvoice"><option value="已开">已开</option><option value="未开">未开</option></select></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="已收">已收</option><option value="待收">待收</option><option value="部分收">部分收</option></select></div></div></div>
<div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div></aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script><script src="../js/admin-shell.js"></script><script src="../js/admin-ui.js"></script><script src="../js/admin-page-list.js"></script>
<script>AdminPageList.mount({addTitle:"\u767b\u8bb0\u7f34\u8d39",editTitle:"编辑",rows:[{month:"2026-07",room:"A-101",tenant:"津城便利店",amount:3200,pay:"转账",invoice:"已开",status:"已收"},{month:"2026-07",room:"B-201",tenant:"康宁诊所",amount:4800,pay:"-",invoice:"未开",status:"待收"},{month:"2026-06",room:"A-101",tenant:"津城便利店",amount:3200,pay:"转账",invoice:"已开",status:"已收"}],columns:[{key:"month"},{key:"room"},{key:"tenant"},{key:"amount"},{key:"pay"},{key:"status",status:true}],filters:[{id:"qKeyword",match:(r,v)=>!v||(String(r.room||"").includes(v)||String(r.tenant||"").includes(v))},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",match:(r,v)=>!v||(String(r.room||"").includes(v))}],formFields:[{id:"fMonth",key:"month",type:"text",label:"账期",required:true},{id:"fRoom",key:"room",type:"text",label:"房号",required:true},{id:"fTenant",key:"tenant",type:"text",label:"租户",required:true},{id:"fAmount",key:"amount",type:"number",label:"应收",default:0},{id:"fPay",key:"pay",type:"select",label:"方式"},{id:"fInvoice",key:"invoice",type:"select",label:"开票"},{id:"fStatus",key:"status",type:"select",label:"状态"}],stats:[{id:"stTotal",html:false,value:(l)=>l.length},{id:"stPaid",html:false,value:(l)=>l.filter(r=>r.status==="已收").length},{id:"stWait",html:false,value:(l)=>l.filter(r=>r.status==="待收").length},{id:"stAmt",html:true,value:(l)=>l.filter(r=>r.status==="已收").reduce((s,r)=>s+r.amount,0)+"<em>元</em>"}],getStatus:(r)=>({text:r.status,cls:r.status==="已收"?"status-on":r.status==="部分收"?"status-busy":"status-repair"}),rowActions:(r,i)=> r.status!=="已收"?`<button type="button" class="link" data-act="pay" data-i="${i}">确认收款</button> <button type="button" class="link" data-edit="${i}">编辑</button>`:`<button type="button" class="link" data-edit="${i}">编辑</button>`,onAction:(act,i,data,render)=>{ if(act==="pay"){ data[i].status="已收"; if(data[i].pay==="-") data[i].pay="转账"; render(); }}});</script>
</body></html>
