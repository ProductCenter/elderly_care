<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>人工客服工作台 · 天津康养运营平台</title>
<link rel="stylesheet" href="../css/admin-shell.css"/>
<link rel="stylesheet" href="../css/admin-list.css"/>
</head>
<body data-primary="fulfill" data-sub="aftersale-cs" data-tab="人工客服工作台" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div>
<template id="page-content">
<div class="page-head">
  <div>
    <h1 class="page-title">人工客服工作台</h1>
    <p class="page-desc">集中处理咨询/投诉/进度查询；支持服务记录、附件、备注；含长者快捷入口</p>
  </div>
  <div style="display:flex;gap:8px">
    <a class="btn btn-default" href="./index.html">履约总览</a>
    <button type="button" class="btn btn-primary" id="btnAdd">+ 新建工单</button>
  </div>
</div>
<div class="stat-row"><div class="stat-card"><div class="k">待接单</div><div class="v" id="stWait">0</div></div><div class="stat-card"><div class="k">沟通中</div><div class="v" id="stTalk">0</div></div><div class="stat-card"><div class="k">已办结</div><div class="v" id="stDone">0</div></div><div class="stat-card"><div class="k">长者入口</div><div class="v" id="stElder">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>工单/用户/主题</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>来源</label><select class="ctrl" id="qChannel"><option value="">全部</option><option value="在线客服">在线客服</option><option value="电话">电话</option><option value="长者快捷">长者快捷</option><option value="投诉升级">投诉升级</option></select></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待接单">待接单</option><option value="沟通中">沟通中</option><option value="已办结">已办结</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>工单号</th><th>用户</th><th>来源</th><th>主题</th><th>长者入口</th><th>客服</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer">
  <div class="drawer-head"><h3 id="drawerTitle">新建工单</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
  <div class="drawer-body"><div class="form-grid"><div class="form-field"><label>工单号<span class="req">*</span></label><input class="ctrl" id="fTicketId" type="text"  placeholder=""/></div><div class="form-field"><label>用户<span class="req">*</span></label><input class="ctrl" id="fUser" type="text"  placeholder=""/></div><div class="form-field"><label>来源</label><select class="ctrl" id="fChannel"><option value="在线客服">在线客服</option><option value="电话">电话</option><option value="长者快捷">长者快捷</option><option value="投诉升级">投诉升级</option></select></div><div class="form-field"><label>主题<span class="req">*</span></label><input class="ctrl" id="fTopic" type="text"  placeholder=""/></div><div class="form-field"><label>长者入口</label><select class="ctrl" id="fElder"><option value="是">是</option><option value="否">否</option></select></div><div class="form-field"><label>客服<span class="req">*</span></label><input class="ctrl" id="fAgent" type="text"  placeholder=""/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="待接单">待接单</option><option value="沟通中">沟通中</option><option value="已办结">已办结</option></select></div><div class="form-field"><label>服务记录/备注</label><textarea class="ctrl" id="fNote" rows="3" placeholder=""></textarea></div></div></div>
  <div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div>
</aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script>
<script src="../js/admin-shell.js"></script>
<script src="../js/admin-ui.js"></script>
<script src="../js/admin-page-list.js"></script>
<script>
AdminPageList.mount({
  addTitle: "新建工单",
  editTitle: "编辑",
  viewTitle: "查看详情",
  storageKey: "fulfill:aftersale-cs",
  rows: [{"ticketId":"CS26073101","user":"安辉","channel":"长者快捷","topic":"咨询套餐核销次数","elder":"是","agent":"客服小陈","status":"沟通中","note":"已引导刷新权益码"},{"ticketId":"CS26073008","user":"王敏","channel":"投诉升级","topic":"物流破损","elder":"否","agent":"客服小周","status":"待接单","note":""}],
  columns: [{key:"ticketId"},{key:"user"},{key:"channel"},{key:"topic"},{key:"elder"},{key:"agent"},{key:"status",status:true}],
  filters: [{id:"qKeyword",match:(r,v)=>!v||String(r.ticketId||"").includes(v)||String(r.user||"").includes(v)||String(r.topic||"").includes(v)},{id:"qChannel",match:(r,v)=>!v||String(r.channel)===v},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v}],
  formFields: [{id:"fTicketId",key:"ticketId",type:"text",label:"工单号",required:true},{id:"fUser",key:"user",type:"text",label:"用户",required:true},{id:"fChannel",key:"channel",type:"select",label:"来源",required:false},{id:"fTopic",key:"topic",type:"text",label:"主题",required:true},{id:"fElder",key:"elder",type:"select",label:"长者入口",required:false},{id:"fAgent",key:"agent",type:"text",label:"客服",required:true},{id:"fStatus",key:"status",type:"select",label:"状态",required:false},{id:"fNote",key:"note",type:"text",label:"服务记录/备注",required:false}],
  stats: [{id:"stWait",html:false,value:(l)=>l.filter(r=>r.status==="待接单").length},{id:"stTalk",html:false,value:(l)=>l.filter(r=>r.status==="沟通中").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已办结").length},{id:"stElder",html:false,value:(l)=>l.filter(r=>r.elder==="是").length}],
  getStatus:(r)=>(r.status==="已办结"?{text:r.status,cls:"status-on"}:r.status==="沟通中"?{text:r.status,cls:"status-warn"}:{text:r.status,cls:"status-off"})
});
</script>
</body>
</html>
