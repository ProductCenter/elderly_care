<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>物流异常监控 · 天津康养运营平台</title>
<link rel="stylesheet" href="../css/admin-shell.css"/>
<link rel="stylesheet" href="../css/admin-list.css"/>
</head>
<body data-primary="fulfill" data-sub="logistics-exception" data-tab="物流异常监控" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div>
<template id="page-content">
<div class="page-head">
  <div>
    <h1 class="page-title">物流异常监控</h1>
    <p class="page-desc">识别发货超时、运输停滞、签收超时、退回等异常并生成待办，通知商户与平台处理</p>
  </div>
  <div style="display:flex;gap:8px">
    <a class="btn btn-default" href="./index.html">履约总览</a>
    <button type="button" class="btn btn-primary" id="btnAdd">+ 登记异常</button>
  </div>
</div>
<div class="stat-row"><div class="stat-card"><div class="k">待处理</div><div class="v" id="stOpen">0</div></div><div class="stat-card"><div class="k">处理中</div><div class="v" id="stDoing">0</div></div><div class="stat-card"><div class="k">已闭环</div><div class="v" id="stDone">0</div></div><div class="stat-card"><div class="k">异常单</div><div class="v" id="stAll">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>订单/编号</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>异常类型</label><select class="ctrl" id="qType"><option value="">全部</option><option value="发货超时">发货超时</option><option value="运输停滞">运输停滞</option><option value="签收超时">签收超时</option><option value="退回">退回</option></select></div><div class="filter-item"><label>处理状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待处理">待处理</option><option value="处理中">处理中</option><option value="已闭环">已闭环</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>待办编号</th><th>订单号</th><th>异常类型</th><th>处理方</th><th>发现时间</th><th>处理状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer">
  <div class="drawer-head"><h3 id="drawerTitle">登记异常</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
  <div class="drawer-body"><div class="form-grid"><div class="form-field"><label>待办编号<span class="req">*</span></label><input class="ctrl" id="fTaskId" type="text"  placeholder=""/></div><div class="form-field"><label>订单号<span class="req">*</span></label><input class="ctrl" id="fOrderId" type="text"  placeholder=""/></div><div class="form-field"><label>异常类型<span class="req">*</span></label><select class="ctrl" id="fType"><option value="发货超时">发货超时</option><option value="运输停滞">运输停滞</option><option value="签收超时">签收超时</option><option value="退回">退回</option></select></div><div class="form-field"><label>处理方</label><select class="ctrl" id="fOwner"><option value="商户">商户</option><option value="平台">平台</option><option value="商户+平台">商户+平台</option></select></div><div class="form-field"><label>发现时间<span class="req">*</span></label><input class="ctrl" id="fCreatedAt" type="date"  placeholder=""/></div><div class="form-field"><label>处理状态</label><select class="ctrl" id="fStatus"><option value="待处理">待处理</option><option value="处理中">处理中</option><option value="已闭环">已闭环</option></select></div><div class="form-field"><label>处理说明</label><textarea class="ctrl" id="fAction" rows="3" placeholder=""></textarea></div></div></div>
  <div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div>
</aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script>
<script src="../js/admin-shell.js"></script>
<script src="../js/admin-ui.js"></script>
<script src="../js/admin-page-list.js"></script>
<script>
AdminPageList.mount({
  addTitle: "登记异常",
  editTitle: "编辑",
  viewTitle: "查看详情",
  storageKey: "fulfill:logistics-exception",
  rows: [{"taskId":"EX26073101","orderId":"O20260728003","type":"运输停滞","owner":"商户+平台","createdAt":"2026-07-31","status":"待处理","action":""},{"taskId":"EX26073002","orderId":"O20260726011","type":"发货超时","owner":"商户","createdAt":"2026-07-30","status":"处理中","action":"已催发"},{"taskId":"EX26072903","orderId":"O20260722008","type":"签收超时","owner":"平台","createdAt":"2026-07-29","status":"已闭环","action":"系统自动确认收货"}],
  columns: [{key:"taskId"},{key:"orderId"},{key:"type"},{key:"owner"},{key:"createdAt"},{key:"status",status:true}],
  filters: [{id:"qKeyword",match:(r,v)=>!v||String(r.taskId||"").includes(v)||String(r.orderId||"").includes(v)},{id:"qType",match:(r,v)=>!v||String(r.type)===v},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v}],
  formFields: [{id:"fTaskId",key:"taskId",type:"text",label:"待办编号",required:true},{id:"fOrderId",key:"orderId",type:"text",label:"订单号",required:true},{id:"fType",key:"type",type:"select",label:"异常类型",required:true},{id:"fOwner",key:"owner",type:"select",label:"处理方",required:false},{id:"fCreatedAt",key:"createdAt",type:"date",label:"发现时间",required:true},{id:"fStatus",key:"status",type:"select",label:"处理状态",required:false},{id:"fAction",key:"action",type:"text",label:"处理说明",required:false}],
  stats: [{id:"stOpen",html:false,value:(l)=>l.filter(r=>r.status==="待处理").length},{id:"stDoing",html:false,value:(l)=>l.filter(r=>r.status==="处理中").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.status==="已闭环").length},{id:"stAll",html:false,value:(l)=>l.length}],
  getStatus:(r)=>(r.status==="已闭环"?{text:r.status,cls:"status-on"}:r.status==="处理中"?{text:r.status,cls:"status-warn"}:{text:r.status,cls:"status-off"})
});
</script>
</body>
</html>
