<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>物流轨迹查询 · 天津康养运营平台</title>
<link rel="stylesheet" href="../css/admin-shell.css"/>
<link rel="stylesheet" href="../css/admin-list.css"/>
</head>
<body data-primary="fulfill" data-sub="logistics-track" data-tab="物流轨迹查询" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div>
<template id="page-content">
<div class="page-head">
  <div>
    <h1 class="page-title">物流轨迹查询</h1>
    <p class="page-desc">对接物流轨迹：揽收、运输、派送、签收等节点；用户/商户/平台均可查询</p>
  </div>
  <div style="display:flex;gap:8px">
    <a class="btn btn-default" href="./index.html">履约总览</a>
    <button type="button" class="btn btn-primary" id="btnAdd">+ 录入轨迹</button>
  </div>
</div>
<div class="stat-row"><div class="stat-card"><div class="k">运输中</div><div class="v" id="stOn">0</div></div><div class="stat-card"><div class="k">已签收</div><div class="v" id="stDone">0</div></div><div class="stat-card"><div class="k">异常</div><div class="v" id="stBad">0</div></div><div class="stat-card"><div class="k">轨迹单</div><div class="v" id="stAll">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>运单/订单</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>节点</label><select class="ctrl" id="qNode"><option value="">全部</option><option value="揽收">揽收</option><option value="运输中">运输中</option><option value="派送中">派送中</option><option value="已签收">已签收</option><option value="退回">退回</option></select></div><div class="filter-item"><label>城市</label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>运单号</th><th>订单号</th><th>当前节点</th><th>所在城市</th><th>更新时间</th><th>可见方</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer">
  <div class="drawer-head"><h3 id="drawerTitle">录入轨迹</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
  <div class="drawer-body"><div class="form-grid"><div class="form-field"><label>运单号<span class="req">*</span></label><input class="ctrl" id="fTracking" type="text"  placeholder=""/></div><div class="form-field"><label>订单号<span class="req">*</span></label><input class="ctrl" id="fOrderId" type="text"  placeholder=""/></div><div class="form-field"><label>当前节点<span class="req">*</span></label><select class="ctrl" id="fNode"><option value="揽收">揽收</option><option value="运输中">运输中</option><option value="派送中">派送中</option><option value="已签收">已签收</option><option value="退回">退回</option></select></div><div class="form-field"><label>所在城市<span class="req">*</span></label><input class="ctrl" id="fCity" type="text"  placeholder=""/></div><div class="form-field"><label>更新时间<span class="req">*</span></label><input class="ctrl" id="fUpdatedAt" type="date"  placeholder=""/></div><div class="form-field"><label>可见方</label><select class="ctrl" id="fViewer"><option value="用户/商户/平台">用户/商户/平台</option><option value="商户/平台">商户/平台</option><option value="仅平台">仅平台</option></select></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="正常">正常</option><option value="停滞">停滞</option><option value="异常">异常</option></select></div><div class="form-field"><label>节点说明</label><textarea class="ctrl" id="fDetail" rows="3" placeholder=""></textarea></div></div></div>
  <div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div>
</aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script>
<script src="../js/admin-shell.js"></script>
<script src="../js/admin-ui.js"></script>
<script src="../js/admin-page-list.js"></script>
<script>
AdminPageList.mount({
  addTitle: "录入轨迹",
  editTitle: "编辑",
  viewTitle: "查看详情",
  storageKey: "fulfill:logistics-track",
  rows: [{"trackingNo":"SF1234567890","orderId":"O20260730088","node":"派送中","city":"北京","updatedAt":"2026-07-31","viewer":"用户/商户/平台","status":"正常","detail":"快递员正在派送"},{"trackingNo":"JD9988776655","orderId":"O20260729012","node":"已签收","city":"北京","updatedAt":"2026-07-30","viewer":"用户/商户/平台","status":"正常","detail":"本人签收"},{"trackingNo":"ZT5566778899","orderId":"O20260728003","node":"运输中","city":"廊坊","updatedAt":"2026-07-28","viewer":"商户/平台","status":"停滞","detail":"超48小时无更新"}],
  columns: [{key:"trackingNo"},{key:"orderId"},{key:"node"},{key:"city"},{key:"updatedAt"},{key:"viewer"},{key:"status",status:true}],
  filters: [{id:"qKeyword",match:(r,v)=>!v||String(r.trackingNo||"").includes(v)||String(r.orderId||"").includes(v)},{id:"qNode",match:(r,v)=>!v||String(r.node)===v},{id:"q",field:"city"}],
  formFields: [{id:"fTracking",key:"trackingNo",type:"text",label:"运单号",required:true},{id:"fOrderId",key:"orderId",type:"text",label:"订单号",required:true},{id:"fNode",key:"node",type:"select",label:"当前节点",required:true},{id:"fCity",key:"city",type:"text",label:"所在城市",required:true},{id:"fUpdatedAt",key:"updatedAt",type:"date",label:"更新时间",required:true},{id:"fViewer",key:"viewer",type:"select",label:"可见方",required:false},{id:"fStatus",key:"status",type:"select",label:"状态",required:false},{id:"fDetail",key:"detail",type:"text",label:"节点说明",required:false}],
  stats: [{id:"stOn",html:false,value:(l)=>l.filter(r=>r.node==="运输中"||r.node==="派送中").length},{id:"stDone",html:false,value:(l)=>l.filter(r=>r.node==="已签收").length},{id:"stBad",html:false,value:(l)=>l.filter(r=>r.status==="异常"||r.status==="停滞").length},{id:"stAll",html:false,value:(l)=>l.length}],
  getStatus:(r)=>(r.status==="正常"?{text:r.status,cls:"status-on"}:r.status==="停滞"?{text:r.status,cls:"status-warn"}:{text:r.status,cls:"status-off"})
});
</script>
</body>
</html>
