<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>租赁库存与状态 · 天津康养运营平台</title>
<link rel="stylesheet" href="../css/admin-shell.css"/>
<link rel="stylesheet" href="../css/admin-list.css"/>
</head>
<body data-primary="fulfill" data-sub="aid-stock" data-tab="租赁库存与状态" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div>
<template id="page-content">
<div class="page-head">
  <div>
    <h1 class="page-title">租赁库存与状态</h1>
    <p class="page-desc">管理可租/在租/待归还/维修中/不可租数量；支持库存预占、释放与资产状态查询</p>
  </div>
  <div style="display:flex;gap:8px">
    <a class="btn btn-default" href="./index.html">履约总览</a>
    <button type="button" class="btn btn-primary" id="btnAdd">+ 登记库存</button>
  </div>
</div>
<div class="stat-row"><div class="stat-card"><div class="k">可租总量</div><div class="v" id="stAv">0</div></div><div class="stat-card"><div class="k">在租总量</div><div class="v" id="stRent">0</div></div><div class="stat-card"><div class="k">维修中</div><div class="v" id="stRep">0</div></div><div class="stat-card"><div class="k">紧张/无货</div><div class="v" id="stLow">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>资产/名称</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="充足">充足</option><option value="紧张">紧张</option><option value="无库存">无库存</option></select></div><div class="filter-item"><label>备注</label><input class="ctrl" id="q" placeholder=""/></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>资产编号</th><th>辅具</th><th>可租</th><th>在租</th><th>待归还</th><th>维修中</th><th>不可租</th><th>汇总状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer">
  <div class="drawer-head"><h3 id="drawerTitle">登记库存</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
  <div class="drawer-body"><div class="form-grid"><div class="form-field"><label>资产编号<span class="req">*</span></label><input class="ctrl" id="fAssetId" type="text"  placeholder=""/></div><div class="form-field"><label>辅具<span class="req">*</span></label><input class="ctrl" id="fName" type="text"  placeholder=""/></div><div class="form-field"><label>可租</label><input class="ctrl" id="fAvailable" type="number" value="0" placeholder=""/></div><div class="form-field"><label>在租</label><input class="ctrl" id="fRented" type="number" value="0" placeholder=""/></div><div class="form-field"><label>待归还</label><input class="ctrl" id="fReturning" type="number" value="0" placeholder=""/></div><div class="form-field"><label>维修中</label><input class="ctrl" id="fRepair" type="number" value="0" placeholder=""/></div><div class="form-field"><label>不可租</label><input class="ctrl" id="fBlocked" type="number" value="0" placeholder=""/></div><div class="form-field"><label>汇总状态</label><select class="ctrl" id="fStatus"><option value="充足">充足</option><option value="紧张">紧张</option><option value="无库存">无库存</option></select></div><div class="form-field"><label>备注</label><textarea class="ctrl" id="fNote" rows="3" placeholder=""></textarea></div></div></div>
  <div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div>
</aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script>
<script src="../js/admin-shell.js"></script>
<script src="../js/admin-ui.js"></script>
<script src="../js/admin-page-list.js"></script>
<script>
AdminPageList.mount({
  addTitle: "登记库存",
  editTitle: "编辑",
  viewTitle: "查看详情",
  storageKey: "fulfill:aid-stock",
  rows: [{"assetId":"AID-CT-01","name":"铝合金四脚拐杖","available":26,"rented":12,"returning":2,"repair":1,"blocked":0,"status":"充足","note":""},{"assetId":"AID-BED-02","name":"电动护理床","available":2,"rented":8,"returning":1,"repair":1,"blocked":0,"status":"紧张","note":"预占1台"},{"assetId":"AID-CHAIR-03","name":"防滑沐浴椅","available":0,"rented":0,"returning":0,"repair":3,"blocked":5,"status":"无库存","note":"批次召回"}],
  columns: [{key:"assetId"},{key:"name"},{key:"available"},{key:"rented"},{key:"returning"},{key:"repair"},{key:"blocked"},{key:"status",status:true}],
  filters: [{id:"qKeyword",match:(r,v)=>!v||String(r.assetId||"").includes(v)||String(r.name||"").includes(v)},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v},{id:"q",field:"note"}],
  formFields: [{id:"fAssetId",key:"assetId",type:"text",label:"资产编号",required:true},{id:"fName",key:"name",type:"text",label:"辅具",required:true},{id:"fAvailable",key:"available",type:"number",label:"可租",required:false,default:0},{id:"fRented",key:"rented",type:"number",label:"在租",required:false,default:0},{id:"fReturning",key:"returning",type:"number",label:"待归还",required:false,default:0},{id:"fRepair",key:"repair",type:"number",label:"维修中",required:false,default:0},{id:"fBlocked",key:"blocked",type:"number",label:"不可租",required:false,default:0},{id:"fStatus",key:"status",type:"select",label:"汇总状态",required:false},{id:"fNote",key:"note",type:"text",label:"备注",required:false}],
  stats: [{id:"stAv",html:false,value:(l)=>l.reduce((s,r)=>s+Number(r.available||0),0)},{id:"stRent",html:false,value:(l)=>l.reduce((s,r)=>s+Number(r.rented||0),0)},{id:"stRep",html:false,value:(l)=>l.reduce((s,r)=>s+Number(r.repair||0),0)},{id:"stLow",html:false,value:(l)=>l.filter(r=>r.status!=="充足").length}],
  getStatus:(r)=>(r.status==="充足"?{text:r.status,cls:"status-on"}:r.status==="紧张"?{text:r.status,cls:"status-warn"}:{text:r.status,cls:"status-off"})
});
</script>
</body>
</html>
