<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>归还验收与损坏赔付 · 天津康养运营平台</title>
<link rel="stylesheet" href="../css/admin-shell.css"/>
<link rel="stylesheet" href="../css/admin-list.css"/>
</head>
<body data-primary="fulfill" data-sub="aid-inspect" data-tab="归还验收与损坏赔付" data-asset-prefix="../../assets" data-index-href="../index.html">
<div id="admin-root"></div>
<template id="page-content">
<div class="page-head">
  <div>
    <h1 class="page-title">归还验收与损坏赔付</h1>
    <p class="page-desc">商户验收完好/损坏/配件缺失，计算维修费或赔付金额</p>
  </div>
  <div style="display:flex;gap:8px">
    <a class="btn btn-default" href="./index.html">履约总览</a>
    <button type="button" class="btn btn-primary" id="btnAdd">+ 验收登记</button>
  </div>
</div>
<div class="stat-row"><div class="stat-card"><div class="k">完好</div><div class="v" id="stOk">0</div></div><div class="stat-card"><div class="k">损坏/缺失</div><div class="v" id="stDmg">0</div></div><div class="stat-card"><div class="k">赔付合计</div><div class="v" id="stFee">0</div></div><div class="stat-card"><div class="k">待验收</div><div class="v" id="stWait">0</div></div></div>
<div class="filter-card"><div class="filter-grid"><div class="filter-item"><label>单号/用户</label><input class="ctrl" id="qKeyword" placeholder=""/></div><div class="filter-item"><label>验收结果</label><select class="ctrl" id="qResult"><option value="">全部</option><option value="完好">完好</option><option value="损坏">损坏</option><option value="配件缺失">配件缺失</option></select></div><div class="filter-item"><label>状态</label><select class="ctrl" id="qStatus"><option value="">全部</option><option value="待验收">待验收</option><option value="已计价">已计价</option><option value="已确认">已确认</option></select></div><div class="filter-actions"><button type="button" class="btn btn-primary" id="btnSearch">查询</button><button type="button" class="btn btn-default" id="btnReset">重置</button></div></div></div>
<div class="list-card"><div class="table-wrap"><table class="data-table"><thead><tr><th>验收单</th><th>用户</th><th>辅具</th><th>验收结果</th><th>赔付/维修费</th><th>验收人</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerInfo">共 0 条</span><div class="pager-btns"><button type="button" class="active">1</button></div></div></div>
<div class="drawer-mask" data-drawer-mask="listDrawer" data-close-drawer="listDrawer"></div>
<aside class="drawer" id="listDrawer">
  <div class="drawer-head"><h3 id="drawerTitle">验收登记</h3><button type="button" class="drawer-close" data-close-drawer="listDrawer">×</button></div>
  <div class="drawer-body"><div class="form-grid"><div class="form-field"><label>验收单<span class="req">*</span></label><input class="ctrl" id="fInspectId" type="text"  placeholder=""/></div><div class="form-field"><label>用户<span class="req">*</span></label><input class="ctrl" id="fUser" type="text"  placeholder=""/></div><div class="form-field"><label>辅具<span class="req">*</span></label><input class="ctrl" id="fItem" type="text"  placeholder=""/></div><div class="form-field"><label>验收结果</label><select class="ctrl" id="fResult"><option value="完好">完好</option><option value="损坏">损坏</option><option value="配件缺失">配件缺失</option></select></div><div class="form-field"><label>赔付/维修费</label><input class="ctrl" id="fFee" type="number" value="0" placeholder=""/></div><div class="form-field"><label>验收人<span class="req">*</span></label><input class="ctrl" id="fInspector" type="text"  placeholder=""/></div><div class="form-field"><label>状态</label><select class="ctrl" id="fStatus"><option value="待验收">待验收</option><option value="已计价">已计价</option><option value="已确认">已确认</option></select></div><div class="form-field"><label>验收说明</label><textarea class="ctrl" id="fNote" rows="3" placeholder=""></textarea></div></div></div>
  <div class="drawer-foot"><button type="button" class="btn btn-default" data-close-drawer="listDrawer">取消</button><button type="button" class="btn btn-primary" id="btnSave">保存</button></div>
</aside>
</template>
<script src="../js/admin-nav.js?v=20260821c"></script>
<script src="../js/admin-shell.js"></script>
<script src="../js/admin-ui.js"></script>
<script src="../js/admin-page-list.js"></script>
<script>
AdminPageList.mount({
  addTitle: "验收登记",
  editTitle: "编辑",
  viewTitle: "查看详情",
  storageKey: "fulfill:aid-inspect",
  rows: [{"inspectId":"IS26073001","user":"李娜","item":"防滑沐浴椅","result":"完好","fee":0,"inspector":"店员小李","status":"已确认","note":"外观功能正常"},{"inspectId":"IS26073102","user":"张伟","item":"电动护理床","result":"配件缺失","fee":120,"inspector":"店员小王","status":"已计价","note":"缺失遥控电池盖"}],
  columns: [{key:"inspectId"},{key:"user"},{key:"item"},{key:"result"},{key:"fee"},{key:"inspector"},{key:"status",status:true}],
  filters: [{id:"qKeyword",match:(r,v)=>!v||String(r.inspectId||"").includes(v)||String(r.user||"").includes(v)},{id:"qResult",match:(r,v)=>!v||String(r.result)===v},{id:"qStatus",match:(r,v)=>!v||String(r.status)===v}],
  formFields: [{id:"fInspectId",key:"inspectId",type:"text",label:"验收单",required:true},{id:"fUser",key:"user",type:"text",label:"用户",required:true},{id:"fItem",key:"item",type:"text",label:"辅具",required:true},{id:"fResult",key:"result",type:"select",label:"验收结果",required:false},{id:"fFee",key:"fee",type:"number",label:"赔付/维修费",required:false,default:0},{id:"fInspector",key:"inspector",type:"text",label:"验收人",required:true},{id:"fStatus",key:"status",type:"select",label:"状态",required:false},{id:"fNote",key:"note",type:"text",label:"验收说明",required:false}],
  stats: [{id:"stOk",html:false,value:(l)=>l.filter(r=>r.result==="完好").length},{id:"stDmg",html:false,value:(l)=>l.filter(r=>r.result!=="完好").length},{id:"stFee",html:false,value:(l)=>l.reduce((s,r)=>s+Number(r.fee||0),0)},{id:"stWait",html:false,value:(l)=>l.filter(r=>r.status==="待验收").length}],
  getStatus:(r)=>(r.status==="已确认"?{text:r.status,cls:"status-on"}:r.status==="已计价"?{text:r.status,cls:"status-warn"}:{text:r.status,cls:"status-off"})
});
</script>
</body>
</html>
