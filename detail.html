<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>商品详情</title>
    <link rel="stylesheet" href="./css/detail.css" />    <link rel="stylesheet" href="./css/app-shell.css?v=20260912-covers5" />

  </head>
  <body>
    <div class="phone" id="app">
      <div class="status-bar" aria-hidden="true">
        <span class="status-time">03:04</span>
        <div class="status-right">
          <svg class="status-signal" viewBox="0 0 18 12">
            <rect x="0" y="8" width="3" height="4" rx="0.5" fill="currentColor" />
            <rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="currentColor" />
            <rect x="9" y="2.5" width="3" height="9.5" rx="0.5" fill="currentColor" />
            <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor" opacity=".35" />
          </svg>
          <span class="status-net">5G</span>
          <div class="status-battery"><span class="battery-level"></span></div>
        </div>
      </div>

      <header class="nav-bar">
        <button class="nav-back" type="button" id="btnBack" aria-label="返回">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <h1 class="nav-title">商品详情</h1>
        <div class="mp-capsule" aria-hidden="true">
          <span class="capsule-more"><i></i><i></i><i></i></span>
          <i class="capsule-divider"></i>
          <span class="capsule-home"><i class="ring"></i></span>
        </div>
      </header>

      <main class="page-body">
        <div class="hero">
          <img id="cover" src="" alt="" />
          <span class="hero-tag" id="tag" hidden></span>
        </div>

        <section class="card price-card">
          <div class="price-line">
            <span class="price"><em>¥</em><span id="price">0</span></span>
            <span class="origin" id="originPrice"></span>
            <span class="stock-tag" id="stockTag" hidden>售罄</span>
          </div>
          <div class="service-row">
            <span class="svc-tag" id="serviceTag">到店</span>
            <span class="duration-tag" id="durationTag" hidden></span>
          </div>
          <h2 class="goods-name" id="name"></h2>
          <p class="goods-sub" id="subtitle"></p>
          <div class="meta-row">
            <span id="sales"></span>
            <span id="distance"></span>
            <span id="stockText"></span>
          </div>
        </section>

        <section class="card">
          <h3 class="sec-title">服务亮点</h3>
          <ul class="feature-list" id="features"></ul>
        </section>

        <section class="card" id="storeSection">
          <div class="sec-hd">
            <h3 class="sec-title">适用门店</h3>
            <button type="button" class="store-switch-btn" id="btnSwitchStore" hidden>切换门店</button>
          </div>
          <div class="store-block" id="storeBlock">
            <div class="store-name" id="storeName"></div>
            <div class="store-addr" id="storeAddress"></div>
            <div class="store-extra" id="storeExtra"></div>
          </div>
          <div class="store-loading" id="storeLoading" hidden>门店数据加载中…</div>
        </section>

        <section class="card" id="scopeCard" hidden>
          <h3 class="sec-title">本店服务范围</h3>
          <ul class="feature-list" id="scopeList"></ul>
          <div class="slot-line" id="slotLine"></div>
        </section>

        <section class="card">
          <h3 class="sec-title">商品说明</h3>
          <p class="desc" id="desc"></p>
        </section>
      </main>

      <footer class="action-bar">
        <button class="act-home" type="button" id="btnHome">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>首页</span>
        </button>
        <button class="btn-ghost" type="button" id="btnCart">加入购物车</button>
        <button class="btn-primary" type="button" id="btnBuy">立即购买</button>
      </footer>

      <!-- 切换门店 -->
      <div class="sheet-mask" id="storeMask" hidden></div>
      <div class="sheet" id="storeSheet" hidden>
        <div class="sheet-hd">
          <strong>选择门店</strong>
          <button type="button" class="sheet-close" id="storeSheetClose">关闭</button>
        </div>
        <div class="sheet-bd" id="storeList"></div>
      </div>

      <div class="wx-toast" id="toast" hidden></div>
    </div>

    <script src="./js/products.js?v=20260912-covers7"></script>
    <script src="./js/detail.js"></script>
    <script src="./js/app-shell.js?v=20260912-covers5"></script>

  </body>
</html>
