<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>我的订单</title>
    <link rel="stylesheet" href="./css/orders.css" />    <link rel="stylesheet" href="./css/app-shell.css?v=20260917-tabfix1" />

  </head>
  <body>
    <div class="phone" id="app">
      <div class="status-bar" aria-hidden="true">
        <span class="status-time">16:12</span>
        <div class="status-right">
          <span class="status-net">5G</span>
          <div class="status-battery"><span class="battery-level"></span></div>
        </div>
      </div>

      <header class="nav-bar">
        <button class="nav-back" type="button" id="btnBack" aria-label="返回">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <h1 class="nav-title">我的订单</h1>
        <div class="mp-capsule" aria-hidden="true">
          <span class="capsule-more"><i></i><i></i><i></i></span>
          <i class="capsule-divider"></i>
          <span class="capsule-home"><i class="ring"></i></span>
        </div>
      </header>

      <nav class="tabs" aria-label="订单状态筛选">
        <button type="button" class="tab active" data-filter="all">全部</button>
        <button type="button" class="tab" data-filter="paid">待核销</button>
        <button type="button" class="tab" data-filter="verified">已完成</button>
        <button type="button" class="tab" data-filter="other">其他</button>
      </nav>

      <main class="page-body">
        <ul class="order-list" id="orderList"></ul>
        <div class="empty" id="empty" hidden>
          <p>暂无订单</p>
          <a href="./index.html">去商城逛逛</a>
        </div>
      </main>

            <nav class="tabbar has-agent" aria-label="主导航"></nav>
    </div>

    <script src="./js/products.js?v=20260912-covers5"></script>
    <script src="./js/hmac.js"></script>
    <script src="./js/verify-code.js"></script>
    <script src="./js/orders.js"></script>
    <script src="./js/app-shell.js?v=20260917-home2tab"></script>

  </body>
</html>
