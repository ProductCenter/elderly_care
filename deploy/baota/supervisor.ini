# 宝塔 → 软件商店 → Supervisor管理器 → 添加守护进程
# 名称: kangyang-mall
# 运行目录: /www/wwwroot/kangyang-mall
# 启动命令: /usr/bin/python3 scripts/llm_server.py
# 环境变量: HOST=0.0.0.0 PORT=8091
# （密钥写在项目根目录 llm.env，服务启动时会自动加载）

[program:kangyang-mall]
directory=/www/wwwroot/kangyang-mall
command=/usr/bin/python3 scripts/llm_server.py
environment=HOST="0.0.0.0",PORT="8091"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/www/wwwlogs/kangyang-mall.out.log
stderr_logfile=/www/wwwlogs/kangyang-mall.err.log
user=www
