<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>学堂 · 春风康养</title>
    <link rel="stylesheet" href="./css/mall.css?v=20260916-nowrap1" />
    <link rel="stylesheet" href="./css/section-articles.css?v=20260916-nowrap1" />
    <link rel="stylesheet" href="./css/app-shell.css?v=20260917-tabfix1" />
    <style>
      .page-wrap { padding: 12px 12px 88px; }
      .page-title { font-size: 18px; font-weight: 750; margin: 8px 0 4px; }
      .page-sub { font-size: 12px; color: #8a7a68; margin-bottom: 12px; }
      .nav-back { border:0; background:transparent; font-size:28px; line-height:1; padding:0 8px; color:#2b241c; }
      .xue-bc { margin-top: 18px; }
      .xue-bc .sec-art-head { margin-bottom: 10px; }
      .xue-bc-card {
        display: grid; grid-template-columns: 82px 1fr; gap: 10px;
        background: #fffef9; border: 1px solid rgba(184,126,62,.2); border-radius: 3px;
        padding: 15px 10px; margin-bottom: 10px; text-decoration: none; color: inherit;
      }
      .xue-bc-card img { width: 82px; height: 82px; object-fit: cover; border-radius: 2px; border: 0; box-shadow: none; background: #fff3eb; }
      .xue-bc-card strong { display: block; font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .xue-bc-card p { margin: 0; font-size: 12px; color: #8a7a68; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <div class="phone" id="app">
      <div class="status-bar" aria-hidden="true"><span class="status-time">15:10</span></div>
      <header class="nav-bar">
        <button type="button" class="nav-back" id="btnBack" aria-label="返回">‹</button>
        <h1 class="nav-title">学堂</h1>
        <div class="mp-capsule" aria-hidden="true">
          <span class="capsule-more"><span></span><span></span><span></span></span>
          <i class="capsule-divider"></i>
          <span class="capsule-home"><i class="ring"></i></span>
        </div>
      </header>
      <main class="page-wrap">
        <h2 class="page-title">康养学堂</h2>
        <p class="page-sub">健康科普 · 课程图文 · 可进详情阅读</p>
        <section class="sec-art-block" aria-label="学堂文章列表" style="margin-top:0;padding-top:0;">
          <div class="sec-art-head">
            <h3>学堂文章</h3>
            <span>点击阅读全文</span>
          </div>
          <div id="articleList"></div>
        </section>
        <section class="xue-bc" aria-label="相关广播">
          <div class="sec-art-head">
            <h3>相关广播站内容</h3>
            <span>图文 / 视频</span>
          </div>
          <div id="xueBroadcasts"></div>
        </section>
      </main>
            <nav class="tabbar has-agent" aria-label="主导航"></nav>
    </div>
    <script src="./js/mall-links.js?v=20260916-card10"></script>
    <script src="./js/section-articles.js?v=20260916-card10"></script>
    <script src="./js/xue.js?v=20260916-card10"></script>
    <script src="./js/agent-avatar.js?v=20260915-tabagent"></script>
    <script src="./js/app-shell.js?v=20260917-home2tab"></script>
  </body>
</html>
