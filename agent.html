<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6eee2" />
    <title>AI 智伴 · 康小护</title>
    <link rel="stylesheet" href="./css/agent.css?v=20260912-scroll1" />
    <link rel="stylesheet" href="./css/app-shell.css?v=20260912-covers5" />

  </head>
  <body>
    <div class="phone" id="app">
      <div class="status-bar" aria-hidden="true">
        <span class="status-time" id="statusTime">20:10</span>
        <div class="status-right">
          <span class="status-net">5G</span>
          <div class="status-battery"><span class="battery-level"></span></div>
        </div>
      </div>

      <header class="nav-bar">
        <button type="button" class="nav-back" id="btnBack" aria-label="返回">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"
            />
          </svg>
        </button>
        <h1 class="nav-title">AI 智伴</h1>
        <div class="mp-capsule" aria-hidden="true">
          <span class="capsule-more"><span></span><span></span><span></span></span>
          <i class="capsule-divider"></i>
          <span class="capsule-home"><i class="ring"></i></span>
        </div>
      </header>

      <div class="llm-banner" id="llmBanner" hidden>
        <span id="llmBannerText">大模型未配置</span>
        <button type="button" class="llm-banner-btn" id="btnLlmHint">怎么配</button>
      </div>

      <main class="page-body" id="pageBody">
        <section class="welcome" id="welcomePane" aria-label="康小护欢迎语">
          <div class="hero">
            <div class="hero-figure" aria-hidden="true">
              <img
                src="./assets/moko-avatar.png"
                alt=""
                width="160"
                height="160"
                decoding="async"
              />
            </div>
            <div class="hero-copy">
              <h2 class="hero-greet">
                <span id="heroGreetLead">晚上好</span>，<em>康小护</em> 在
              </h2>
              <p class="hero-sub" id="heroSub">
                先看林家双老的需求、供给和匹配 👇
              </p>
            </div>
          </div>

          <section class="guess" aria-label="猜你想问">
            <div class="guess-hd">
              <span>试试这些</span>
              <button type="button" class="guess-refresh" id="btnRefresh" aria-label="换一换">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 0 1-8.9 3.1L6.7 17.5A7 7 0 0 0 19 13c0-3.87-3.13-7-7-7zm-7 7c0-1.48.46-2.85 1.25-4L4.85 7.6A8.96 8.96 0 0 0 3 13a9 9 0 0 0 9 9v-2a7 7 0 0 1-7-7z"
                  />
                </svg>
                换一换
              </button>
            </div>
            <div class="guess-list" id="guessList" role="list"></div>
          </section>

          <section class="chat" id="chatPane" hidden aria-label="对话">
            <div class="chat-stream" id="chatStream"></div>
          </section>
        </section>
      </main>

      <footer class="composer">
        <div class="quick-row" id="quickRow" role="group" aria-label="快捷入口">
          <button type="button" class="quick-btn" data-act="family">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zM8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
              />
            </svg>
            我家爸妈
          </button>
          <button type="button" class="quick-btn" data-act="canteen">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"
              />
            </svg>
            附近食堂
          </button>
          <button type="button" class="quick-btn" data-act="care">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
              />
            </svg>
            上门照护
          </button>
          <button type="button" class="quick-btn" data-act="health">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M19 3H5a2 2 0 0 0-2 2v14l4-2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 12h-2v-2H8v-2h2V9h2v2h2v2h-2v2z"
              />
            </svg>
            健康数据
          </button>
          <button type="button" class="quick-btn" data-act="activity">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M17 12h-5v5h5v-5zM16 1v3H8V1H6v3H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-1V1h-2z"
              />
            </svg>
            社区活动
          </button>
        </div>

        <div class="voice-bar" id="voiceBar">
          <button type="button" class="voice-side" id="btnMenu" aria-label="新对话">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M4 7h16v2H4V7zm0 4h16v2H4v-2zm0 4h16v2H4v-2z" />
            </svg>
          </button>
          <button type="button" class="voice-hold" id="btnHold">按住说话</button>
          <button type="button" class="voice-side" id="btnKeyboard" aria-label="键盘输入">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm2 3h2v2H6V9zm4 0h2v2h-2V9zm4 0h2v2h-2V9zm4 0h2v2h-2V9zM6 13h2v2H6v-2zm4 0h8v2h-8v-2z"
              />
            </svg>
          </button>
        </div>

        <form class="text-bar" id="textBar" hidden>
          <button type="button" class="voice-side" id="btnToVoice" aria-label="语音输入">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"
              />
            </svg>
          </button>
          <input
            class="text-input"
            id="textInput"
            type="text"
            enterkeyhint="send"
            autocomplete="off"
            placeholder="问问康小护…"
            maxlength="500"
          />
          <button type="submit" class="text-send" id="btnSend" aria-label="发送">发送</button>
        </form>
      </footer>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="./js/agent-family-demo.js?v=20260914-cog1"></script>
    <script src="./js/agent-markdown.js?v=20260912-map2"></script>
    <script src="./js/agent.js?v=20260914-oneport"></script>
    <script src="./js/app-shell.js?v=20260912-covers5"></script>

  </body>
</html>
