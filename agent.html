<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6eee2" />
    <title>AI 智伴 · 康小护</title>
    <link rel="stylesheet" href="./css/agent.css?v=20260929-human" />
    <link rel="stylesheet" href="./css/app-shell.css?v=20260917-tabfix1" />

  </head>
  <body>
    <div class="phone" id="app">
      <div class="status-bar" aria-hidden="true">
        <span class="status-time" id="statusTime">20:10</span>
        <div class="status-right">
          <span class="status-net">5G</span>
          <div class="status-battery"><span class="battery-level"></span></div>
        </div>
      </div>

      <header class="nav-bar">
        <button type="button" class="nav-back" id="btnBack" aria-label="返回">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"
            />
          </svg>
        </button>
        <h1 class="nav-title" id="navTitle">AI 智伴</h1>
        <div class="mp-capsule" aria-hidden="true">
          <span class="capsule-more"><span></span><span></span><span></span></span>
          <i class="capsule-divider"></i>
          <span class="capsule-home"><i class="ring"></i></span>
        </div>
      </header>

      <div class="human-banner" id="humanBanner" hidden>
        <div class="human-banner-main">
          <span class="human-dot" aria-hidden="true"></span>
          <span id="humanBannerText">人工客服服务中</span>
        </div>
        <button type="button" class="human-banner-btn" id="btnEndHuman">结束人工</button>
      </div>

      <div class="llm-banner" id="llmBanner" hidden>
        <span id="llmBannerText">大模型未配置</span>
        <button type="button" class="llm-banner-btn" id="btnLlmHint">怎么配</button>
      </div>

      <main class="page-body" id="pageBody">
        <section class="welcome" id="welcomePane" aria-label="康小护欢迎语">
          <div class="hero">
            <button type="button" class="hero-figure" id="btnAvatarSwitch" aria-label="更换智伴形象">
              <img
                id="heroAvatar"
                src="./assets/moko-avatar.png"
                alt="康小护"
                width="160"
                height="160"
                decoding="async"
                data-agent-avatar
              />
              <span class="avatar-switch">换形象</span>
            </button>
            <div class="hero-copy">
              <h2 class="hero-greet">
                <span id="heroGreetLead">晚上好</span>，<em id="heroAgentName">康小护</em> 在
              </h2>
              <p class="hero-sub" id="heroSub">
                无设备也能用报告、面诊示意和朋友圈关心爸妈 👇
              </p>
            </div>
          </div>


          <section class="guess" aria-label="猜你想问">
            <div class="guess-hd">
              <span>试试这些</span>
              <button type="button" class="guess-refresh" id="btnRefresh" aria-label="换一换">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 0 1-8.9 3.1L6.7 17.5A7 7 0 0 0 19 13c0-3.87-3.13-7-7-7zm-7 7c0-1.48.46-2.85 1.25-4L4.85 7.6A8.96 8.96 0 0 0 3 13a9 9 0 0 0 9 9v-2a7 7 0 0 1-7-7z"
                  />
                </svg>
                换一换
              </button>
            </div>
            <div class="guess-list" id="guessList" role="list"></div>
          </section>

          <section class="chat" id="chatPane" hidden aria-label="对话">
            <div class="chat-stream" id="chatStream"></div>
          </section>
        </section>
      </main>

      <footer class="composer">
                <div class="quick-row" id="quickRow" role="group" aria-label="快捷入口">
          <button type="button" class="quick-btn" data-act="face">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5z"/></svg>
            AI面诊
          </button>
          <button type="button" class="quick-btn" data-act="tongue">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v4.5A5.5 5.5 0 0 0 12.5 17H13a4 4 0 0 0 4-4V7a5 5 0 0 0-5-5zm1 13.9A3.5 3.5 0 0 1 9.5 12.5V11h7v2a2 2 0 0 1-2 2h-.5z"/></svg>
            AI舌诊
          </button>
          <button type="button" class="quick-btn" data-act="report">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm1 15H9v-2h6v2zm0-4H9v-2h6v2zm-1-5V3.5L18.5 8H14z"/></svg>
            上传报告
          </button>
          <button type="button" class="quick-btn" data-act="camera">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 17a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm8-10h-2.2l-1.4-2H7.6L6.2 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/></svg>
            拍照识别
          </button>
          <button type="button" class="quick-btn" data-act="family">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zM8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            我家爸妈
          </button>
          <button type="button" class="quick-btn" data-act="canteen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
            寻找美食
          </button>
          <button type="button" class="quick-btn" data-act="human">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-6.5 6A3.5 3.5 0 0 1 9 14.5h6a3.5 3.5 0 0 1 3.5 3.5V20H5.5v-2zM18.5 7a1.5 1.5 0 1 1-1.5 1.5A1.5 1.5 0 0 1 18.5 7zm0 3.2c1.38 0 4.1.69 4.1 2.07V14h-2.2v-1.3c0-.4-.86-.7-1.9-.7s-1.9.3-1.9.7V14h-.4c.12-.7.56-1.9 2.3-2.8z"/></svg>
            转人工
          </button>
        </div>

        <div class="voice-bar" id="voiceBar">
          <button type="button" class="voice-side" id="btnMenu" aria-label="新对话">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M4 7h16v2H4V7zm0 4h16v2H4v-2zm0 4h16v2H4v-2z" />
            </svg>
          </button>
          <button type="button" class="voice-hold" id="btnHold">按住说话</button>
          <button type="button" class="voice-side" id="btnKeyboard" aria-label="键盘输入">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm2 3h2v2H6V9zm4 0h2v2h-2V9zm4 0h2v2h-2V9zm4 0h2v2h-2V9zM6 13h2v2H6v-2zm4 0h8v2h-8v-2z"
              />
            </svg>
          </button>
        </div>

        <form class="text-bar" id="textBar" hidden>
          <button type="button" class="voice-side" id="btnToVoice" aria-label="语音输入">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"
              />
            </svg>
          </button>
          <input
            class="text-input"
            id="textInput"
            type="text"
            enterkeyhint="send"
            autocomplete="off"
            placeholder="问问康小护…"
            maxlength="500"
          />
          <button type="submit" class="text-send" id="btnSend" aria-label="发送">发送</button>
        </form>
      </footer>
      <nav class="tabbar has-agent" aria-label="主导航"></nav>
    </div>



    <div class="avatar-mask" id="avatarMask" hidden></div>
    <div class="avatar-sheet-pop" id="avatarSheet" hidden role="dialog" aria-labelledby="avatarSheetTitle">
      <div class="avatar-sheet-pop-hd">
        <strong id="avatarSheetTitle">选择智伴形象</strong>
        <button type="button" class="avatar-sheet-pop-close" id="btnAvatarClose">完成</button>
      </div>
      <p class="avatar-sheet-pop-tip">点选后会记住，商城首页与对话页同步</p>
      <div class="avatar-options" id="avatarOptions"></div>
    </div>

    <div class="capture-mask" id="captureMask" hidden></div>
    <div class="capture-sheet" id="captureSheet" hidden role="dialog" aria-labelledby="captureTitle">
      <div class="capture-hd">
        <strong id="captureTitle">拍照上传</strong>
        <button type="button" class="capture-close" id="captureClose">关闭</button>
      </div>
      <p class="capture-desc" id="captureDesc">请拍照或从相册选择图片</p>
      <ol class="capture-steps" id="captureSteps">
        <li class="on">① 选图</li>
        <li>② 预览确认</li>
        <li>③ 智伴解读</li>
      </ol>
      <div class="capture-stage" id="captureStage">
        <div class="capture-empty" id="captureEmpty">
          <p>还没有图片</p>
          <span>支持现场拍照或相册上传（演示）</span>
        </div>
        <img class="capture-preview" id="capturePreview" alt="预览" hidden />
      </div>
      <div class="capture-actions" id="captureActions">
        <button type="button" class="capture-btn" id="btnCaptureCamera">拍照</button>
        <button type="button" class="capture-btn ghost" id="btnCaptureAlbum">相册上传</button>
        <button type="button" class="capture-btn ghost" id="btnCaptureDemo">用演示样图</button>
      </div>
      <div class="capture-confirm" id="captureConfirm" hidden>
        <button type="button" class="capture-btn ghost" id="btnCaptureRetake">重拍 / 重选</button>
        <button type="button" class="capture-btn primary" id="btnCaptureSubmit">确认并解读</button>
      </div>
      <input id="captureFileCamera" type="file" accept="image/*" capture="environment" hidden />
      <input id="captureFileAlbum" type="file" accept="image/*" hidden />
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="./js/agent-avatar.js?v=20260917-tabs1"></script>
    <script src="./js/agent-family-demo.js?v=20260923-need"></script>
    <script src="./js/agent-markdown.js?v=20260915-content1"></script>
    <script src="./js/agent-human.js?v=20260929-human1"></script>
    <script src="./js/agent.js?v=20260929-human1"></script>
    <script src="./js/app-shell.js?v=20260917-home2tab"></script>

  </body>
</html>
